global
    # modern configuration
        ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-bind-options prefer-client-ciphers no-sslv3 no-tlsv10 no-tlsv11 no-tlsv12 no-tls-tickets

        ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
        ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11  no-tls-tickets force-tlsv12
        log stdout format raw local0

defaults
#       default-server init-addr none
        mode http
       option forwardfor
        timeout connect 5000
        timeout check 5000
        timeout client 30000
        timeout server 30000
        log global
        option httplog
        option dontlognull

resolvers my_dns
  nameserver ns 10.101.32.10:53


frontend elasticsearch
       mode    http
       bind    *:9200 ssl crt /etc/foo/haproxy.pem ca-file /etc/foo/ca.crt verify required crl-file /etc/foo/crl.pem
      # acl             network_allowed src 20.30.40.50 8.9.9.0/27
      # tcp-request     connection reject if !network_allowed
      # server          mysqlvip 10.0.0.30:3306
     use_backend elasticsearch

frontend elasticsearch-test
       mode    http
       bind    *:9201
       use_backend elasticsearch

backend elasticsearch
    server es sandbox-es-http.elastic.svc.cluster.local:9200 ssl verify none resolvers my_dns
