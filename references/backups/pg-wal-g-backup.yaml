
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-wal-g-backup
  namespace: harbor
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox
        vault.hashicorp.com/agent-inject-secret-config: "secret/minio-credentials"
        vault.hashicorp.com/role: "harbor"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/minio-credentials" -}}
            export WALG_S3_PREFIX="s3://minio-xbackup-ardent-rarity-239115/harbor/"
            export AWS_ENDPOINT="http://minio.minio:9000"
            export AWS_REGION=minio
            export AWS_S3_FORCE_PATH_STYLE="true"
            export PGHOST=harbor-harbor-database
            export PGPORT=5432
            export PGUSER=postgres
            export PGDATA=/data
            #echo '{{ .Data.backup }}' > /tmp/minio-creds
            #export AWS_ACCESS_KEY_ID=$( /tmp/jq .accessKey /tmp/minio-creds )
            #export AWS_SECRET_ACCESS_KEY=$( /tmp/jq .secretKey /tmp/minio-creds )
            export AWS_ACCESS_KEY_ID={{ .Data.accessKey}}
            export AWS_SECRET_ACCESS_KEY={{ .Data.secretKey }}
          {{- end }}
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
              claimName: database-data-harbor-harbor-database-0
      containers:
      - name: pgwalgbackup
        image: debian
        volumeMounts:
        - mountPath: "/data"
          name: data
        command: ["sh",  "-c"]
        args:
         -  apt update && apt install -y tar wget ;
           wget https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64 -O /tmp/jq ;
           wget https://github.com/wal-g/wal-g/releases/download/v0.2.19/wal-g.linux-amd64.tar.gz -O /tmp/wal-g.linux-amd64.tar.gz ;
           chmod +x /tmp/jq ;
           source /vault/secrets/config ;
           cd tmp && tar -xvf wal-g.linux-amd64.tar.gz ;
           sleep 3d
        env:
        - name: PGPASSWORD
          valueFrom:
                secretKeyRef:
                  name: harbor-harbor-database
                  key:  POSTGRES_PASSWORD
      restartPolicy: Never
  backoffLimit: 4
