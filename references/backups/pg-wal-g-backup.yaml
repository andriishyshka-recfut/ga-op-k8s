
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-wal-g-backup
  namespace: harbor
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox-green
        vault.hashicorp.com/agent-inject-secret-config: "secret/minio/users"
        vault.hashicorp.com/role: "harbor"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/minio/users" -}}
                    export WALG_S3_PREFIX="s3://minio-xbackup-ardent-rarity-239115/harbor-backup"
                    export AWS_ENDPOINT="http://minio.minio:9000"
                    export AWS_REGION=minio
                    export AWS_S3_FORCE_PATH_STYLE="true"
                    export PGHOST=harbor-harbor-database
                    export PGPORT=5432
                    export PGUSER=postgres
            export AWS_ACCESS_KEY_ID=$(echo {{ .Data.backup }}| jq .accessKey)
            export AWS_SECRET_ACCESS_KEY=(echo {{ .Data.backup }}| jq .secretKey)
          {{- end }}
    spec:
      containers:
      - name: pg-wal-g-backup
        image: bitnami/wal-g
        command: ["bash",  "-c"]
        args:
         - apt install -y jq
           source /vault/secrets/config
           sleep 3d
        env:
        - name: PGPASSWORD
          valueFrom:
                secretKeyRef:
                  name: harbor-harbor-database
                  key:  POSTGRES_PASSWORD
      restartPolicy: Never
  backoffLimit: 4
