
apiVersion: batch/v1
kind: Job
metadata:
  name: test-job
  namespace: kafka
spec:
  template:

    spec:
      containers:
      - name: test
        image: debian
        resources:
          requests:
            cpu: 10m
        command: ["sh",  "-c"]
        args:
         -   sleep 3d
      restartPolicy: Never
  backoffLimit: 4
