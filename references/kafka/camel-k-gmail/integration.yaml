apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka.props
data:
  application.properties: |
   kafka.brokers=kafka-cluster-kafka-bootstrap:9092
   consumer.topic=gmail
   consumer.maxPollRecords=5000
   consumer.consumersCount=1
   consumer.group=kafka-gmail
   gmail.applicationName="camel-k-gmail"
   gmail.clientId={{secret:gmail-credentials/clinetId}}
   gmail.clientSecret={{secret:gmail-credentials/clinetSecret}}


---
apiVersion: camel.apache.org/v1
kind: Integration
metadata:
  name: kafka-restore
spec:
  # dependencies:
  # https://repo.maven.apache.org/maven2/org/apache/camel/camel-minio/3.5.0/camel-minio-3.5.0.jar
  # - mvn:org.apache.camel:camel-minio:3.5.0:camel-minio-3.5.0.jar
  configuration:
  - type: configmap
    value: kafka.props
  - type: secret
    value: minio-credentials
  sources:
  - name: kafka-restore.groovy
    content: |
        from("kafka:{{consumer.topic}}?brokers={{kafka.brokers}}"
             + "&maxPollRecords={{consumer.maxPollRecords}}"
             + "&consumersCount={{consumer.consumersCount}}"
             + "&groupId={{consumer.group}}"
             + "&autoCommitEnable=false"
             + "&allowManualCommit=true"
             + "&autoOffsetReset=earliest"
             + "&additionalProperties.exclude.internal.topics=false"
             + "&clientId=__admin_client")
        toD("google-mail:messages/send?applicationName={{ gmail.applicationName }}"
             + "&clientId={{gmail.clientId}}"
             + "&clientSecret={{gmail.clientSecret}}"
             + "&content="

        );
