apiVersion: v1
kind: Service
metadata:
  name: kafka-nodeport
  namespace: kafka
spec:
  type: NodePort
  ports:
  - name: tcp-replication
    port: 9091
    protocol: TCP
    targetPort: 9091
    nodePort: 32091
  - name: tcp-clients
    port: 9092
    protocol: TCP
    targetPort: 9092
    nodePort: 32092
  - name: tcp-clientstls
    port: 9093
    protocol: TCP
    targetPort: 9093
    nodePort: 32093
  selector:
    strimzi.io/cluster: kafka-cluster
    strimzi.io/kind: Kafka
    strimzi.io/name: kafka-cluster-kafka
  sessionAffinity: None
