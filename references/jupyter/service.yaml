apiVersion: v1
kind: Service
metadata:
  name: jupyter-svc
  namespace: jupyter
spec:
  ports:
  - name: http-first
    port: 8888
    protocol: TCP
    targetPort: 8888
  - name: http-second
    port: 4040
    protocol: TCP
    targetPort: 4040
  selector:
    app: jupyter
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: jupyter
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: false
  ports:
  - name: http-first
    port: 8888
    protocol: TCP
    targetPort: 8888
  - name: http-second
    port: 4040
    protocol: TCP
    targetPort: 4040
  selector:
    app: jupyter
