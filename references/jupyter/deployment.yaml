apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-svc
  namespace: jupyter
spec:
  selector:
    matchLabels:
      app: jupyter
  replicas: 1
  template:
    metadata:
      labels:
        app: jupyter
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        workloadsType: jupyter
      tolerations:
        - key: "workloadsType"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: jupyter
          image: jupyter/all-spark-notebook:x86_64-notebook-6.5.4
          volumeMounts:
            - name: users
              mountPath: "/home/jovyan/.jupyter/jupyter_server_config.py"
              subPath: "jupyter_server_config.py"
            - name: works
              mountPath: "/home/jovyan"
          env:
            - name: DOCKER_STACKS_JUPYTER_CMD
              value: notebook
          ports:
            - containerPort: 8888
            - containerPort: 4040
          resources:
            requests:
              memory: "15360Mi"
              cpu: 1
            limits:
              memory: "15360Mi"
              cpu: 4
      volumes:
        - name: users
          secret:
            secretName: users
        - name: works
          persistentVolumeClaim:
            claimName: jupiter-pvc
      imagePullSecrets:
        - name: harbor
