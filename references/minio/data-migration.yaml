apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mega-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 3500Gi
  storageClassName: standard-rwo
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mega-data-migrate
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
              claimName: mega-data
      containers:
      - name: mega-get
        image: debian
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: "/data"
          name: data
        env:
          - name: MEGA_LOGIN
            valueFrom:
              secretKeyRef:
                name: mega-creds
                key: username
          - name: MEGA_PASS
            valueFrom:
              secretKeyRef:
                name: mega-creds
                key: password
          - name: LANG
            value: "C.UTF-8"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: accesskey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secretkey
        command: ["bash",  "-c"]
        args:
         - apt update && apt install -y  tar wget procps htop sysstat vim less ;
           wget --quiet https://mega.nz/linux/MEGAsync/Debian_10.0/amd64/megacmd-Debian_10.0_amd64.deb ;
           apt install -y ./megacmd-Debian_10.0_amd64.deb ;
           mega-login $MEGA_LOGIN $MEGA_PASS;
           wget --quiet https://dl.min.io/client/mc/release/linux-amd64/mc ;
           chmod +x /mc ;
           export MC_HOST_minio=http://$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY@minio:9000/ ;
           /mc mirror --overwrite --watch --exclude *.getxfer*mega /data/ minio/minio-meganz-migrate-orbital-wording-233917/ ;
           sleep 10d
      restartPolicy: OnFailure
  backoffLimit: 4
           # mega-get -m \!\!\!\!\ Sort\ bases\ \!\!\!\! /data/\!\!\!\!\ Sort\ bases\ \!\!\!\! &&  echo "Sort Bases - Done" ;
           # wget --quiet  https://github.com/kahing/goofys/releases/download/v0.24.0/goofys ;
           # chmod +x goofys;
