apiVersion: certmanager.k8s.io/v1alpha1
kind: ClusterIssuer
metadata:
  name: selfsigning-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: ingress-cert
  namespace: nginx
spec:
  secretName: ingress-cert
  commonName: nginx.infra.geminia.com
  issuerRef:
    name: selfsigning-issuer
    kind: ClusterIssuer
  dnsNames:
  - nginx.infra.geminia.com
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: nginx
spec:
  hosts:
  - "nginx.infra.geminia.com"
  gateways:
  - nginx-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 80
        host: nginx.nginx.svc.cluster.local
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    # add an annotation indicating the issuer to use.
    cert-manager.io/cluster-issuer: ingress-cert
    kubernetes.io/ingress.class: istio
  name: nginx.infra.geminia.com
  namespace: nginx
spec:
  rules:
  - host: nginx.infra.geminia.com
    http:
      paths:
      - backend:
          serviceName: nginx
          servicePort: 80
        path: /
  tls: # < placing a host in the TLS config will indicate a certificate should be created
  - hosts:
    - nginx.infra.geminia.com
    secretName: ingress-cert
