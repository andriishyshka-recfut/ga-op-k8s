apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express
        ports:
        - containerPort: 8081
        command: ["node"]
        args: ["app"]
        env:
        # - name: ME_CONFIG_OPTIONS_EDITORTHEME
        #   value: 'ambiance'
        - name: ME_CONFIG_MONGODB_SERVER
          value: ''
        # - name: ME_CONFIG_BASICAUTH_USERNAME
        #   value: 'me'
        # - name: ME_CONFIG_BASICAUTH_PASSWORD
        #   value: 'pass'
        # - name: ME_CONFIG_MONGODB_ENABLE_ADMIN
        #   value: 'true'
        # - name: ME_CONFIG_OPTIONS_READONLY
        #   value: 'false'
        # - name: ME_CONFIG_MONGODB_ADMINUSERNAME
        #   value: 'mongoExpress'
        # - name: ME_CONFIG_MONGODB_ADMINPASSWORD
        #   value: 'superSecret'
        # - name: ME_CONFIG_MONGODB_AUTH_USERNAME
        #   value: 'mongoExpress'
        # - name: ME_CONFIG_MONGODB_AUTH_PASSWORD
        #   value: 'superSecret'
        # - name: ME_CONFIG_MONGODB_AUTH_PASSWORD
        #   value: 'example'
        - name: ME_CONFIG_MONGODB_URL
          # value: 'mongodb://mongoExpress:superSecret@my-cluster-name-rs0:27017'
          value: 'mongodb://mongoExpress:superSecret@my-cluster-name-rs0:27017/example?ssl=false&slaveOk=true'
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  labels:
    app: mongo-express
spec:
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: mongo-express
