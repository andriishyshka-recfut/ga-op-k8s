apiVersion: cert-manager.io/v1alpha2
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: basic-ca
---
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: gitlab-cert
  namespace: istio-system
spec:
  secretName: gitlab-cert
  commonName: "gitlab.infra.digaweb.com"
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: registry-cert
  namespace: istio-system
spec:
  secretName: registry-cert
  commonName: "registry.infra.digaweb.com"
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: minio-cert
  namespace: istio-system
spec:
  secretName: minio-cert
  commonName: "minio.infra.digaweb.com"
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
