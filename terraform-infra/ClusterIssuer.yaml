apiVersion: cert-manager.io/v1alpha2
kind: ClusterIssuer
metadata:
  name: vault-issuer
  namespace: default
spec:
  vault:
    path: pki/sign/cert-manager-infra
    server: http://vault.vault.svc
    auth:
      kubernetes:
        role: cert-manager-infra
        mountPath: /v1/auth/k8s-infra
        secretRef:
          name: infra-cert-manager-token-djtgx
          key: token
