apiVersion: cert-manager.io/v1alpha2
kind: Issuer
metadata:
  name: ca-issuer
  namespace: istio-system
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: ingress-cert
  namespace: istio-system
spec:
  secretName: istio-ingressgateway-certs
  commonName: nginx.infra.digaweb.local
  issuerRef:
    name: ca-issuer
    kind: Issuer
