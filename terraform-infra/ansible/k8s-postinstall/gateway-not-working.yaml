---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: nginx
spec:
  hosts:
  - "nginx.infra.digaweb.local"
  gateways:
  - nginx-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 80
        host: nginx.nginx.svc.cluster.local
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    # add an annotation indicating the issuer to use.
    cert-manager.io/cluster-issuer: ingress-cert
    kubernetes.io/ingress.class: istio
  name: nginx.infra.digaweb.local
  namespace: nginx
spec:
  rules:
  - host: nginx.infra.digaweb.local
    http:
      paths:
      - backend:
          serviceName: nginx
          servicePort: 80
        path: /
  tls: # < placing a host in the TLS config will indicate a certificate should be created
  - hosts:
    - nginx.infra.digaweb.local
    secretName: ingress-cert
