- hosts: gcp_name_bastion
  connection: ssh
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - debug: msg="{{ ansible_hostname }}"

    - name: Get mapping of istio gw NodePort
      shell: |
        kubectl get svc istio-ingressgateway -o json -n istio-system
      register: nodeport_mapping
      delegate_to: localhost
      become: False
      changed_when: False

    - debug: msg="nodePort is {{ item.nodePort }}"
      with_items: '{{ (nodeport_mapping.stdout | from_json).spec.ports }}'
      when: item.name == 'https'

    - name: set nodePort
      set_fact:
        nodePort:  "{{ item.nodePort }}"
      with_items: '{{ (nodeport_mapping.stdout | from_json).spec.ports }}'
      when: item.name == 'https'

    - name: Get node ips
      shell: |
        kubectl get nodes -o jsonpath="{.items[*].status.addresses[?(@.type == 'InternalIP')].address}"
      register: node_ips
      delegate_to: localhost
      become: False
      changed_when: False

    - debug: msg="InternalIp is {{ item }}"
      with_items: '{{ node_ips.stdout.split(" ") }}'

    - name: Add upstream for new cluster on bastion
      template:
        src: "upstream.conf.j2"
        dest: "{{ compose_dest }}/data/nginx/{{ cluster_name }}-stream.conf"

    - name: Configure upstream for cluster in default-stream.conf
      lineinfile:
        insertbefore: "default                  default_backend;"
        #insertafter: "map $ssl_preread_server_name $name {"
        regexp: "{{ cluster_name }}.{{ domain }} {{ cluster_name }}_backend"
        line: "~.{{ cluster_name }}.{{ domain }} {{ cluster_name }}_backend ;"
        path: "{{ compose_dest }}/data/nginx/default-stream.conf"

    - name: Restart nginx container
      shell: |
        cd {{ compose_dest }}
        docker-compose stop nginx &&\
         docker-compose rm -f  nginx &&\
          docker-compose up -d nginx
      changed_when: True

    - name: Create test certificate
      shell: |
        echo "{{ lookup ('template','k8s-test-certificate.yaml')}}" | kubectl apply -f -
        kubectl get secrets {{ test_workload_name }}-cert -n istio-system
      register: result
      retries: 3
      delay: 10
      until: result.stdout.find("-cert") != -1
      changed_when: True
      delegate_to: localhost
      become: False

    - name:  create test workload
      shell: |
          set -e
          echo "{{ lookup('template','k8s-test-workload.yaml') }}" | kubectl apply -f -
          sleep 10
          curl -kv https://{{ test_workload_name }}.{{ cluster_name }}.{{ domain }}
      register: result
      retries: 3
      delay: 10
      until: result.stdout.find("Thank you for using nginx.") != -1
      changed_when: True
      delegate_to: localhost
      become: False

    - debug: msg="{{ result.stdout_lines }}"

    - name: Revoke gcloud and delete kubeconfig
      shell: |
        gcloud auth revoke $(gcloud iam service-accounts list --format=json --filter="email ~ terraform" | jq '.[0].email' -j)
        rm {{ kube_config }}
      delegate_to: localhost
      become: False
      changed_when: True
