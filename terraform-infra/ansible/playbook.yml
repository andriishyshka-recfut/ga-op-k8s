---
- hosts: localhost
  connection: local
  become: False
  vars:
    sa_key_json: lookup('env','GOOGLE_CREDENTIALS')
    kube_config: lookup('env','KUBECONFIG')
    project: lookup('env','GOOGLE_PROJECT')
  tasks:

   - debug: msg="{{ ansible_hostname }}"

   - name: Make istio GW NodePort
     shell: |
      export KUBECONFIG=./kubeconfig
      gcloud auth activate-service-account $(gcloud iam service-accounts list --format=json --filter="email ~ terraform" | jq '.[0].email' -j) --key-file $GOOGLE_CREDENTIALS --project {{ project }}
     when:
- hosts: gcp_name_bastion
  connection: ssh
  become: true
  tasks:
    - debug: msg="{{ ansible_hostname }}"
