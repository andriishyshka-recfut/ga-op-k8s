apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: 4-logs-br
  namespace: tekton-tasks
spec:
  workspaces:
  - name: ws
  tasks:
    - name: monitorings-logs-br
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/03-logs-restore"
        - name: branch
          value: "\\#254-prod-dr-06-01-2023"
      timeout: 3h
---
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: monitorings-logs-br
  namespace: tekton-tasks
spec:
  timeouts:
    pipeline: "6h0m0s"
    tasks: "6h0m0s"
  pipelineRef:
    name: 4-logs-br
  workspaces:
    - name: ws
      emptyDir: {}
