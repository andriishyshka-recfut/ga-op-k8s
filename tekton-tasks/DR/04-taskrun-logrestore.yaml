apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: 4-logs-br
  namespace: tekton-tasks
spec:
  workspaces:
  - name: ws
  tasks:
    - name: monitorings-logs-br
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/03-logs-restore"
        - name: branch
          value: "\\#364-sandbox-dr-2023-07-14"
      timeout: 7h
        tekton-tasks/DR/04-taskrun-logrestore.yaml
---
apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: monitorings-logs-br
  namespace: tekton-tasks
spec:
  timeouts:
    pipeline: 12h
    tasks: 8h
  pipelineRef:
    name: 4-logs-br
  workspaces:
    - name: ws
      emptyDir: {}
