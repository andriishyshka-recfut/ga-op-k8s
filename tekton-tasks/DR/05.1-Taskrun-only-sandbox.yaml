apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: sandbox-
  namespace: tekton-tasks
spec:
  taskRef:
    name: tg-run
  workspaces:
    - name: ws # this workspace name must be declared in the Task
      emptyDir: {}
  params:
    - name: path
      value: "k8s/tekton/sandbox"
    - name: branch
      value: "\\#1065-Sandbox-DR-20260711"
