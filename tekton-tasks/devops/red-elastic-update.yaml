apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: elastic-update
  namespace: tekton-pipelines
spec:
  taskRef:
    name: tg-run
  workspaces:
    - name: ws # this workspace name must be declared in the Task
      emptyDir: {}
  params:
    - name: path
      value: "k8s/tekton/01-elastic"
    - name: branch
      value: "\\#252-beats"
  timeout: 6h
