apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: elastic-update-addons
  namespace: tekton-tasks
spec:
  taskRef:
    name: tg-run
  workspaces:
    - name: ws # this workspace name must be declared in the Task
      emptyDir: {}
  params:
    - name: path
      value: "k8s/tekton/red/01-elastic-addons"
    - name: branch
      value: "master"
  timeout: 1h
