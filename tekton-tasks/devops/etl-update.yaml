apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: etl-update
  namespace: tekton-tasks
spec:
  taskRef:
    name: tg-run
  workspaces:
    - name: ws # this workspace name must be declared in the Task
      emptyDir: {}
  params:
    - name: path
      value: "k8s/tekton/03-etl-operator"
    - name: branch
      value: "master"
