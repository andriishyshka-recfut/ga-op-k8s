
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash-vpn
spec:
  replicas: 20
  template:
    metadata:
      labels:
        app: splash-vpn
      annotations:
        sidecar.istio.io/inject: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-blue
    spec:
      volumes:
      - name: route-script
        configMap:
          name: route-script
          items:
            - key: route-override.sh
              path: route-override.sh
