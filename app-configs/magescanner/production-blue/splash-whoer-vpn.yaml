
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash-whoer-vpn
spec:
  replicas: 42
  template:
    metadata:
      labels:
        app: splash-vpn
      annotations:
        sidecar.istio.io/inject: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-blue
