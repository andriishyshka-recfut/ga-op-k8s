apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash
spec:
  replicas: 42
  template:
    spec:
      containers:
      - name: splash
        image: scrapinghub/splash:latest
        args:
        - "--slots"
        - "5"
        - "--maxrss"
        - "1800"
        - "--verbosity"
        - "0"
        - "--js-cross-domain-access"
        - "--disable-browser-caches"
        - "--max-timeout"
        - "600"
        resources:
          requests:
            memory: "1600Mi"
            cpu: "400m"
          limits:
            memory: "1900Mi"
            cpu: "800m"
