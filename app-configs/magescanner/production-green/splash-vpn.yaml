
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash-vpn
spec:
  replicas: 50
  template:
    metadata:
      labels:
        app: splash-vpn
      annotations:
        sidecar.istio.io/inject: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
    spec:
      volumes:
      - name: route-script
        configMap:
          name: route-script
          items:
            - key: route-override.sh
              path: route-override.sh

---

kind: ConfigMap
metadata:
  name: route-script
apiVersion: v1
data:
  route-override.sh: |-
     #!/bin/sh
     GATEWAY=$(route -n | awk 'NR==4' | awk '{ print $2 }')
     ip route add 10.201.1.0/24 via $GATEWAY dev eth0
     ip route add 10.201.32.0/20 via $GATEWAY dev eth0
     ip route add 10.201.16.0/20 via $GATEWAY dev eth0
     ip route add 172.28.0.16/28 via $GATEWAY dev eth0
     echo "Route Updated via $GATEWAY"
