apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoip
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/auth-path: auth/k8s-production-green
    spec:
      containers:
      - name: geoip-goofys
        image: harbor.infra.digaweb.com/magescanner/splash-goofys:latest
        command: ["goofys"]
        args:
          - -f
          - --endpoint
          -  https://minio.p.digaweb.com/
          - --dir-mode
          - "777"
          - --file-mode
          - "777"
          -  minio-magescanner-geoip-orbital-wording-233917
          - /mnt/s3
