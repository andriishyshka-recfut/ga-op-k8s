
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magescanner
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        vault.hashicorp.com/auth-path: auth/k8s-sandbox-green
        vault.hashicorp.com/agent-inject-secret-es: "secret/elasticsearch-admin/sandbox"
        vault.hashicorp.com/agent-inject-secret-mongo: "secret/mongo/magescanner"
        vault.hashicorp.com/agent-inject-secret-google_sa: "secret/magescanner/magescanner"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-es: |
          {{ with secret "secret/elasticsearch-admin/sandbox" -}}
            export ELASTICSEARCH_HOSTS=https://{{ .Data.username }}:{{ .Data.password }}@sandbox-es-http.elastic:9200
          {{- end }}
        vault.hashicorp.com/agent-inject-template-google_sa: |
          {{ with secret "secret/magescanner/magescanner" -}}
            echo "{{ .Data.GOOGLE_CREDENTIALS_FILE_PATH}}" | base64 -d > /opt/magescanner/magescanner-google-service-key.json
          {{- end }}
        vault.hashicorp.com/agent-inject-template-mongo: |
          {{ with secret "secret/mongo/magescanner" -}}
            export MONGODB_URI=mongodb://{{ .Data.MONGODB_BACKUP_USER }}:{{ .Data.MONGODB_BACKUP_PASSWORD }}@my-cluster-name-rs0.mongo:27017
          {{- end }}
    spec:
      containers:
      - name: magescanner
        image: harbor.infra.digaweb.com/artifact/magescanner:k8s-0.0.36
