apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat-mage
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: beat-mage
  replicas: 1
  template:
    metadata:
      labels:
        app: beat-mage
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M

        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox
        vault.hashicorp.com/agent-inject-secret-config: "secret/magescanner/elastic-prod"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/magescanner/elastic-prod" -}}
            export ELASTICSEARCH_PASSWORD="{{ .Data.password }}"
            export ELASTICSEARCH_HOSTS=https://magescanner:$ELASTICSEARCH_PASSWORD@es23.regemini.com
            mkdir -p /opt/upsertmage/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/upsertmage/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/upsertmage/pki/upsertmage.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/upsertmage/pki/upsertmage.crt
          {{- end }}
    spec:
      containers:
      - name: beat-mage
        image: harbor.infra.digaweb.com/dev/beat:k8s-0.0.19
        command: ["sh"]
        args: ["-c", "source /vault/secrets/config && /opt/app/beat"]
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: ELASTICSEARCH_HEALTH_CHECK
            value: "false"
          - name: PROJECTS
            value: "mageanalyst,magecart,magescanner"
          - name: MAGECART_INPUT_TOPIC
            value: magecart
          - name: MAGECART_FOUND_TOPIC
            value: magecart.upsert
          - name: MAGECART_NOTFOUND_TOPIC
            value: magecart.upsert
          - name: MAGECART_WORKERS_NUM
            value: "2"
          - name: MAGECART_SEARCH_INDEX
            value: magecart
          - name: MAGESCANNER_INPUT_TOPIC
            value: mage.scan
          - name: MAGESCANNER_FOUND_TOPIC
            value: mage.scan.upsert
          - name: MAGESCANNER_NOTFOUND_TOPIC
            value: mage.scan.upsert
          - name: MAGESCANNER_TASK_SIZE
            value: "50"
          - name: MAGESCANNER_SEARCH_INDEX
            value: magescanner
          - name: MAGESCANNER_WORKERS_NUM
            value: "2"
          - name: MAGEANALYST_MARK_TOPIC
            value: mage.analysis.upsert
          - name: MAGEANALYST_INPUT_TOPIC
            value: mage.analysis
          - name: MAGEANALYST_FOUND_TOPIC
            value: mage.analysis.upsert
          - name: MAGEANALYST_NOTFOUND_TOPIC
            value: mage.analysis.upsert
          - name: MAGEANALYST_TASK_SIZE
            value: "50"
          - name: MAGEANALYST_SEARCH_INDEX
            value: analysis
          - name: MAGEANALYST_WORKERS_NUM
            value: "1"
          - name: ELASTIC_BULK_SIZE
            value: "2000"
          - name: ELASTICSEARCH_CA_CRT_PATH
            value: "/opt/upsertmage/pki/ca.crt"
          - name: ELASTICSEARCH_CLIENT_KEY_PATH
            value: "/opt/upsertmage/pki/upsertmage.key"
          - name: ELASTICSEARCH_CLIENT_CRT_PATH
            value: "/opt/upsertmage/pki/upsertmage.crt"
          - name : ELASTIC_APM_ACTIVE
            value: "false"
          # - name: ELASTIC_APM_SERVER_URL
          #   value: http://apm-monitoring-apm-http.monitoring:8200
          # - name: ELASTIC_APM_SECRET_TOKEN
          #   valueFrom:
          #       secretKeyRef:
          #         name: apm-token
          #         key:  secret-token
          # - name: ELASTICSEARCH_PASSWORD
          #   valueFrom:
          #       secretKeyRef:
          #         name: magescanner-es-elastic-user
          #         key: elastic
          # - name: ELASTICSEARCH_HOSTS
          #   value: https://elastic:$(ELASTICSEARCH_PASSWORD)@magescanner-es-http:9200
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap:9092
          - name: WORKERS_PER_TOPIC
            value: "8"
          - name: REDIS_URI
            value: redis://rfr-redisfailover-0/3
          - name: REDIS_TTL
            value: "24h"
          - name: REDIS_MASTER
            value: mymaster
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "200Mi"
            cpu: "50m"
      #   volumeMounts:
      #   - name: es-ca
      #     mountPath: "/etc/ssl/certs/es-ca.crt"
      #     subPath: es-ca.crt
      #     readOnly: true
      # volumes:
      #  - name: es-ca
      #    secret:
      #      secretName: magescanner-es-cert
      #      items:
      #      - key: ca.crt
      #        path: es-ca.crt
      imagePullSecrets:
      - name: harbor

---

