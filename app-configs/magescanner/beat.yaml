apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat-minion
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: beat-minion
  replicas: 1
  template:
    metadata:
      labels:
        app: beat-minion
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-blue
        vault.hashicorp.com/agent-inject-secret-es: "secret/es-creds-compose-prod/magescanner"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-es: |
          {{ with secret "secret/es-creds-compose-prod/magescanner" -}}
            mkdir -p /opt/magescanner/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/magescanner/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/magescanner/pki/client.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/magescanner/pki/client.crt
            export ELASTICSEARCH_HOSTS=https://{{ .Data.USERNAME }}:{{ .Data.PASSWORD }}@es23.regemini.com
            export ELASTICSEARCH_HEALTH_CHECK=FALSE
          {{- end }}
    spec:
      containers:
      - name: beat-minion
        image: harbor.infra.digaweb.com/dev/beat:k8s-0.0.20
        command: ["sh"]
        args: ["-c", "source /vault/secrets/es && /opt/app/beat"]
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: PROJECTS
            value: minion
          - name: MINION_FOUND_TOPIC
            value: minion.upsert
          - name: MINION_INPUT_TOPIC
            value: minion
          - name: MINION_NOTFOUND_TOPIC
            value: minion.sanitizer
          - name: MINION_MARK_TOPIC
            value: minion.mark
          - name: MINION_WORKERS_NUM
            value: "10"
          - name: MINION_SEARCH_INDEX
            value: "{{.shopId}}"
          - name: ELASTIC_BULK_SIZE
            value: "2000"
          - name: ELASTICSEARCH_CA_CRT_PATH
            value: "/opt/magescanner/pki/ca.crt"
          - name: ELASTICSEARCH_CLIENT_KEY_PATH
            value: "/opt/magescanner/pki/client.key"
          - name: ELASTICSEARCH_CLIENT_CRT_PATH
            value: "/opt/magescanner/pki/client.crt"
          - name: ELASTIC_APM_SERVER_URL
            value: http://apm-monitoring-apm-http.monitoring:8200
          - name: ELASTIC_APM_SECRET_TOKEN
            valueFrom:
                secretKeyRef:
                  name: apm-token
                  key:  secret-token
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name: WORKERS_PER_TOPIC
            value: "8"
          - name: REDIS_URI
            value: redis://rfr-redisfailover-0/0
          - name: REDIS_TTL
            value: "24h"
          - name: REDIS_MASTER
            value: mymaster
        # resources:
        #   requests:
        #     memory: "30Mi"
        #     cpu: "5m"
        #   limits:
        #     memory: "200Mi"
        #     cpu: "50m"
      imagePullSecrets:
      - name: harbor

---

