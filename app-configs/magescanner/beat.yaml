apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat-minion
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: beat-minion
  replicas: 1
  template:
    metadata:
      labels:
        app: beat-minion
      annotations:
        sidecar.istio.io/proxyCPU: 5m
        sidecar.istio.io/proxyMemory: 30M
    spec:
      containers:
      - name: beat-minion
        image: harbor.infra.digaweb.com/dev/beat:k8s-0.0.16
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: PROJECTS
            value: minion
          - name: MINION_FOUND_TOPIC
            value: minion.upsert
          - name: MINION_INPUT_TOPIC
            value: minion
          - name: MINION_NOTFOUND_TOPIC
            value: minion.sanitizer
          - name: MINION_MARK_TOPIC
            value: minion.mark
          - name: MINION_WORKERS_NUM
            value: "10"
          - name: MINION_SEARCH_INDEX
            value: "{{.shopId}}"
          - name: ELASTIC_BULK_SIZE
            value: "2000"
          # - name: ELASTIC_APM_SERVER_URL
          #   value: http://apm-monitoring-apm-http.monitoring:8200
          # - name: ELASTIC_APM_SECRET_TOKEN
          #   valueFrom:
          #       secretKeyRef:
          #         name: apm-token
          #         key:  secret-token
          - name: ELASTICSEARCH_PASSWORD
            valueFrom:
                secretKeyRef:
                  name: magescanner-es-elastic-user
                  key: elastic
          - name: ELASTICSEARCH_HOSTS
            value: https://elastic:$(ELASTICSEARCH_PASSWORD)@magescanner-es-http:9200
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap:9092
          - name: WORKERS_PER_TOPIC
            value: "8"
          - name: REDIS_URI
            value: redis://rfr-redisfailover-0/0
          - name: REDIS_TTL
            value: "24h"
          - name: REDIS_MASTER
            value: mymaster
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "200Mi"
            cpu: "50m"
        volumeMounts:
        - name: es-ca
          mountPath: "/etc/ssl/certs/es-ca.crt"
          subPath: es-ca.crt
          readOnly: true
      volumes:
       - name: es-ca
         secret:
           secretName: magescanner-es-cert
           items:
           - key: ca.crt
             path: es-ca.crt
      imagePullSecrets:
      - name: harbor

---

