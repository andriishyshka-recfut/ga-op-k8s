apiVersion: apps/v1
kind: Deployment
metadata:
  name: magetasker
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: magetasker
  replicas: 1
  template:s
    metadata:
      labels:
        app: magetasker
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox
        vault.hashicorp.com/agent-inject-secret-config: "secret/magescanner/magescanner"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/magescanner/magescanner" -}}
            export ELASTICSEARCH_PASSWORD="{{ .Data.password }}"
            export ELASTICSEARCH_HOSTS=https://magescanner:$ELASTICSEARCH_PASSWORD@es23.regemini.com
            mkdir -p /opt/magetasker/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/magetasker/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/magetasker/pki/magetasker.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/magetasker/pki/magetasker.crt
          {{- end }}
    spec:
      containers:
      - name: magetasker
        image: harbor.infra.digaweb.com/artifact/magetasker:k8s-0.0.15
        command: ["sh"]
        args: ["-c", "source /vault/secrets/config && /opt/app/magetasker"]
        # ports:
        # - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: MONGO_DB
            value: artifact
          - name: MONGO_COLLECTION
            value: mage_target
          - name: MONGO_FIELDS_PREFIX
            value: mage
          - name: DB_SEARCH_INTERVAL
            value: 1m
          - name: TOPIC_SCANNED
            value: mage.task.scanned
          - name: TOPIC_TASK
            value: mage.task.target
          - name: TOPIC_TASK_FIELDS
            value: "url,alexaGlobal,cms,cmsVersion,companyName,companyVertical,companyPhone,companyEmail,companyCity,companyState,companyZip,companyCountry"
          - name: WORKER_SCAN_INTERVAL
            value: 24h
          - name: DAILY_LIMIT
            value: "50000"
          - name: MONGODB_USER
            valueFrom:
              secretKeyRef:
                name: mongo
                key: MONGODB_BACKUP_USER
          - name: MONGODB_PASS
            valueFrom:
              secretKeyRef:
                name: mongo
                key: MONGODB_BACKUP_PASSWORD
          - name: MONGO_URI
            value: "mongodb://$(MONGODB_USER):$(MONGODB_PASS)@my-cluster-name-rs0:27017"
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap:9092
          - name: ELASTICSEARCH_CA_CRT_PATH
            value: "/opt/magetasker/pki/ca.crt"
          - name: ELASTICSEARCH_CLIENT_KEY_PATH
            value: "/opt/magetasker/pki/magetasker.key"
          - name: ELASTICSEARCH_CLIENT_CRT_PATH
            value: "/opt/magetasker/pki/magetasker.crt"
          - name : ELASTIC_APM_ACTIVE
            value: "false"
          # - name: ELASTIC_APM_SERVER_URLS
          #   value: http://apm-monitoring-apm-http.monitoring:8200
          # - name: ELASTIC_APM_SECRET_TOKEN
          #   valueFrom:
          #       secretKeyRef:
          #         name: apm-token
          #         key:  secret-token
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "200Mi"
            cpu: "50m"
      imagePullSecrets:
      - name: harbor

---

