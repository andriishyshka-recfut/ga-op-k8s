apiVersion: apps/v1
kind: Deployment
metadata:
  name: magetasker
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: magetasker
  replicas: 1
  template:
    metadata:
      labels:
        app: magetasker
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-blue
        vault.hashicorp.com/agent-inject-secret-es: "secret/es-creds-compose-prod/magescanner"
        vault.hashicorp.com/agent-inject-secret-mongo: "secret/mongo/production"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-es: |
          {{ with secret "secret/es-creds-compose-prod/magescanner" -}}
            mkdir -p /opt/magescanner/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/magescanner/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/magescanner/pki/client.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/magescanner/pki/client.crt
            export ELASTICSEARCH_HOSTS=https://{{ .Data.USERNAME }}:{{ .Data.PASSWORD }}@es23.regemini.com
          {{- end }}
        vault.hashicorp.com/agent-inject-template-mongo: |
          {{ with secret "secret/mongo/production" -}}
            export MONGO_URI=mongodb://{{ .Data.MONGODB_BACKUP_USER }}:{{ .Data.MONGODB_BACKUP_PASSWORD }}@my-cluster-name-rs0.mongo:27017
          {{- end }}
    spec:
      containers:
      - name: magetasker
        image: harbor.infra.digaweb.com/artifact/magetasker:k8s-0.0.19
        command: ["sh"]
        args: ["-c", "source /vault/secrets/es && source /vault/secrets/mongo && /opt/app/magetasker"]
        # ports:
        # - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: MONGO_DB
            value: artifact
          - name: MONGO_COLLECTION
            value: mage_target
          - name: MONGO_FIELDS_PREFIX
            value: mage
          - name: DB_SEARCH_INTERVAL
            value: 1m
          - name: TOPIC_SCANNED
            value: mage.task.scanned
          - name: TOPIC_TASK
            value: mage.task.target
          - name: TOPIC_TASK_FIELDS
            value: "url,alexaGlobal,cms,cmsVersion,companyName,companyVertical,companyPhone,companyEmail,companyCity,companyState,companyZip,companyCountry"
          - name: WORKER_SCAN_INTERVAL
            value: 24h
          - name: DAILY_LIMIT
            value: "50000"
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name : ELASTICSEARCH_HEALTH_CHECK
            value: "false"
          - name: ELASTICSEARCH_CA_CRT_PATH
            value: "/opt/magescanner/pki/ca.crt"
          - name: ELASTICSEARCH_CLIENT_KEY_PATH
            value: "/opt/magescanner/pki/client.key"
          - name: ELASTICSEARCH_CLIENT_CRT_PATH
            value: "/opt/magescanner/pki/client.crt"
          - name: ELASTIC_APM_SERVER_URL
            value: http://apm-monitoring-apm-http.monitoring:8200
          - name: INFECTED_INDEX
            value: "mageanalyst*"
          - name: INFECTED_CRON
            value: "@daily"
          - name: INFECTED_CHECK
            value: "24h"
          - name: ELASTIC_APM_SECRET_TOKEN
            valueFrom:
                secretKeyRef:
                  name: apm-token
                  key:  secret-token
        # resources:
        #   requests:
        #     memory: "30Mi"
        #     cpu: "5m"
        #   limits:
        #     memory: "200Mi"
        #     cpu: "50m"
      imagePullSecrets:
      - name: harbor

---

