apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash-vpn
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: splash-vpn
  replicas: 3
  template:
    metadata:
      labels:
        app: splash-vpn
      annotations:
        sidecar.istio.io/inject: "false"    
        # sidecar.istio.io/proxyCPU: 10m
        # sidecar.istio.io/proxyMemory: 50M
    spec:
      initContainers:
      - name: vpn-route-init
        image: busybox
        command: ['/bin/sh', '-c', 'cp /vpn/route-override.sh /tmp/route/route-override.sh; chown root:root /tmp/route/route-override.sh; chmod o+x /tmp/route/route-override.sh;']
        volumeMounts:
          - name: route
            mountPath: /tmp/route
          - name: route-script
            mountPath: /vpn/route-override.sh
            subPath: route-override.sh
      containers:
      - name: splash-vpn
        image: harbor.infra.digaweb.com/artifact/splash-vpn:test-0.0.6
        command: ["/bin/sh","-c"]
        args: ["cd /etc/openvpn && /usr/sbin/openvpn --config *.conf --script-security 2 --up /usr/local/bin/sockd.sh --route-up /tmp/route/route-override.sh"]
        stdin: true
        tty: true
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
        volumeMounts:
          - name: vpn
            mountPath: /etc/openvpn/ovpn.conf
            subPath: ovpn.conf
            readOnly: true
          - name: dev-net
            mountPath: /dev/net/tun
          - name: route
            mountPath: /tmp/route
        ports:
        - containerPort: 1080
        env:
        # resources:
        #   requests:
        #     memory: "30Mi"
        #     cpu: "5m"
        #   limits:
        #     memory: "500Mi"
        #     cpu: "300m"
      volumes:
      - name: vpn
        secret:
          secretName: vpn-secret-config
          items:
              - key: ovpn.conf
                path: ovpn.conf
      - name: route-script
        configMap:
          name: route-script
          items:
            - key: route-override.sh
              path: route-override.sh
      - name: dev-net
        hostPath:
          path: /dev/net/tun
      - name: route
        emptyDir: {}
      imagePullSecrets:
      - name: harbor

---

kind: ConfigMap
metadata:
  name: route-script
  namespace: magescanner
apiVersion: v1
data:
  route-override.sh: |-
     #!/bin/sh
     VPN_GATEWAY=$(route -n | awk 'NR==3' | awk '{ print $2 }')
     ip route del 0.0.0.0/1 via $VPN_GATEWAY
     echo "Route Updated"

---

apiVersion: v1
kind: Service
metadata:
  name: splash-vpn
  namespace: magescanner
spec:
  selector:
    app: splash-vpn
  ports:
    - name: tcp
      protocol: TCP
      port: 1080
      targetPort: 1080
