apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash-vpn
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: splash-vpn
  replicas: 20
  template:
    metadata:
      labels:
        app: splash-vpn
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
        vault.hashicorp.com/agent-inject-secret-vpn: "secret/magescanner/splash-vpn"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-secret-vpn: |
          {{ with secret "secret/magescanner/splash-vpn" -}}
            echo "{{ .Data.ovpn_client_conf}}" | base64 -d > /etc/openvpn/ovpn.conf
          {{- end }}
    spec:
      initContainers:
      - name: vpn-route-init
        image: busybox
        command: ['/bin/sh', '-c', 'cp /vpn/route-override.sh /tmp/route/route-override.sh; chown root:root /tmp/route/route-override.sh; chmod o+x /tmp/route/route-override.sh;']
        volumeMounts:
          - name: route
            mountPath: /tmp/route
          - name: route-script
            mountPath: /vpn/route-override.sh
            subPath: route-override.sh
      containers:
      - name: splash-vpn
        image: harbor.infra.digaweb.com/artifact/splash-vpn:test-0.0.6
        command: ["/bin/sh","-c"]
        args: ["cd /etc/openvpn && /usr/sbin/openvpn --config *.conf --script-security 2 --up /usr/local/bin/sockd.sh --route-up /tmp/route/route-override.sh"]
        stdin: true
        tty: true
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
        volumeMounts:
          - name: route
            mountPath: /tmp/route
        ports:
        - containerPort: 1080
        env:
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "100Mi"
            cpu: "100m"
      volumes:
      - name: route-script
        configMap:
          name: route-script
          items:
            - key: route-override.sh
              path: route-override.sh
      - name: route
        emptyDir: {}
      imagePullSecrets:
      - name: harbor

---

kind: ConfigMap
metadata:
  name: route-script
  namespace: magescanner
apiVersion: v1
data:
  route-override.sh: |-
     #!/bin/sh
     GATEWAY=$(route -n | awk 'NR==4' | awk '{ print $2 }')
     ip route add 10.200.1.0/24 via $GATEWAY dev eth0
     ip route add 10.200.8.0/21 via $GATEWAY dev eth0
     ip route add 10.200.16.0/21 via $GATEWAY dev eth0
     ip route add 172.28.0.0/28 via $GATEWAY dev eth0
     echo "Route Updated via $GATEWAY"


---

apiVersion: v1
kind: Service
metadata:
  name: splash-vpn
  namespace: magescanner
spec:
  selector:
    app: splash-vpn
  ports:
    - name: tcp
      protocol: TCP
      port: 1080
      targetPort: 1080
