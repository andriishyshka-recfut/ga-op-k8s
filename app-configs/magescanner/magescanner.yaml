apiVersion: apps/v1
kind: Deployment
metadata:
  name: magescanner
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: magescanner
  replicas: 1
  template:
    metadata:
      labels:
        app: magescanner
      annotations:
        # sidecar.istio.io/inject: "false"
        sidecar.istio.io/proxyCPU: 5m
        sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox
        vault.hashicorp.com/agent-inject-secret-config: "secret/magescanner/magescanner"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/magescanner/magescanner" -}}
            export ELASTICSEARCH_PASSWORD="{{ .Data.password }}"
            export ELASTICSEARCH_HOSTS=https://magescanner:$ELASTICSEARCH_PASSWORD@es23.regemini.com
            mkdir -p /opt/magescanner/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/magescanner/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/magescanner/pki/upsertmage.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/magescanner/pki/upsertmage.crt
            echo "{{ .Data.GOOGLE_CREDENTIALS_FILE_PATH}}" > /opt/magescanner/magescanner-google-service-key.json
          {{- end }}
    spec:
      containers:
      - name: magescanner
        image: harbor.infra.digaweb.com/artifact/magescanner:k8s-0.0.23
        command: ["sh"]
        args: ["-c", "source /vault/secrets/config && /opt/app/magescanner"]
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "200Mi"
            cpu: "50m"
        ports:
        - containerPort: 8080
        env:
          - name: THREAD_COUNT
            value: "20"
          - name: COMMIT_CAPACITY
            value: "2000"
          - name: SPLASH_URL
            value: http://splash:8050
          - name: SPLASH_WAIT_SEC
            value: "15"
          - name: SPLASH_TIMEOUT_SEC
            value: "300"
          - name: SPLASH_IGNORE_CONTENT_TYPE
            value: "text/css*,audio/*,video/*,image/*,font/*,application/font-*,application/x-font-*"
          - name: GEOIP_URL
            value: http://geoip:8080
          - name: DNS_HOST
            # value: 8.8.8.8:53
            value: kube-dns.kube-system
          - name: MINIO_URL
            value: minio.infra.digaweb.com:9000
          - name: MINIO_BUCKET_NAME
            value: minio-magescanner-ardent-rarity-239115
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: accesskey
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secretkey
          - name: MINIO_PUT
            value: "true"
          # - name: MINIO_TOKEN
          #   value:
          - name: MONGODB_ATTACKER_DB
            value: artifact
          - name: MONGODB_ATTACKER_COLLECTION
            value: mage_attacker
          - name: MONGODB_USER
            valueFrom:
              secretKeyRef:
                name: mongo
                key: MONGODB_BACKUP_USER
          - name: MONGODB_PASS
            valueFrom:
              secretKeyRef:
                name: mongo
                key: MONGODB_BACKUP_PASSWORD
          - name: MONGODB_URI
            value: "mongodb://$(MONGODB_USER):$(MONGODB_PASS)@my-cluster-name-rs0:27017"
          - name: MINIO_URL
            value: minio.infra.digaweb.com:9005
          - name : ELASTIC_APM_ACTIVE
            value: "false"
          - name : ELASTICSEARCH_HEALTH_CHECK
            value: "false"
          - name: ELASTICSEARCH_CA_CRT_PATH
            value: "/opt/magescanner/pki/ca.crt"
          - name: ELASTICSEARCH_CLIENT_KEY_PATH
            value: "/opt/magescanner/pki/upsertmage.key"
          - name: ELASTICSEARCH_CLIENT_CRT_PATH
            value: "/opt/magescanner/pki/upsertmage.crt"
          # - name: ELASTIC_APM_SERVER_URLS
          #   value: http://apm-monitoring-apm-http.monitoring:8200
          # - name: ELASTIC_APM_SECRET_TOKEN
          #   valueFrom:
          #       secretKeyRef:
          #         name: apm-token
          #         key:  secret-token
          # - name: ELASTICSEARCH_PASSWORD
          #   valueFrom:
          #       secretKeyRef:
          #         name: magescanner-es-elastic-user
          #         key: elastic
          # - name: ELASTICSEARCH_HOSTS
          #   value: https://elastic:$(ELASTICSEARCH_PASSWORD)@magescanner-es-http:9200
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap:9092
          - name: SCAN_TASK_QUEUE_NAME
            value: mage.task.target
          - name: STATUS_TASK_QUEUE_NAME
            value: mage.task.scanned
          - name: SCAN_RESULT_QUEUE_NAME
            value: mage.scan
          - name: ANALYST_RESULT_QUEUE_NAME
            value: mage.analysis
          - name: CERTIFICATE_TIMEOUT_SEC
            value: "10"
          - name: IP_RESOLVER_TIMEOUT_SEC
            value: "10"
          - name: MAGESCANNER_INDEX
            value: "magescanner*"
          - name: API_PORT
            value: "8080"
          - name: API_TEST
            value: "false"
          - name: ATTACKER_UPDATE_PERIOD
            value: 4h
          - name: GOOGLE_SHEET_RANGE_ATTACKER_URL
            value: "ProductionListAttackerDomain!A1:B999999"
          - name: GOOGLE_SHEET_RANGE_ATTACKER_SCRIPT
            value: "ProductionListInjs!A1:C999999"
          - name: GOOGLE_SHEET_RANGE_SKIP_RULE
            value: "WhiteListDomains!A1:A999999"
          - name: GOOGLE_SHEET_ID
            value: "1hVTctTl3urHkW5YPgs-BJittVyoci4kj8CYfOZnTGFQ"
          - name: GOOGLE_CREDENTIALS_FILE_PATH
            value: /opt/magescanner/magescanner-google-service-key.json
      imagePullSecrets:
      - name: harbor
