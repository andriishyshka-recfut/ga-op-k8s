---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat-mage
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: beat-mage
  replicas: 1
  template:
    metadata:
      labels:
        app: beat-mage
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
        vault.hashicorp.com/agent-inject-secret-es: "secret/es-creds-compose-prod/magescanner"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-es: |
          {{ with secret "secret/es-creds-compose-prod/magescanner" -}}
            export ELASTICSEARCH_HOSTS=https://{{ .Data.USERNAME }}:{{ .Data.PASSWORD }}@es23.regemini.com
            mkdir -p /opt/magescanner/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/magescanner/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/magescanner/pki/client.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/magescanner/pki/client.crt
          {{- end }}
    spec:
      containers:
      - name: beat-mage
        image: harbor.infra.digaweb.com/dev/beat:k8s-0.1.0
        command: ["sh"]
        args: ["-c", "source /vault/secrets/es && /opt/app/beat"]
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: PROJECTS
            value: "mageanalyst,magecart,magescanner"
          - name: MAGECART_INPUT_TOPIC
            value: magecart
          - name: MAGECART_FOUND_TOPIC
            value: magecart.upsert
          - name: MAGECART_NOTFOUND_TOPIC
            value: magecart.upsert
          - name: MAGECART_WORKERS_NUM
            value: "2"
          - name: MAGECART_SEARCH_INDEX
            value: magecart
          - name: MAGESCANNER_INPUT_TOPIC
            value: mage.scan
          - name: MAGESCANNER_FOUND_TOPIC
            value: mage.scan.upsert
          - name: MAGESCANNER_NOTFOUND_TOPIC
            value: mage.scan.upsert
          - name: MAGESCANNER_TASK_SIZE
            value: "50"
          - name: MAGESCANNER_SEARCH_INDEX
            value: magescanner
          - name: MAGESCANNER_WORKERS_NUM
            value: "2"
          - name: MAGEANALYST_MARK_TOPIC
            value: mage.analysis.upsert
          - name: MAGEANALYST_INPUT_TOPIC
            value: mage.analysis
          - name: MAGEANALYST_FOUND_TOPIC
            value: mage.analysis.upsert
          - name: MAGEANALYST_NOTFOUND_TOPIC
            value: mage.analysis.upsert
          - name: MAGEANALYST_TASK_SIZE
            value: "50"
          - name: MAGEANALYST_SEARCH_INDEX
            value: mageanalyst
          - name: MAGEANALYST_WORKERS_NUM
            value: "1"
          - name: ELASTICSEARCH_HEALTH_CHECK
            value: "false"
          - name: ELASTIC_BULK_SIZE
            value: "2000"
          - name: ELASTICSEARCH_CA_CRT_PATH
            value: "/opt/magescanner/pki/ca.crt"
          - name: ELASTICSEARCH_CLIENT_KEY_PATH
            value: "/opt/magescanner/pki/client.key"
          - name: ELASTICSEARCH_CLIENT_CRT_PATH
            value: "/opt/magescanner/pki/client.crt"
          - name: ELASTIC_APM_SERVER_URL
            value: http://apm-monitoring-apm-http.monitoring:8200
          - name: ELASTIC_APM_SECRET_TOKEN
            valueFrom:
                secretKeyRef:
                  name: apm-token
                  key:  secret-token
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name: WORKERS_PER_TOPIC
            value: "8"
          - name: REDIS_URI
            value: redis://rfr-redisfailover-0/3
            # value: rfs-redisfailover:26379
          - name: REDIS_TTL
            value: "24h"
          - name: REDIS_MASTER
            value: mymaster
        # resources:
        #   requests:
        #     memory: "30Mi"
        #     cpu: "5m"
        #   limits:
        #     memory: "200Mi"
        #     cpu: "50m"
      imagePullSecrets:
      - name: harbor


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat-mage-union
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: beat-mage-union
  replicas: 1
  template:
    metadata:
      labels:
        app: beat-mage-union
        use-kafka: 'true'
        use-elastic: 'true'
        use-redis: 'true'
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
        vault.hashicorp.com/agent-inject-secret-es: "secret/es-creds-compose-prod/magescanner"
        vault.hashicorp.com/role: "magescanner"
    spec:
      containers:
      - name: beat-mage-union
        image: harbor.infra.digaweb.com/dev/beat:k8s-0.1.0
        command: ["sh"]
        args: ["-c", "source /vault/secrets/es && /opt/app/beat"]
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: PROJECTS
            value: "mageanalyst"
          - name: MAGEANALYST_READER_GROUP
            value: "beat_mage_union"
          - name: MAGEANALYST_INPUT_TOPIC
            value: "mage.analysis"
          - name: MAGEANALYST_FOUND_TOPIC
            value: "union.mage.analysis.upsert"
          - name: MAGEANALYST_NOTFOUND_TOPIC
            value: "union.mage.analysis.upsert"
          - name: MAGEANALYST_MARK_TOPIC
            value: "union.mage.analysis.upsert"
          - name: MAGEANALYST_TASK_SIZE
            value: "50"
          - name: MAGEANALYST_SEARCH_INDEX
            value: "union_magecart"
          - name: MAGEANALYST_WORKERS_NUM
            value: "1"
          - name: ELASTICSEARCH_HEALTH_CHECK
            value: "false"
          - name: ELASTIC_BULK_SIZE
            value: "2000"
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name: WORKERS_PER_TOPIC
            value: "8"
          - name: REDIS_URI
            value: redis://rfr-redisfailover-0/3
          - name: REDIS_TTL
            value: "24h"
          - name: REDIS_MASTER
            value: mymaster
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "200Mi"
            cpu: "100m"
      imagePullSecrets:
      - name: harbor
