apiVersion: apps/v1
kind: Deployment
metadata:
  name: geoip
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: geoip
  replicas: 1
  template:
    metadata:
      labels:
        app: geoip
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox-green
        vault.hashicorp.com/agent-inject-secret-geoip: "secret/magescanner/geoip"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-geoip: |
          {{ with secret "secret/magescanner/geoip" -}}
            export GEOIPUPDATE_ACCOUNT_ID={{ .Data.GEOIPUPDATE_ACCOUNT_ID }}
            export GEOIPUPDATE_LICENSE_KEY={{ .Data.GEOIPUPDATE_LICENSE_KEY }}
          {{- end }}
    spec:
      containers:
      - name: geoip-goofys
        image: harbor.infra.digaweb.com/magescanner/splash-goofys:latest
        securityContext:
          privileged: true
        imagePullPolicy: Always
        name: goofys
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 100Mi
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: accesskey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secretkey
        command: ["goofys"]
        args:
          - -f
          - --endpoint
          -  https://minio.p.digaweb.com/
          - --dir-mode
          - "777"
          - --file-mode
          - "777"
          -  minio-magescanner-geoip-orbital-wording-233917
          - /mnt/s3
        volumeMounts:
          - name: geoip
            mountPath: /mnt/geoip/
          - name: s3
            mountPath: /mnt/s3
            mountPropagation: Bidirectional
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "sleep 2 && cp -r /mnt/s3/* /mnt/geoip/ && chmod 755 /mnt/geoip/*" ]

      - name: geoip
        image: harbor.infra.digaweb.com/artifact/geoip:k8s-test-0.0.17
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: INFO
          - name: SERVER_PORT
            value: "8080"
          - name: DATABASE_PATH
            value: "/usr/share/GeoIP"
          - name: DATABASE_NAME_REGEXP
            value: "^GeoLite2-(\\w+).mmdb$"
          - name: DATABASE_UPDATE_STATE_DELAY_MIN
            value: "60"
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "200Mi"
            cpu: "50m"
        volumeMounts:
        - name: geoip
          mountPath: "/usr/share/GeoIP/"

      - name: geoip-update
        image: maxmindinc/geoipupdate:latest
        command: ["sh"]
        args: ["-c", "source /vault/secrets/geoip && /usr/bin/entry.sh"]
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: INFO
          - name: SERVER_PORT
            value: "8080"
          - name: GEOIPUPDATE_EDITION_IDS
            value: "GeoLite2-ASN GeoLite2-City GeoLite2-Country"
          - name: GEOIPUPDATE_FREQUENCY
            value: "24"
          - name: GEOIPUPDATE_PRESERVE_FILE_TIMES
            value: "1"
        resources:
          requests:
            memory: "30Mi"
            cpu: "3m"
          limits:
            memory: "200Mi"
            cpu: "50m"
        volumeMounts:
        - name: geoip
          mountPath: "/usr/share/GeoIP"
      volumes:
        - name: geoip
          emptyDir: {}
        - name: s3
          emptyDir: {}
      imagePullSecrets:
      - name: harbor


---

apiVersion: v1
kind: Service
metadata:
  name: geoip-update
  namespace: magescanner
spec:
  selector:
    app: geoip-update
  ports:
    - name: tcp
      protocol: TCP
      port: 8080
      targetPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: geoip
  namespace: magescanner
spec:
  selector:
    app: geoip
  ports:
    - name: tcp
      protocol: TCP
      port: 8080
      targetPort: 8080
