apiVersion: apps/v1
kind: Deployment
metadata:
  name: magetasker
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: magetasker
  replicas: 1
  template:
    metadata:
      labels:
        app: magetasker
        use-kafka: 'true'
        use-elastic: 'true'
        use-mongo: 'true'
        use-redis: 'true'
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
        vault.hashicorp.com/agent-inject-secret-es: "secret/es-creds-compose-prod/magescanner"
        vault.hashicorp.com/agent-inject-secret-mongo: "secret/mongo/production"
        vault.hashicorp.com/role: "magescanner"
        vault.hashicorp.com/agent-inject-template-mongo: |
          {{ with secret "secret/mongo/production" -}}
            export MONGO_URI=mongodb://{{ .Data.MONGODB_BACKUP_USER }}:{{ .Data.MONGODB_BACKUP_PASSWORD }}@my-cluster-name-rs0.mongo:27017
          {{- end }}
    spec:
      containers:
      - name: magetasker
        image: harbor.infra.digaweb.com/artifact/magetasker:k8s-0.1.2
        command: ["sh"]
        args: ["-c", "source /vault/secrets/es && source /vault/secrets/mongo && /opt/app/magetasker"]
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: MONGO_DB
            value: artifact
          - name: MONGO_COLLECTION
            value: mage_target
          - name: MONGO_FIELDS_PREFIX
            value: mage
          - name: DB_SEARCH_INTERVAL
            value: 5m
          - name: TOPIC_SCANNED
            value: mage.task.scanned
          - name: TOPIC_TASK
            value: mage.task.target
          - name: TOPIC_TASK_FIELDS
            value: "url,alexaGlobal,cms,cmsVersion,companyName,companyVertical,companyPhone,companyEmail,companyCity,companyState,companyZip,companyCountry"
          - name: WORKER_SCAN_INTERVAL
            value: 24h
          - name: DAILY_LIMIT
            value: "100000"
          - name: TOPIC_TASK_PRIORITY
            value: mage.task.target.priority
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name : ELASTICSEARCH_HEALTH_CHECK
            value: "false"
          - name: INFECTED_INDEX
            value: "union_magecart*"
          - name: INFECTED_CRON
            value: "@daily"
          - name: ELASTIC_APM_SECRET_TOKEN
            valueFrom:
                secretKeyRef:
                  name: apm-token
                  key:  secret-token
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "200Mi"
            cpu: "50m"
      imagePullSecrets:
      - name: harbor
