apiVersion: apps/v1
kind: Deployment
metadata:
  name: upsertmage
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: upsertmage
  replicas: 1
  template:
    metadata:
      labels:
        app: upsertmage
        use-kafka: 'true'
        use-elastic: 'true'
        use-redis: 'true'
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
        vault.hashicorp.com/role: "magescanner"
    spec:
      containers:
      - name: upsertmage
        image: harbor.infra.digaweb.com/artifact/upsertmage:k8s-0.0.24
        command: ["sh"]
        args: ["-c", "source /vault/secrets/es && /opt/app/upsertmage"]
        ports:
        - containerPort: 8080
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: ELASTICSEARCH_HEALTH_CHECK
            value: "false"
          - name: MAGECART_WORKERS
            value: "2"
          - name: MAGECART_DESTINATION_INDEX
            value: magecart
          - name: MAGECART_INPUT_TOPIC
            value: magecart.upsert
          - name: MAGESCANNER_WORKERS
            value: "2"
          - name: MAGESCANNER_DESTINATION_INDEX
            value: "magescanner-{{.YYYY}}"
          - name: MAGESCANNER_INPUT_TOPIC
            value: mage.scan.upsert
          - name: MAGEANALYST_WORKERS
            value: "1"
          - name: MAGEANALYST_DESTINATION_INDEX
            value: "mageanalyst-{{.YYYY}}"
          - name: MAGEANALYST_INPUT_TOPIC
            value: mage.analysis.upsert
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name: REDIS_URI
            value: redis://rfr-redisfailover-0/3
          - name: REDIS_TTL
            value: "24h"
          - name: REDIS_MASTER
            value: mymaster
        resources:
          requests:
            memory: "30Mi"
            cpu: "5m"
          limits:
            memory: "500Mi"
            cpu: "200m"
      imagePullSecrets:
      - name: harbor
