apiVersion: apps/v1
kind: Deployment
metadata:
  name: splash
  namespace: magescanner
spec:
  selector:
    matchLabels:
      app: splash
  replicas: 20
  template:
    metadata:
      labels:
        app: splash
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 10m
        # sidecar.istio.io/proxyMemory: 50M
    spec:
      containers:
      - name: splash-goofys
        image: harbor.infra.digaweb.com/magescanner/splash-goofys:latest
        securityContext:
          privileged: true
        imagePullPolicy: Always
        name: goofys
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 200Mi
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: accesskey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secretkey
        command: ["goofys"]
        args:
          - -f
          - --endpoint
          -  https://minio.p.digaweb.com/
          - --dir-mode
          - "777"
          - --file-mode
          - "777"
          -  minio-magescanner-splash-orbital-wording-233917
          - /mnt/s3
        volumeMounts:
          - name: filters
            mountPath: /mnt/filters
          - name: proxy-profiles
            mountPath: /mnt/proxy-profiles/
          - name: s3
            mountPath: /mnt/s3
            mountPropagation: Bidirectional
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "sleep 2 && cp -r /mnt/s3/splash/filters/* /mnt/filters/ && cp -r /mnt/s3/splash/proxy-profiles/* /mnt/proxy-profiles/ && chmod 755 /mnt/filters/* && chmod 755 /mnt/proxy-profiles/*" ]
      - name: splash
        image: scrapinghub/splash:latest
        args:
        - "--slots"
        - "5"
        - "--maxrss"
        - "1350"
        - "--verbosity"
        - "0"
        - "--js-cross-domain-access"
        - "--disable-browser-caches"
        - "--max-timeout"
        - "600"
        ports:
        - containerPort: 8050
        volumeMounts:
        - name: filters
          mountPath: /etc/splash/filters/
        - name: proxy-profiles
          mountPath: /etc/splash/proxy-profiles/
        resources:
          requests:
            memory: "300Mi"
            cpu: "20m"
          limits:
            memory: "1400Mi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /_ping
            port: 8050
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 6
      volumes:
      - name: filters
        emptyDir: {}
      - name: proxy-profiles
        emptyDir: {}
      - name: s3
        emptyDir: {}
      imagePullSecrets:
      - name: harbor

---

apiVersion: v1
kind: Service
metadata:
  name: splash
  namespace: magescanner
spec:
  selector:
    app: splash
  ports:
    - name: tcp
      protocol: TCP
      port: 8050
      targetPort: 8050
