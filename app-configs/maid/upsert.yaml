apiVersion: apps/v1
kind: Deployment
metadata:
  name: maid-upsert
  namespace: maid
spec:
  selector:
    matchLabels:
      app: maid-upsert
  replicas: 1 # tells deployment to run 2 pods matching the template
  template:
    metadata:
      labels:
        app: maid-upsert
        use-kafka: true
        use-elastic: true
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
        vault.hashicorp.com/agent-inject-secret-config: "secret/es-creds-compose-prod/maid/upsertmaid"
        vault.hashicorp.com/role: "maid"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/es-creds-compose-prod/maid/upsertmaid" -}}
            mkdir -p /opt/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /etc/ssl/certs/es-ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/pki/client.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/pki/client.crt

            export ELASTICSEARCH_HOSTS=https://{{ .Data.USERNAME }}:{{ .Data.PASSWORD }}@es23.regemini.com
            export ELASTICSEARCH_CLIENT_CRT_PATH=/opt/pki/client.crt
            export ELASTICSEARCH_CLIENT_KEY_PATH=/opt/pki/client.key
            export ELASTICSEARCH_CA_CRT_PATH=/opt/pki/ca.crt
            export ELASTICSEARCH_HEALTH_CHECK=FALSE
          {{- end }}
    spec:
      containers:
      - name: maid-upsert
        image:  harbor.infra.digaweb.com/maid/upsertmaid:v1.2.1
        command: ["sh"]
        args:
            [ '-c', 'source /vault/secrets/config && /opt/app/upsertmaid']
        imagePullPolicy: Always
        env:
          - name: LOG_LEVEL
            value: "INFO"
          - name: ELASTIC_APM_SERVER_URL
            value: http://apm-monitoring-apm-http.monitoring:8200
          - name: ELASTIC_APM_SECRET_TOKEN
            valueFrom:
                secretKeyRef:
                  name: apm-token
                  key:  secret-token
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name: UPSERT_TOPIC
            value: "maid.upsert"
          - name: WORKERS
            value: "2"
      imagePullSecrets:
      - name: harbor
