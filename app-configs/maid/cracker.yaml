apiVersion: apps/v1
kind: Deployment
metadata:
  name: maid-cracker
  namespace: maid
spec:
  selector:
    matchLabels:
      app: maid-cracker
  replicas: 1
  template:
    metadata:
      labels:
        app: maid-cracker
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-blue
        vault.hashicorp.com/agent-inject-secret-config: "secret/es-creds-compose-prod/maid/cracker"
        vault.hashicorp.com/role: "maid"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/es-creds-compose-prod/maid/cracker" -}}
            mkdir -p /opt/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /etc/ssl/certs/es-ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/pki/client.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/pki/client.crt

            export ELASTICSEARCH_HOSTS=https://{{ .Data.USERNAME }}:{{ .Data.PASSWORD }}@es23.regemini.com
            export ELASTICSEARCH_CLIENT_CRT_PATH=/opt/pki/client.crt
            export ELASTICSEARCH_CLIENT_KEY_PATH=/opt/pki/client.key
            export ELASTICSEARCH_CA_CRT_PATH=/opt/pki/ca.crt
            export ELASTICSEARCH_HEALTH_CHECK=FALSE
          {{- end }}
    spec:
      containers:
      - name: maid-cracker
        image:  harbor.infra.digaweb.com/maid/cracker:v1.1.2
        command: ["sh"]
        args:
            [ '-c', 'source /vault/secrets/config && /opt/app/cracker']
        ports:
        - containerPort: 8080
        env:
          - name: LISTEN
            value: ":8080"
          - name: ELASTIC_BULK_SIZE
            value: "2000"
          - name: LOG_LEVEL
            value: "INFO"
          - name:  ELASTIC_APM_SERVER_URL
            value: http://apm-monitoring-apm-http.monitoring:8200
          - name: ELASTIC_APM_SECRET_TOKEN
            valueFrom:
                secretKeyRef:
                  name: apm-token
                  key:  secret-token
      imagePullSecrets:
      - name: harbor
---
apiVersion: v1
kind: Service
metadata:
  name: maid-cracker
  namespace: maid
spec:
  selector:
    app: maid-cracker
  ports:
    - name: port1
      protocol: TCP
      port: 8080
      targetPort: 8080
