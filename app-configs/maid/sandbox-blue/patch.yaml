apiVersion: apps/v1
kind: Deployment
metadata:
  name: maid-clean
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/auth-path: auth/k8s-sandbox-blue
        vault.hashicorp.com/agent-inject-secret-config: "secret/elasticsearch-admin/sandbox"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/elasticsearch-admin/sandbox" -}}
            export ELASTICSEARCH_HOSTS=https://{{ .Data.username }}:{{ .Data.password }}@sandbox-es-http.elastic:9200
          {{- end }}
---
