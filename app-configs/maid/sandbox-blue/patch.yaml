apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/auth-path: auth/k8s-sandbox-blue
        vault.hashicorp.com/agent-inject-secret-config: "secret/oidc_google_test"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/oidc_google_test" -}}

            export OAUTH2_PROXY_CLIENT_ID={{ .Data.oidc_client_id }}
            export OAUTH2_PROXY_CLIENT_SECRET={{ .Data.oidc_client_secret }}
            export OAUTH2_PROXY_COOKIE_SECRET="randomStringHere"
            export OAUTH2_PROXY_HTTP_ADDRESS="0.0.0.0:4180"

          {{- end }}
