apiVersion: apps/v1
kind: Deployment
metadata:
  name: maid-clean
  namespace: maid
spec:
  selector:
    matchLabels:
      app: maid-clean
  replicas: 1
  template:
    metadata:
      labels:
        app: maid-clean
        use-kafka: true
        use-elastic: true
        use-redis: true           
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-production-green
        vault.hashicorp.com/agent-inject-secret-config: "secret/es-creds-compose-prod/maid/clean"
        vault.hashicorp.com/role: "maid"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/es-creds-compose-prod/maid/clean" -}}
            mkdir -p /opt/pki
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /opt/pki/ca.crt
            echo "{{ .Data.ELASTICSEARCH_CA_CRT}}" > /etc/ssl/certs/es-ca.crt
            echo "{{ .Data.ELASTICSEARCH_CLIENT_KEY}}" > /opt/pki/client.key
            echo "{{ .Data.ELASTICSEARCH_CLIENT_CRT}}" > /opt/pki/client.crt

            export ELASTICSEARCH_HOSTS=https://{{ .Data.USERNAME }}:{{ .Data.PASSWORD }}@es23.regemini.com
            export ELASTICSEARCH_CLIENT_CRT_PATH=/opt/pki/client.crt
            export ELASTICSEARCH_CLIENT_KEY_PATH=/opt/pki/client.key
            export ELASTICSEARCH_CA_CRT_PATH=/opt/pki/ca.crt
            export ELASTICSEARCH_HEALTH_CHECK=FALSE
          {{- end }}
    spec:
      containers:
      - name: maid-clean
        image:  harbor.infra.digaweb.com/maid/clean:v1.2.0
        imagePullPolicy: Always
        command: ["sh"]
        args:
            [ '-c', 'source /vault/secrets/config && /opt/app/clean']
        ports:
        - containerPort: 8080
        env:
          - name: LISTEN
            value: ":8080"
          - name: ELASTIC_BULK_SIZE
            value: "2000"
          - name: LOG_LEVEL
            value: "INFO"
          - name: ELASTIC_APM_SERVER_URL
            value: http://apm-monitoring-apm-http.monitoring:8200
          - name: ELASTIC_APM_SECRET_TOKEN
            valueFrom:
                secretKeyRef:
                  name: apm-token
                  key:  secret-token
          - name: KAFKA_BROKERS
            value: kafka-cluster-kafka-bootstrap.kafka:9092
          - name: NS
            value: "8.8.8.8"
          - name: NS_LOOKUP_MAX_CONC
            value: "100"
          - name: MARK_URI
            value: "http://maid-cracker:8080/mark"
          - name: MINIO_ENDPOINT
            value: minio.p.digaweb.com
          - name: REDIS_ADDRS
            value: rfs-redisfailover:26379
          - name: REDIS_MASTER
            value: mymaster
          - name: MINIO_BUCKET
            value: minio-maid-orbital-wording-233917
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: accesskey
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: minio-credentials
                key: secretkey
      imagePullSecrets:
      - name: harbor
---
apiVersion: v1
kind: Service
metadata:
  name: maid-clean
  namespace: maid
spec:
  selector:
    app: maid-clean
  ports:
    - name: port1
      protocol: TCP
      port: 8080
      targetPort: 8080
