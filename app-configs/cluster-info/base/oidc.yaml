
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: oauth2-proxy
  name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: oauth2-proxy
  template:
    metadata:
      labels:
        k8s-app: oauth2-proxy
      annotations:
        sidecar.istio.io/inject: "false"
        # sidecar.istio.io/proxyCPU: 5m
        # sidecar.istio.io/proxyMemory: 30M
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox-green
        vault.hashicorp.com/agent-inject-secret-config: "secret/oidc_google_test"
        vault.hashicorp.com/role: "cluster-info"
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/oidc_google_test" -}}
            export OAUTH2_PROXY_CLIENT_ID={{ .Data.oidc_client_id }}
            export OAUTH2_PROXY_CLIENT_SECRET={{ .Data.oidc_client_secret }}
            export OAUTH2_PROXY_COOKIE_SECRET="randomStringHere"
            export OAUTH2_PROXY_HTTP_ADDRESS="0.0.0.0:4180"

          {{- end }}
    spec:
      containers:
      - command: [ "sh" ]
        args:
         - -c
         - source /vault/secrets/config && /bin/oauth2-proxy --email-domain=* --upstream=http://info-page:80/
        image: quay.io/oauth2-proxy/oauth2-proxy:latest
        imagePullPolicy: Always
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: oauth2-proxy
  name: oauth2-proxy
spec:
  ports:
  - name: http
    port: 4180
    protocol: TCP
    targetPort: 4180
  selector:
    k8s-app: oauth2-proxy
