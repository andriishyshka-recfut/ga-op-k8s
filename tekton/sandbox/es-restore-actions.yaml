---
actions:
  1:
    action: restore
    description: "Restore filebeat-7 indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "gcs"
      # name: monitoring-dr-%Y%m%d
      indices:
        rename_pattern: '.security(.+)'
        rename_replacement: 'restored_security$1'
      wait_for_completion: False
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: elastic-dr
