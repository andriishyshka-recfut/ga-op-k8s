---
actions:
  1:
    action: delete_indices
    description: "Delete all indices"
    options:
      continue_if_exception: True
    filters:
      - filtertype: pattern
        kind: prefix
        value: "^.*$"
  2:
    action: restore
    description: "Restore system"
    options:
      repository: "minio"
      # name: monitoring-dr-%Y%m%d
      wait_for_completion: True
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: elastic7-dr-system
