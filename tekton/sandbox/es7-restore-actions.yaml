---
actions:
  1:
    action: restore
    description: "Restore filebeat-7 indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "gcs"
      # name: monitoring-dr-%Y%m%d
      # indices: "-.kibana*"
      wait_for_completion: False
      include_global_state: False
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: elastic7-dr
      - filtertype: pattern
        kind: regex
        value: '^(\.monitoring|apm).*$'
        exclude: True

