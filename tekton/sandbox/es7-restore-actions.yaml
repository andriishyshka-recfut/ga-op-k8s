---
actions:
  1:
    action: restore
    description: "Restore system"
    options:
      repository: "gcs"
      # name: monitoring-dr-%Y%m%d
      indices:
      - '.*'
      wait_for_completion: False
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: elastic7-dr
  2:
    action: restore
    description: "Restore other"
    options:
      repository: "gcs"
      include_aliases: True
      # name: monitoring-dr-%Y%m%d
      indices:
      - '*'
      - '-.*'
      include_aliases: True
      wait_for_completion: False
      include_global_state: False
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: elastic7-dr
