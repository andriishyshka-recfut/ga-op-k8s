---
actions:
  1:
    action: restore
    description: "Restore system"
    options:
      repository: "minio"
      # name: monitoring-dr-%Y%m%d
      wait_for_completion: True
      include_global_state: True
      partial: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: elastic7-dr-system
