apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    k8s-app: es-mstr-sysctl
  name: es-mstr-sysctl
spec:
  selector:
    matchLabels:
      k8s-app: es-mstr-sysctl
  template:
    metadata:
      labels:
        k8s-app: es-mstr-sysctl
    spec:
      nodeSelector:
        workloadsType: "mstr"
      tolerations:
        - key: "workloadsType"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
      - command:
        - sh
        - -c
        - sysctl -w vm.max_map_count=262144 && sysctl -w vm.swappiness=1 && while true; do sleep 86400; done
        image: busybox
        name: es-mstr-sysctl
        resources:
          limits:
            cpu: 10m
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 50Mi
        securityContext:
          privileged: true
      terminationGracePeriodSeconds: 1

---

