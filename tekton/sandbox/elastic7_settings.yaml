elastic_settings:
  elastic:
    # Default values for elasticsearch.
    # This is a YAML-formatted file.
    # Declare variables to be passed into your templates.
    esName: "elastic7"
    namespace: "elastic7"
    appVersion: "7.14.1"
    # enableTrial should be a quoted string. only yes value make changes
    enableTrial: "yes"
    apmToken: "apm-elastic7-apm-token"
    apm:
      enabled: "yes"
    labels:
      elastic: 6to7
    annotations:
      sidecar.istio.io/inject: "false" # istio-proxy conflicts with nativeTLS
    istio:
      enabled: "no"
    nativeTLS:
      enabled: "yes" # required for xpack.security.authc.token and oidc
    oidc_gcloud:
      enabled: "yes"
      vault_path: "secret/oidc_google_prod" # expect oidc_client_id, oidc_client_secret & oidc_discovery_url
      oidc_realm_name: "google"
      secret_name: "oidc"
      configmap_name: "oidc"
    saml_gcloud:
      enabled: "yes"
      vault_path: "secret/saml_google_prod" # expect oidc_client_id, oidc_client_secret & oidc_discovery_url
      saml_realm_name: "gsuite"
      secret_name: "saml"
      configmap_name: "saml"
    slack_notification:
      enabled: "no"
    smtp_notification:
      enabled: "no"
    elasticNodeSets:
      - name: master
        config: |
          node.master: true
          node.data: false
          node.ingest: true
          node.ml: true
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "1Gi"
        ES_JAVA_OPTS: -Xms4g -Xmx4g
        nodesCount: 1
        memoryRequests: "4Gi"
        cpuRequests: "1"
        memoryLimit: 5Gi
        cpuLimit: 3
      - name: data
        config: |
          node.master: false
          node.data: true
          node.ingest: false
          node.ml: false
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "900Gi"
        ES_JAVA_OPTS: -Xms6g -Xmx6g
        nodesCount: 2
        memoryRequests: "6Gi"
        cpuRequests: "1"
        memoryLimit: 7Gi
        cpuLimit: 4
      - name: coor
        config: |
          node.master: false
          node.data: false
          node.ingest: false
          node.ml: false
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "900Gi"
        ES_JAVA_OPTS: -Xms6g -Xmx6g
        nodesCount: 1
        memoryRequests: "6Gi"
        cpuRequests: "1"
        memoryLimit: 7Gi
        cpuLimit: 4
  kibana:
    enabled: true
    # cert_ttl: "143h"
    name: kibana
    esName: "elastic7"
    namespace: "elastic7"
    kibanaVersion: "7.14.1"
    oidc_provider:
      enabled: "yes"
      realm: "google"
      istio_gateway_fqdn: "es7.t.regemini.io"
    saml_provider:
      enabled: "no"
