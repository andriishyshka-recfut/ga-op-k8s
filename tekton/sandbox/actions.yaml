---
actions:
  1:
    action: delete_indices
    description: >-
      delete .kibana_7 indices
    options:
      ignore_empty_list: True
      disable_action: False
    filters:
    - filtertype: pattern
      kind: prefix
      value: .kiabana
  2:
    action: restore
    description: "Restore all indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "minio"
      name:
      indices:
      - .kibana.*
      wait_for_completion: False
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
        state: SUCCESS
