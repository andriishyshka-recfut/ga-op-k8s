elastic_settings:
  elastic:
    # Default values for elasticsearch.
    # This is a YAML-formatted file.
    # Declare variables to be passed into your templates.
    esName: "elastic"
    namespace: "elastic"
    appVersion: "7.17.4"
    # enableTrial should be a quoted string. only yes value make changes
    enableTrial: "yes"
    apm:
      enabled: "yes"
    labels:
      elastic: elastic
    annotations:
      sidecar.istio.io/inject: "false" # istio-proxy conflicts with nativeTLS
    istio:
      enabled: "no"
    nativeTLS:
      enabled: "yes" # required for xpack.security.authc.token and oidc
    oidc_gcloud:
      enabled: "yes"
      vault_path: "secret/oidc_google_prod" # expect oidc_client_id, oidc_client_secret & oidc_discovery_url
      oidc_realm_name: "google"
      secret_name: "oidc"
      configmap_name: "oidc"
    saml_gcloud:
      enabled: "yes"
      vault_path: "secret/saml_google_prod"
      saml_realm_name: "gsuite"
      secret_name: "saml"
      configmap_name: "saml"
    slack_notification:
      enabled: "yes"
      vault_path: "secret/red/elastic-notification-accounts"
      secret_name: "slack-notification"
    smtp_notification:
      enabled: "yes"
      vault_path: "secret/red/elastic-notification-accounts"
      secret_name: "smtp-notification"
    elasticNodeSets:
      - name: master
        config: |
          node.master: true
          node.data: false
          node.ingest: true
          node.ml: true
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "20Gi"
        ES_JAVA_OPTS: -Xms16g -Xmx16g
        nodesCount: 3
        workloadsType: master
        memoryRequests: "16Gi"
        cpuRequests: "7"
        memoryLimit: 20Gi
        cpuLimit: "7"
      - name: data
        config: |
          node.master: false
          node.data: true
          node.ingest: false
          node.ml: false
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "750Gi"
        ES_JAVA_OPTS: -Xms31g -Xmx31g
        nodesCount: 13
        memoryRequests: "52Gi"
        cpuRequests: "8"
        memoryLimit: 54Gi
        cpuLimit: "15"
      - name: coor
        config: |
          node.master: false
          node.data: false
          node.ingest: false
          node.ml: false
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "30Gi"
        ES_JAVA_OPTS: -Xms14g -Xmx14g
        nodesCount: 3
        workloadsType: coor
        memoryRequests: "26Gi"
        cpuRequests: "4"
        memoryLimit: 28Gi
        cpuLimit: "7"
  kibana:
    enabled: true
    # cert_ttl: "143h"
    name: kibana
    esName: "elastic"
    namespace: "elastic"
    kibanaVersion: "7.17.4"
    oidc_provider:
      enabled: "yes"
      realm: "google"
      istio_gateway_fqdn: "kk.regemini.io"
    saml_provider:
      enabled: "yes"
      realm: "gsuite"
      istio_gateway_fqdn: "kk.regemini.io"
    xpack_reporting_index_re:
      enabled: "yes"
