elastic_settings:
  elastic:
    # Default values for elasticsearch.
    # This is a YAML-formatted file.
    # Declare variables to be passed into your templates.
    esName: "elastic"
    namespace: "elastic"
    appVersion: "7.17.4"
    # enableTrial should be a quoted string. only yes value make changes
    enableTrial: "yes"
    apm:
      enabled: "yes"
    labels:
      elastic: elastic
    annotations:
      sidecar.istio.io/inject: "false" # istio-proxy conflicts with nativeTLS
    istio:
      enabled: "no"
    nativeTLS:
      enabled: "yes" # required for xpack.security.authc.token and oidc
    oidc_gcloud:
      enabled: "yes"
      vault_path: "secret/oidc_google_prod" # expect oidc_client_id, oidc_client_secret & oidc_discovery_url
      oidc_realm_name: "google"
      secret_name: "oidc"
      configmap_name: "oidc"
    saml_gcloud:
      enabled: "yes"
      vault_path: "secret/saml_google_prod"
      saml_realm_name: "gsuite"
      secret_name: "saml"
      configmap_name: "saml"
    slack_notification:
      enabled: "yes"
      vault_path: "secret/red/elastic-notification-accounts"
      secret_name: "slack-notification"
    smtp_notification:
      enabled: "yes"
      vault_path: "secret/red/elastic-notification-accounts"
      secret_name: "smtp-notification"
    performance_settings:
      enabled: "yes"
    elasticNodeSets:
      - name: master
        config: |
          node.master: true
          node.data: false
          node.ingest: true
          node.ml: true
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
          xpack.security.transport.ssl.certificate_authorities:
          - /usr/share/elasticsearch/config/other/remote.ca.crt
        storageSize: "30Gi"
        ES_JAVA_OPTS: -Xms13g -Xmx13g
        nodesCount: 3
        workloadsType: mstr
        memoryRequests: "14Gi"
        cpuRequests: "7"
        memoryLimit: 14Gi
        cpuLimit: "7"
        podTemplate:
          spec:
            containers:
            - name: elasticsearch
              volumeMounts:
              - mountPath: /usr/share/elasticsearch/config/other
                name: remote-certs
            volumes:
            - name: remote-certs
              secret:
                secretName: remote-certs
      - name: data
        config: |
          node.master: false
          node.data: true
          node.ingest: false
          node.ml: false
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
          xpack.security.transport.ssl.certificate_authorities:
          - /usr/share/elasticsearch/config/other/remote.ca.crt
        storageSize: "750Gi"
        ES_JAVA_OPTS: -Xms26g -Xmx26g
        nodesCount: 13
        memoryRequests: "29Gi"
        cpuRequests: "15"
        memoryLimit: "29Gi"
        cpuLimit: "15"
        podTemplate:
          spec:
            containers:
            - name: elasticsearch
              volumeMounts:
              - mountPath: /usr/share/elasticsearch/config/other
                name: remote-certs
            volumes:
            - name: remote-certs
              secret:
                secretName: remote-certs
      - name: coor
        config: |
          node.master: false
          node.data: false
          node.ingest: false
          node.ml: false
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: true
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
          xpack.security.transport.ssl.certificate_authorities:
          - /usr/share/elasticsearch/config/other/remote.ca.crt
        storageSize: "30Gi"
        ES_JAVA_OPTS: -Xms13g -Xmx13g
        nodesCount: 3
        workloadsType: coor
        memoryRequests: "14Gi"
        cpuRequests: "7"
        memoryLimit: 14Gi
        cpuLimit: "7"
        podTemplate:
          spec:
            containers:
            - name: elasticsearch
              volumeMounts:
              - mountPath: /usr/share/elasticsearch/config/other
                name: remote-certs
            volumes:
            - name: remote-certs
              secret:
                secretName: remote-certs
  kibana:
    enabled: true
    # cert_ttl: "143h"
    name: kibana
    esName: "elastic"
    namespace: "elastic"
    kibanaVersion: "7.17.4"
    oidc_provider:
      enabled: "yes"
      oidc_realm_name: "google"
      istio_gateway_fqdn: "kk.regemini.io"
    # saml_provider:
    #   enabled: "no"
    #   realm: "gsuite"
    #   istio_gateway_fqdn: "kk.regemini.io"
