elastic_settings:
  elastic:
    # Default values for elasticsearch.
    # This is a YAML-formatted file.
    # Declare variables to be passed into your templates.
    esName: "mon"
    namespace: "monitoring"
    appVersion: "7.17.15"
    apmToken: "apm-token"
    # enableTrial should be a quoted string. only yes value make changes
    enableTrial: "yes"
    apm:
      enabled: "yes"
    labels:
      monitoring: elastic
    annotations:
      sidecar.istio.io/inject: "false" # istio-proxy conflicts with nativeTLS
    istio:
      enabled: "no"
    nativeTLS:
      enabled: "yes" # required for xpack.security.authc.token and oidc
    oidc_gcloud:
      enabled: "yes"
      vault_path: "secret/misc/oidc/google" # expect oidc_client_id, oidc_client_secret & oidc_discovery_url
      oidc_realm_name: "google"
      secret_name: "oidc"
      configmap_name: "oidc"
    elasticNodeSets:
      - name: master
        config: |
          node.roles: 
            - master
          node.store.allow_mmap: false
          index.store.type: niofs
          ingest.geoip.downloader.enabled: false
          xpack.monitoring.collection.enabled: false
          xpack.security.authc.realms:
            native:
              native1:
                order: 2
        storageSize: "1Gi"
        ES_JAVA_OPTS: -Xms4g -Xmx4g
        nodesCount: 3
        memoryRequests: "6Gi"
        cpuRequests: "1"
        memoryLimit: 8Gi
        cpuLimit: 2
      - name: data
        config: |
          node.roles: 
            - data
          node.store.allow_mmap: false
          index.store.type: niofs
          ingest.geoip.downloader.enabled: false
          xpack.monitoring.collection.enabled: false
          xpack.security.authc.realms:
            native:
              native1:
                order: 2
        storageSize: "1400Gi"
        ES_JAVA_OPTS: -Xms4g -Xmx4g
        nodesCount: 5
        memoryRequests: "6Gi"
        cpuRequests: "1"
        memoryLimit: 8Gi
        cpuLimit: 2
        podTemplate:
          spec:
            nodeSelector:
              workloadsType: es-monitoring

  kibana:
    enabled: true
    # cert_ttl: "143h"
    name: kibana
    esName: "mon"
    namespace: "monitoring"
    kibanaVersion: "7.17.15"
    oidc_provider:
      enabled: "yes"
      realm: "google"
    istio_gateway_fqdn: "logs.t.regemini.io"
    # saml_provider:
    #   enabled: "no"
    xpack_security:
      enabled: "yes"
      vault_path: "secret/es-creds-compose-prod/kibana"
      secret_name: "xpack-security"
    gcs_enable: "no"
