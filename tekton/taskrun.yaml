apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: redis-
  namespace: tekton-pipelines
spec:
  taskRef:
    name: tg-run
  workspaces:
    - name: ws # this workspace name must be declared in the Task
      emptyDir: {}
  params:
    - name: path
      value: "k8s/tekton/redis"
    - name: branch
      value: "master"
      #value: "\\#150_dr"
