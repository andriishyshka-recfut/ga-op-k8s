apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: elastic7-
  namespace: tekton-pipelines
spec:
  taskRef:
    name: tg-run
  workspaces:
    - name: ws # this workspace name must be declared in the Task
      emptyDir: {}
  params:
    - name: path
      value: "k8s/tekton/elastic7"
    - name: branch
      value: "\\#180-elastic7-sandbox"
