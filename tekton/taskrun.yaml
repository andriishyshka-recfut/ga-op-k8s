apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: grafana-ingress
  namespace: tekton-pipelines
spec:
  taskRef:
    name: tg-run
  workspaces:
    - name: ws # this workspace name must be declared in the Task
      emptyDir: {}
  params:
    - name: path
      value: "k8s/tekton/03-ingress"
    - name: branch
      value: "\\#8-grafana-red"
