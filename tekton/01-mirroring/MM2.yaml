apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaMirrorMaker2
metadata:
  name: mm2
  namespace: kafka
spec:
  version: 2.7.0
  replicas: 1
  connectCluster: "target"
  template:
    pod:
      tolerations:
        - key: "workloadsType"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: workloadsType
                  operator: In
                  values:
                    - mm2
      metadata:
        annotations:
          sidecar.istio.io/inject: "false"
  jvmOptions:
    -Xms: 7G
    -Xmx: 7G
  resources:
      limits:
        cpu: 6
        memory: 9G
      requests:
        cpu: 1
        memory: 7G
  clusters:
  - alias: "source"
    bootstrapServers: CHANGEME:32100
  - alias: "target"
    bootstrapServers: kafka-cluster-kafka-bootstrap:9092
    config:
      producer.max.request.size: 52428800
      producer.compression.type: gzip
      config.storage.replication.factor: 2
      offset.storage.replication.factor: 2
      status.storage.replication.factor: 2
  mirrors:
  - sourceCluster: "source"
    targetCluster: "target"
    topicsPattern: "artifact|checker.*|crypto.*|mage.*|dome.*|minion.*|syncmage.*|testcart.*|urlscan.*|upsert.*|upsertmage.*|whirl.*"
    topicsBlacklistPattern: "dome[.]+.*[.]+.*|minion[.]+.*[.]+.*"
    groupsPattern: ".*"
    sourceConnector:
      tasksMax: 40
      config:
        producer.enable.idempotence: true
        producer.max.in.flight.requests.per.connection: 1
        producr.acks: all
        producer.retries: 2147483647
        offset-syncs.topic.replication.factor: 2
        sync.topic.acls.enabled: "false"
        replication.policy.separator: ""
        replication.policy.class: "io.strimzi.kafka.connect.mirror.IdentityReplicationPolicy"
    heartbeatConnector:
      config:
        heartbeats.topic.replication.factor: 1
    checkpointConnector:
      config:
        checkpoints.topic.replication.factor: 2
        replication.policy.separator: ""
        replication.policy.class: "io.strimzi.kafka.connect.mirror.IdentityReplicationPolicy"
        sync.group.offsets.enabled: "true"
