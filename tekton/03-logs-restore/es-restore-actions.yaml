---
actions:
  1:
    action: restore
    description: "Restore filebeat-7 indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "minio"
      name: monitoring-dr-%Y%m%d
      rename_pattern: 'filebeat(.+)'
      rename_replacement: 'filebeat-previous$1'
      wait_for_completion: True
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: filebeat-7
