---
actions:
  1:
    action: restore
    description: "Restore filebeat-7 indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "minio"
      ignore_unavailable: True
      # name: monitoring-dr-ofb-%Y%m%d
      wait_for_completion: False
      include_global_state: False
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: monitoring-dr-ofb-
