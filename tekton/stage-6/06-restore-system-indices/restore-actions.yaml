---
actions:
  1:
    action: restore
    description: "Restore system indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "minio"
      # name: monitoring-dr-system-%Y%m%d
      wait_for_completion: True
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
      - filtertype: pattern
        kind: prefix
        value: monitoring-dr-system-
