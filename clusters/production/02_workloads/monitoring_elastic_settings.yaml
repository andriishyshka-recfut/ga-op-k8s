elastic_settings:
  elastic:
    # Default values for elasticsearch.
    # This is a YAML-formatted file.
    # Declare variables to be passed into your templates.
    esName: "monitoring"
    namespace: "monitoring"
    appVersion: "7.12.1"
    # enableTrial should be a quoted string. only yes value make changes
    enableTrial: "yes"
    apm:
      enabled: "yes"
    labels:
      monitoring: elastic
    annotations:
      sidecar.istio.io/inject: "false" # istio-proxy conflicts with nativeTLS
    istio:
      enabled: "no"
      gateway_fqdn: "es.p.regemini.io"
      # mTLS prevent filebeat send logs to es service
      # only "yes" will make effect
      mTLS_enabled: "no"
      cert_ttl: "144h"
    nativeTLS:
      enabled: "yes" # required for xpack.security.authc.token and oidc
    oidc_gcloud:
      enabled: "yes"
      vault_path: "/secret/oidc_google_prod" # expect oidc_client_id, oidc_client_secret & oidc_discovery_url
      oidc_realm_name: "google"
      secret_name: "oidc"
      configmap_name: "oidc"
    elasticNodeSets:
      - name: master
        config: |
          node.master: true
          node.data: true
          node.ingest: true
          node.ml: true
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: false
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "500Gi"
        ES_JAVA_OPTS: -Xms6g -Xmx6g
        nodesCount: 3
        memoryRequests: "7Gi"
        cpuRequests: "1"
        memoryLimit: "7Gi"
        cpuLimit: "1"

  kibana:
    enabled: true
    # cert_ttl: "143h"
    name: kibana
    esName: "monitoring"
    namespace: "monitoring"
    kibanaVersion: "7.12.1"
    oidc_provider:
      enabled: "yes"
      realm: "google"
      istio_gateway_fqdn: "mon.p.regemini.io"
