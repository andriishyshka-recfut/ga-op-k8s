---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maid-cracker-frontend-cert
  namespace: istio-system
spec:
  commonName: maid-cracker.p.regemini.io
  dnsNames:
  - maid-cracker.p.regemini.io
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: maid-cracker-frontend-cert

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: maid-cracker-api-ingress
  namespace: maid
spec:
  rules:
  - host: maid-cracker.p.regemini.io
    http:
      paths:
      - backend:
          service:
            name: maid-cracker
            port:
              number: 8080
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - maid-cracker.p.regemini.io
    secretName: maid-cracker-frontend-cert
