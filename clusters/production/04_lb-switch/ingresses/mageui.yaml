---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mageui-frontend-cert
  namespace: istio-system
spec:
  commonName: mageui.p.regemini.io
  dnsNames:
  - mageui.p.regemini.io
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: mageui-frontend-cert

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: mageui-api-ingress
  namespace: magescanner
spec:
  rules:
  - host: mageui.p.regemini.io
    http:
      paths:
      - backend:
          service:
            name: mageui
            port:
              number: 8080
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - mageui.p.regemini.io
    secretName: mageui-frontend-cert
