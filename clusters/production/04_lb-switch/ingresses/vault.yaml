apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-cert
  namespace: istio-system
  labels:
    managed-by: terraform
spec:
  secretName: vault-cert
  commonName: vault.p.regemini.io
  dnsNames:
  - vault.p.regemini.io
  - vault.p.digaweb.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: vault
  namespace: vault
spec:
  rules:
  - host: vault.p.digaweb.com
    http:
      paths:
      - backend:
          serviceName: vault-active
          servicePort: 8200
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - vault.p.digaweb.com
    secretName: vault-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: vault2
  namespace: vault
spec:
  rules:
  - host: vault.p.regemini.io
    http:
      paths:
      - backend:
          service:
            name: vault-active
            port:
              number: 8200
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - vault.p.regemini.io
    secretName: vault-cert
