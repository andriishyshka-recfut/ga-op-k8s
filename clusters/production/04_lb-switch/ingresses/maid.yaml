---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maid-frontend-cert
  namespace: istio-system
spec:
  commonName: maid.p.regemini.io
  dnsNames:
  - maid.p.regemini.io
  # - maid.p.digaweb.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: maid-frontend-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: maid-frontend
  namespace: maid
spec:
  rules:
  - host: maid.p.regemini.io
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - maid.p.regemini.io
    secretName: maid-frontend-cert
