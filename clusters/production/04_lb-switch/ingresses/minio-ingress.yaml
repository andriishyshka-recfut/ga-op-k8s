apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  labels:
    app: minio
  name: minio-ingress
  namespace: minio
spec:
  rules:
  - host: minio.p.digaweb.com
    http:
      paths:
      - backend:
          serviceName: minio
          servicePort: 9000
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - minio.p.digaweb.com
    secretName: minio-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minio-cert
  namespace: istio-system
spec:
  secretName: minio-cert
  commonName: minio.p.digaweb.com
  dnsNames:
  - minio.p.digaweb.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
