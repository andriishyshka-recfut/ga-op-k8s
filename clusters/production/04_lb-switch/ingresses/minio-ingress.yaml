apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  labels:
    app: minio
  name: minio-ingress
  namespace: minio
spec:
  rules:
  - host: minio.p.digaweb.com
    http:
      paths:
      - backend:
          serviceName: minio
          servicePort: 9000
        path: /*
        pathType: ImplementationSpecific
      - backend:
          serviceName: fake
          servicePort: 777
        path: /minio/v2/metrics/*
        pathType: ImplementationSpecific
      - backend:
          serviceName: fake
          servicePort: 777
        path: /minio/prometheus/*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - minio.p.digaweb.com
    secretName: minio-cert-old
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minio-cert-digaweb
  namespace: istio-system
spec:
  secretName: minio-cert-digaweb
  commonName: minio.p.digaweb.com
  dnsNames:
  - minio.p.digaweb.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: minio-cert
  namespace: istio-system
spec:
  secretName: minio-cert
  commonName: minio.p.regemini.io
  dnsNames:
  - minio.p.regemini.io
  # - minio.p.digaweb.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  labels:
    app: minio
  name: minio-ingress2
  namespace: minio
spec:
  rules:
  - host: minio.p.regemini.io
    http:
      paths:
      - backend:
          service:
            name: minio
            port:
              number: 9000
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - minio.p.regemini.io
    secretName: minio-cert
