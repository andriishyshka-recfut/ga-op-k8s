---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vortex-cert
  namespace: istio-system
spec:
  secretName: vortex-cert
  commonName: vortex.p.regemini.io
  dnsNames:
  - vortex.p.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: vortex
  namespace: core
spec:
  rules:
  - host: vortex.p.regemini.io
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - vortex.p.regemini.io
    secretName: vortex-cert
