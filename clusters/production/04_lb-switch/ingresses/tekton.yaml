---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tekton-cert
  namespace: istio-system
spec:
  secretName: tekton-cert
  commonName: tekton.p.regemini.io
  dnsNames:
  - tekton.p.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: tekton
  namespace: tekton-pipelines
spec:
  rules:
  - host: tekton.p.regemini.io
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - tekton.p.regemini.io
    secretName: tekton-cert
