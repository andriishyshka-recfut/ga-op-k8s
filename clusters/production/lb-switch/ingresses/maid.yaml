---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maid-frontend-cert
  namespace: istio-system
spec:
  commonName: maid.p.digaweb.com
  dnsNames:
  - maid.p.digaweb.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: maid-frontend-cert
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: maid-frontend-ingress
  namespace: maid
spec:
  rules:
  - host: maid.p.digaweb.com
    http:
      paths:
      - backend:
          serviceName: oauth2-proxy
          servicePort: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - maid.p.digaweb.com
    secretName: maid-frontend-cert
