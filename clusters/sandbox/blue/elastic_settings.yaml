elastic_settings:
  elastic:
    # Default values for elasticsearch.
    # This is a YAML-formatted file.
    # Declare variables to be passed into your templates.
    esName: "monitoring"
    namespace: "monitoring"
    appVersion: "7.9.2"
    # enableTrial should be a quoted string. only yes value make changes
    enableTrial: "yes"
    labels:
      monitoring: elastic
    istio:
      enabled: "no"
      gateway_fqdn: "es.infra.digaweb.com"
      # mTLS prevent filebeat send logs to es service
      # only "yes" will make effect
      mTLS_enabled: "no"
      cert_ttl: "144h"
    elasticNodeSets:
      - name: master
        config: |
          node.master: true
          node.data: true
          node.ingest: true
          node.ml: true
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: false
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "50Gi"
        ES_JAVA_OPTS: -Xms1g -Xmx1g
        nodesCount: 3
        memoryRequests: "1Gi"
        cpuRequests: "0.5"
        memoryLimit: 1.5Gi
        cpuLimit: 1

  kibana:
    enabled: true
    istio_gateway_fqdn: "kibana.infra.digaweb.com"
    cert_ttl: "143h"
    name: kibana
    esName: "monitoring"
    namespace: "monitoring"
    kibanaVersion: "7.9.2"
