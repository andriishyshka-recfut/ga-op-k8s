---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-info-cert
  namespace: istio-system
spec:
  secretName: cluster-info-cert
  commonName: cluster-info.infra.digaweb.com
  dnsNames:
  - cluster-info.infra.digaweb.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: cluster-info
  namespace: default
spec:
  rules:
  - host: cluster-info.infra.digaweb.com
    http:
      paths:
      - backend:
          serviceName: info-page
          servicePort: 80
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - cluster-info.infra.digaweb.com
    secretName: cluster-info-cert
