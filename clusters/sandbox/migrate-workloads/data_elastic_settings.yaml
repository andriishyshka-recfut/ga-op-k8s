elastic_settings:
  elastic:
    # Default values for elasticsearch.
    # This is a YAML-formatted file.
    # Declare variables to be passed into your templates.
    esName: "sandbox"
    namespace: "elastic"
    appVersion: "7.11.0"
    # enableTrial should be a quoted string. only yes value make changes
    enableTrial: "yes"
    apm:
      enabled: "no"
    labels:
      data: elastic
    annotations:
      sidecar.istio.io/inject: "false" # istio-proxy conflicts with nativeTLS
    istio:
      enabled: "no"
    nativeTLS:
      enabled: "yes" # required for xpack.security.authc.token and oidc
    oidc_gcloud:
      enabled: "yes"
      vault_path: "/secret/oidc_google_test" # expect oidc_client_id, oidc_client_secret & oidc_discovery_url
      oidc_realm_name: "google"
      secret_name: "oidc"
      configmap_name: "oidc"
    elasticNodeSets:
      - name: master
        config: |
          node.master: true
          node.data: true
          node.ingest: true
          node.ml: true
          node.store.allow_mmap: false
          index.store.type: niofs
          xpack.monitoring.collection.enabled: false
          xpack.security.authc.realms:
            native:
              native1:
                order: 1
        storageSize: "100Gi"
        ES_JAVA_OPTS: -Xms4g -Xmx4g
        nodesCount: 1
        memoryRequests: "4Gi"
        cpuRequests: "0.5"
        memoryLimit: 4.5Gi
        cpuLimit: 1

  kibana:
    enabled: true
    # cert_ttl: "143h"
    name: data
    esName: "sandbox"
    namespace: "elastic"
    kibanaVersion: "7.10.1"
    oidc_provider:
      enabled: "yes"
      realm: "google"
      istio_gateway_fqdn: "data.p.digaweb.com"
