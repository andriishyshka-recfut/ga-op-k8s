---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: es7-kibana-cert
  namespace: istio-system
spec:
  secretName: es7-kibana-cert
  commonName: es7.t.regemini.io
  dnsNames:
  - es7.t.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: es7
  namespace: elastic7
spec:
  rules:
  - host: es7.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: es7-kb-http
            port:
              number: 5601
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - es7.t.regemini.io
    secretName: es7-kibana-cert
