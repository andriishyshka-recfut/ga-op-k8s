---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cluster-info-cert
  namespace: istio-system
spec:
  secretName: cluster-info-cert
  commonName: cluster-info.infra.digaweb.com
  dnsNames:
  - cluster-info.infra.digaweb.com
  - cluster-info.t.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: cluster-info
  namespace: cluster-info
spec:
  rules:
  - host: cluster-info.infra.digaweb.com
    http:
      paths:
      - backend:
          serviceName: oauth2-proxy
          servicePort: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - cluster-info.infra.digaweb.com
    secretName: cluster-info-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: cluster-info2
  namespace: cluster-info
spec:
  rules:
  - host: cluster-info.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - cluster-info.t.regemini.io
    secretName: cluster-info-cert
