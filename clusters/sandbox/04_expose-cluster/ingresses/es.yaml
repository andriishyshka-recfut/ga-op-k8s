---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: es-kibana-cert
  namespace: istio-system
spec:
  secretName: es-kibana-cert
  commonName: k.t.regemini.io
  dnsNames:
  - k.t.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: es
  namespace: elastic
spec:
  rules:
  - host: k.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: es-kb-http
            port:
              number: 5601
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - k.t.regemini.io
    secretName: es-kibana-cert
