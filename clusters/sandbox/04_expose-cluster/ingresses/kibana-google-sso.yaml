---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibana-google-sso-cert
  namespace: istio-system
spec:
  commonName: k-google.t.regemini.io
  dnsNames:
  - k-google.t.regemini.io
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: kibana-google-sso-cert

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: kibana-google-sso-ingress
  namespace: sso-elastic
spec:
  rules:
  - host: k-google.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: kibana
            port:
              number: 80
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - k-google.t.regemini.io
    secretName: kibana-google-sso-cert
