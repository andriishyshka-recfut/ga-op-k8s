---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mongo-auth-cert
  namespace: istio-system
spec:
  secretName: mongo-auth-cert
  commonName: mongo-auth.t.regemini.io
  dnsNames:
  - mongo-auth.t.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: mongo-auth
  namespace: mongo-auth
spec:
  rules:
  - host: mongo-auth.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - mongo-auth.t.regemini.io
    secretName: mongo-auth-cert
