apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: vault-cert
  namespace: istio-system
  labels:
    managed-by: terraform
spec:
  secretName: vault-cert
  commonName: vault.infra.digaweb.com
  dnsNames:
  - vault.infra.digaweb.com
  duration: 12h
  renewBefore: 6h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: vault
  namespace: vault
spec:
  rules:
  - host: vault.infra.digaweb.com
    http:
      paths:
      - backend:
          serviceName: vault-active
          servicePort: 8200
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - vault.infra.digaweb.com
    secretName: vault-cert
