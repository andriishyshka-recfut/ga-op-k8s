---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mageui-cert
  namespace: istio-system
spec:
  secretName: mageui-cert
  commonName: mageui.t.regemini.io
  dnsNames:
  - mageui.t.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: mageui
  namespace: magescanner
spec:
  rules:
  - host: mageui.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: mageui
            port:
              number: 3000
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - mageui.t.regemini.io
    secretName: mageui-cert
