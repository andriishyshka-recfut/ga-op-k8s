---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trac-cert
  namespace: istio-system
spec:
  commonName: trac.t.regemini.io
  dnsNames:
  - trac.t.regemini.io
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: trac-cert

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: trac-ingress
  namespace: trac
spec:
  rules:
  - host: trac.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: trac
            port:
              number: 8123
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - trac.t.regemini.io
    secretName: trac-cert
