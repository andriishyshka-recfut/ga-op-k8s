---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kowl-cert
  namespace: istio-system
spec:
  secretName: kowl-cert
  commonName: kowl.t.regemini.io
  dnsNames:
  - kowl.t.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: kowl
  namespace: kafka
spec:
  rules:
  - host: kowl.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - kowl.t.regemini.io
    secretName: kowl-cert
