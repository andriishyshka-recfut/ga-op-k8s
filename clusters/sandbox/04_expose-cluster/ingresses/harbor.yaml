
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-core-cert
  namespace: istio-system
spec:
  secretName: harbor-core-cert
  commonName: harbor.t.regemini.io
  dnsNames:
  - harbor.t.regemini.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  labels:
    app: harbor
  name: harbor-ingress
  namespace: harbor
spec:
  rules:
  - host: harbor.t.regemini.io
    http:
      paths:
      - backend:
          service:
            name: harbor-harbor-core
            port:
              number: 80
        path: /api/*
        pathType: ImplementationSpecific
      - backend:
          service:
            name: harbor-harbor-core
            port:
              number: 80
        path: /service/*
        pathType: ImplementationSpecific
      - backend:
          service:
            name: harbor-harbor-core
            port:
              number: 80
        path: /v2/*
        pathType: ImplementationSpecific
      - backend:
          service:
            name: harbor-harbor-core
            port:
              number: 80
        path: /chartrepo/*
        pathType: ImplementationSpecific
      - backend:
          service:
            name: harbor-harbor-core
            port:
              number: 80
        path: /c/*
        pathType: ImplementationSpecific
      - backend:
          service:
            name: harbor-harbor-portal
            port:
              number: 80
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - harbor.t.regemini.io
    secretName: harbor-core-cert
