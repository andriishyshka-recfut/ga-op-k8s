---
- hosts: localhost
  connection: local
  become: False
  vars_files:
    - vars/main.yml
  vars:
    initial_setup: False
    oidc_discovery_url: "{{ lookup('env','oidc_discovery_url') | trim }}"
    oidc_client_id: "{{ lookup('env','oidc_client_id') | trim }}"
    oidc_client_secret: "{{ lookup('env','oidc_client_secret') | trim }}"
  tasks:
  - name: Create temp_dir
    file:
        path: "{{ temp_dir }}"
        state: directory
        mode: '0755'

  - name: Set vault FQDN
    set_fact:
        vault_addr: "{{ lookup('env','VAULT_ADDR')  }}"
        vault_ca_path: "{{ temp_dir }}/vault_ca"

  - name: try {{ vault_addr }}
    uri:
      url: "{{ vault_addr }}/ui/"
      return_content: yes
      validate_certs: no
    register: result
    retries: 3
    delay: 10
    until: result.content.find("Vault") != -1

  - name: Put vault_cert on temp_fs
    copy:
      content: "{{ lookup('env','CA_CERT') }}"
      dest: "{{ vault_ca_path }}"


  - name: Find ca bundle path
    shell: |
      import certifi
      print(certifi.where())
    args:
      executable: "{{ ansible_python_interpreter }}"
    register: ca_bundle_path

  - name: Set requests_ca_bundle fact
    set_fact:
      requests_ca_bundle: "{{ ca_bundle_path.stdout | trim }}"

  - name: Update ca bundle with certifi
    shell: |
      import certifi
      import requests
      import sys
      import os
      try:
        print('Checking connection to Vault...')
        test = requests.get('{{ vault_addr }}')
      except requests.exceptions.SSLError as err:
        print('SSL Error. Adding custom certs to Certifi store...')
        cafile = certifi.where()
        customca = os.environ.get('CA_CERT')
        print(customca)
        with open(cafile, 'ab') as outfile:
          outfile.write(bytes(customca,encoding='utf8'))
        print(certifi.where())
      try:
        print('Checking connection to Vault...')
        test = requests.get('{{ vault_addr }}')
        print('That might have worked.')
      except requests.exceptions.SSLError as err:
        print('Stil getting same exception. something went with certifi')
        print(err)
        sys.exit(1)
    args:
      executable: "{{ ansible_python_interpreter }}"
    environment:
       REQUESTS_CA_BUNDLE: "{{ requests_ca_bundle }}"
       #SSL_CERT_FILE: "{{ vault_ca_path }}"


  # - name: test2
  #   shell: |
  #     cat /usr/local/lib/python3.7/dist-packages/certifi/cacert.pem
  #   register: test
  # - debug: msg="{{ test | to_nice_json }}"

  - name: Get vault status
    hashivault_status:
    environment:
      REQUESTS_CA_BUNDLE: "{{ requests_ca_bundle }}"
    register: vault_status
    retries: 5
    delay: 10
    until: vault_status.rc == 0


  - debug: msg="{{ vault_status | to_nice_json }}"

  - name: Init and unseal
    block:

    - name: Run operator Init
      shell: |
        vault operator init
      changed_when: True
      register: init_out
      environment:
        VAULT_CACERT: "{{ vault_ca_path }}"
    # - debug: msg="{{ init_out | to_nice_json }}"

    - name: Set facts based on operator init
      set_fact:
        root_token: "{% for line in init_out.stdout_lines -%}
                        {% if line.find('Initial Root Token:') != -1 -%}
                          {{  line.split(':')[1] | trim }}
                        {%- endif %}
                    {%- endfor %}"
        recovery_keys: "{% set output = dict() %}
                {% for line in init_out.stdout_lines -%}
                  {% if line.find('Recovery Key') != -1 -%}
                    {% set index =  output | length %}
                    {% set _ = output.update( { 'recovery_key_' + index | string  : line.split(':')[1] | trim } )  %}
                  {%- endif %}
                {%- endfor %}
                {{ output }}"
        recovery_keys_list: "{% set output = [] %}
                {% for line in init_out.stdout_lines -%}
                  {% if line.find('Recovery Key') != -1 -%}
                    {% set _ = output.append(  line.split(':')[1] | trim  )  %}
                  {%- endif %}
                {%- endfor %}
                {{ output }}"
        initial_setup: True
    when: vault_status.status.initialized == false and vault_status.status.sealed == true

  - name: Define token for provisioning
    set_fact:
      vault_token: "{%- if root_token is undefined -%}
                    {{ lookup('env','VAULT_TOKEN')  | trim }}
                    {%- else -%}
                    {{ root_token | trim }}
                    {%- endif -%}"
      oidc_setup: "{% if oidc_discovery_url == 'SAMPLE' or oidc_client_id  == 'SAMPLE' or oidc_client_secret == 'SAMPLE' or
       oidc_discovery_url | length < 1 or oidc_client_id | length < 1 or oidc_client_secret | length < 1 %}False{% else %}True{% endif %}"

  - name: Assert that vault token configured
    assert:
      that:
      - vault_token | length > 0
      - ( initial_setup and oidc_setup ) or ( not initial_setup and not oidc_setup ) or oidc_setup

  - name: Configure vault
    block:

    - name: Enable kv backend
      hashivault_secret_engine:
            name: "secret"
            backend: "kv"
      register: status
      retries: 3
      delay: 10
      until: status.rc == 0

    - name:
      hashivault_write:
        secret: "recovery-keys"
        data: "{{ recovery_keys | from_yaml }}"
      when: initial_setup
      register: status
      ignore_errors: True

    - debug: msg="{{ status }}"

    - name: enable oidc secret engine
      hashivault_auth_method:
        method_type: oidc
      when: oidc_setup
      register: status
      retries: 3
      delay: 10
      until: status.rc == 0

    - name:  configure oidc mount
      hashivault_oidc_auth_method_config:
        oidc_discovery_url: "{{ oidc_discovery_url }}"
        oidc_client_id: "{{ oidc_client_id }}"
        oidc_client_secret: "{{ oidc_client_secret }}"
      when: oidc_setup
      register: status
      retries: 3
      delay: 10
      until: status.rc == 0

    - name: create  role
      hashivault_oidc_auth_role:
        name: "111"
        bound_audiences: ["{{ oidc_client_id }}"]
        allowed_redirect_uris:
          - "{{ vault_addr }}/ui/vault/auth/oidc/oidc/callback"
          - "http://localhost:8250/oidc/callback"
        token_policies: ["admin"]
      when: oidc_setup
      register: status
      retries: 3
      delay: 10
      until: status.rc == 0

    - name: Create policy
      hashivault_policy:
        name: "admin"
        rules: "{{ lookup('file', 'vault-admin-policy.hcl' )}}"
      when: oidc_setup
      register: status
      retries: 3
      delay: 10
      until: status.rc == 0

    - name: Enable audit
      hashivault_audit:
        device_type: file
        options:
          path: "stdout"


    environment:
       REQUESTS_CA_BUNDLE: "{{ requests_ca_bundle }}"
       VAULT_CACERT: "{{ vault_ca_path }}"
       VAULT_TOKEN: "{{ vault_token }}"
