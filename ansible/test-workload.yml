- hosts: localhost
  connection: local
  become: False
  vars_files:
    - vars/main.yml
  tasks:
    - name: Create temp_dir
      file:
        path: "{{ temp_dir }}"
        state: directory
        mode: '0755'

    - name: Put cluster_ca_certificate
      copy:
        dest: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"
        content: "{{ k8s_cluster_ca_certificate }}"

    - name: Create test certificate
      k8s:
          state: present
          definition: "{{ lookup ('template','k8s-test-certificate.yaml') }}"
          api_key: "{{ k8s_api_key }}"
          host: "{{ k8s_host_url }}"
          ca_cert: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"

    - name:  create test workload
      k8s:
          state: present
          definition: "{{ lookup ('template','k8s-test-workload.yaml') }}"
          api_key: "{{ k8s_api_key }}"
          host: "{{ k8s_host_url }}"
          ca_cert: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"

    #- name:  try https://{{ test_workload_name }}.{{ cluster_name }}.{{ domain }} with curl
      #shell: |
          #curl -kv https://{{ test_workload_name }}.{{ cluster_name }}.{{ domain }}
      #register: result
      #retries: 3
      #delay: 10
      #until: result.stdout.find("Thank you for using nginx.") != -1

    - name: try https://{{ test_workload_name }}.{{ cluster_name }}.{{ domain }}
      uri:
        url: "https://{{ test_workload_name }}.{{ cluster_name }}.{{ domain }}"
        return_content: yes
        validate_certs: no
      register: result
      retries: 3
      delay: 10
      until: result.content.find("Self Destructing Notes") != -1

    - debug: msg="{{ result.content }}"

