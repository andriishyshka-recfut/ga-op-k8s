---
- hosts: gcp_name_bastion
  connection: ssh
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - debug: msg="{{ ansible_hostname }}"

    - name: update system
      apt:
        update_cache: yes
        upgrade: dist

    - name: install prerequisits
      apt:
       update_cache: yes
       pkg:
        - wireguard
        - bc
        - linux-headers-cloud-amd64
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg2
        - software-properties-common
        - unzip
        - python-docker
        - docker-compose
      retries: 3
      delay: 3
      register: result
      until: not result.failed

    - name: Add Docker GPG key
      apt_key: url=https://download.docker.com/linux/ubuntu/gpg
      retries: 3
      delay: 3
      register: result
      until: not result.failed


    - name: Add Docker APT repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution|lower }} {{ ansible_distribution_release }} stable
      retries: 3
      delay: 3
      register: result
      until: not result.failed


    - name: Install Docker
      apt:
        name: docker-ce
        update_cache: yes
      retries: 3
      delay: 3
      register: result
      until: not result.failed

    - name: Update sysctl
      sysctl:
        name: "{{ item }}"
        value: '1'
        sysctl_set: yes
        state: present
      with_items:
        - net.ipv6.conf.all.forwarding
        - net.ipv4.ip_forward

    - name: Reboot
      reboot:
        reboot_timeout: 3600
  
    - name: Load required modules
      modprobe:
        state: present
        name: "{{ item }}"
      with_items:
        - wireguard
        - iptable_nat
        - ip6table_nat

    - name: Make modules persistent
      lineinfile:
        path: /etc/modules-load.d/modules.conf
        line: "{{ item }}"
        state: present
      with_items:
        - wireguard
        - iptable_nat
        - ip6table_nat


    - name: Copy envoy files
      copy:
        src: "bastion-compose"
        dest: "/etc"
        mode: "preserve"


    - name: Copy docker-compose
      template:
          src: "docker-compose.yaml"
          dest: "{{ compose_dest }}/docker-compose.yaml"

    - name: find all *-compose.yaml file
      find:
        path: "{{ compose_dest }}"
        patterns: "*-compose.yaml"
      register: registered_files

    - name: Create array from found files in format required for COMPOSE_FILE
      set_fact:
        compose_files: "{% set output = [] %}\
              {% for element in registered_files.files %}\
                {{ output.append( element.path ) }}\
             {% endfor %}\
             {{ output }}"

    - name: Start all
      docker_compose:
        project_src: "{{ compose_dest }}"
        files: "{{ compose_files }}"
        build: yes
        recreate: always
        remove_orphans: yes
      register: output


    - name: Autoclean dependecnies
      apt:
        autoclean: yes
        autoremove: yes

    - name: Reboot
      reboot:
        reboot_timeout: 3600


    - name: try https://{{ bastion_dns }}
      uri:
        url: "https://{{ bastion_dns }}/signin"
        return_content: yes
        validate_certs: yes
      register: result
      retries: 5
      delay: 20
      until: result.content.find("Subspace") != -1
