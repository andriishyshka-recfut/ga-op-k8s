
  - name: Create temp_dir
    file:
        path: "{{ temp_dir }}"
        state: directory
        mode: '0755'

  - name: Set vault FQDN
    set_fact:
        # vault_addr: "{{ lookup('env','VAULT_ADDR')  }}"
        vault_ca_path: "{{ temp_dir }}/vault_ca"

  - name: try {{ vault_addr }}
    uri:
      url: "{{ vault_addr }}/ui/"
      return_content: yes
      validate_certs: no
    register: result
    retries: 3
    delay: 10
    until: result.content.find("Vault") != -1

  - debug: msg="{{ vault_addr | urlsplit('hostname') }}"

  - name: Retrive certificate for {{ vault_addr }}
    shell: |
      import socket
      from OpenSSL import SSL
      from OpenSSL import crypto
      context = SSL.Context(SSL.SSLv23_METHOD)
      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
      connection = SSL.Connection(context,s)
      connection.connect(('{{ vault_addr | urlsplit('hostname') }}',443))
      connection.set_tlsext_host_name(str.encode("{{ vault_addr | urlsplit('hostname') }}"))
      connection.setblocking(1)
      try:
        connection.do_handshake()
      except OpenSSL.SSL.WantReadError:
        print("Timeout")
        quit()
      for cert in connection.get_peer_cert_chain():
        subject_str = "".join("/{0:s}={1:s}".format(name.decode(), value.decode()) for name, value in cert.get_subject().get_components() )
        if 'Vault managed Root CA' in subject_str:
          print (crypto.dump_certificate(crypto.FILETYPE_PEM, cert).decode('ascii') )
      # print(connection.get_peer_cert_chain()[0].get_subject())
      # print(connection.get_peer_cert_chain()[1].get_subject())
    args:
      executable: "{{ ansible_python_interpreter }}"
    register: vault_cert

  - name: Put vault_cert on temp_fs
    copy:
      content: "{{ vault_cert.stdout | trim  }}"
      dest: "{{ vault_ca_path }}"

  - debug: msg="{{ vault_cert.stdout | trim  }}"

  - name: Find ca bundle path
    shell: |
      import certifi
      print(certifi.where())
    args:
      executable: "{{ ansible_python_interpreter }}"
    register: ca_bundle_path
    changed_when: False

  - name: Set requests_ca_bundle fact
    set_fact:
      requests_ca_bundle: "{{ ca_bundle_path.stdout | trim }}"

  - name: Update ca bundle with certifi
    shell: |
      import certifi
      import requests
      import sys
      import os
      try:
        print('Checking connection to Vault...')
        test = requests.get('{{ vault_addr }}')
      except requests.exceptions.SSLError as err:
        print('SSL Error. Adding custom certs to Certifi store...')
        cafile = certifi.where()
        #customca = os.environ.get('CA_CERT')
        with open('{{ vault_ca_path }}', 'r',encoding='UTF-8') as infile:
          customca = infile.read()
        print(customca)
        with open(cafile, 'ab') as outfile:
          outfile.write(bytes(customca,encoding='utf8'))
        print(certifi.where())
      try:
        print('Checking connection to Vault...')
        test = requests.get('{{ vault_addr }}')
        print('That might have worked.')
      except requests.exceptions.SSLError as err:
        print('Stil getting same exception. something went with certifi')
        print(err)
        sys.exit(1)
    args:
      executable: "{{ ansible_python_interpreter }}"
    environment:
       REQUESTS_CA_BUNDLE: "{{ requests_ca_bundle }}"
       CA_CERT: "{{ vault_cert.stdout | trim  }}"
    register: status
    retries: 3
    delay: 10
    until: status.rc == 0

       #SSL_CERT_FILE: "{{ vault_ca_path }}"

