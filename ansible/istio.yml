---
- hosts: localhost
  connection: local
  become: False
  vars_files:
    - vars/main.yml
  tasks:
  - name: Create temp_dir
    file:
        path: "{{ temp_dir }}"
        state: directory
        mode: '0755'

  - debug: msg="{{ ansible_hostname }}"

  - name: Unpack istio
    unarchive:
      src: https://github.com/istio/istio/releases/download/{{ istio_version }}/istio-{{ istio_version }}-linux-amd64.tar.gz
      dest: "{{ temp_dir }}"
      mode: "0744"
      remote_src: yes

  - name: Put cluster_ca_certificate
    copy:
      dest: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"
      content: "{{ k8s_cluster_ca_certificate }}"
      mode: "0644"

  - name: Create a k8s namespace
    k8s:
      name: istio-system
      api_version: v1
      kind: Namespace
      state: present
      api_key: "{{ k8s_api_key }}"
      host: "{{ k8s_host_url }}"
      ca_cert: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"


  - name: Generate istio install manifest
    shell: |
      set -e
      {{ temp_dir }}/istio-{{ istio_version }}/bin/istioctl manifest generate  \
        --set meshConfig.ingressControllerMode="DEFAULT" \
        --set meshConfig.accessLogFile="/dev/stdout" \
        --set meshConfig.accessLogEncoding="JSON" \
        --set components.ingressGateways[0].k8s.hpaSpec.minReplicas=2 \
        --set components.ingressGateways[0].name=istio-ingressgateway \
        --set components.ingressGateways[0].k8s.service.type=NodePort \
        --set components.ingressGateways[0].k8s.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].labelSelector.matchLabels.app=istio-ingressgateway \
        --set components.ingressGateways[0].k8s.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey="topology.kubernetes.io/zone" \
          1> {{ temp_dir }}/{{ cluster_name }}_install-manifest.yaml &&\
        sed 's/ "cpu": "100m"/ "cpu": "10m"/' -i {{ temp_dir }}/{{ cluster_name }}_install-manifest.yaml
    args:
      creates: "{{ temp_dir }}/{{ cluster_name }}_install-manifest.yaml"

  - name: Apply manifest
    shell: |
      kubectl apply --server {{ k8s_host_url }} \
        --token {{ k8s_api_key }} --certificate-authority {{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt \
        -f {{ temp_dir }}/{{ cluster_name }}_install-manifest.yaml
    register: manifest_apply
    retries: 3
    delay: 11
    until: manifest_apply.rc == 0
    changed_when: True


  - debug: msg="{{ manifest_apply | to_nice_json }}"
