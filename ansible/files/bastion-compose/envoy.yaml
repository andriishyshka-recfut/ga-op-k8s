static_resources:
  listeners:
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 443
    listener_filters:
      - name: "envoy.filters.listener.tls_inspector"
        typed_config: {}
    filter_chains:
    - filter_chain_match:
        server_names: ["p.digaweb.com"]
      filters:
      - name: envoy.filters.network.tcp_proxy
        config:
          stat_prefix: ingress_tcp
          cluster: subspace-https
    - filter_chain_match:
        server_names: ["b.digaweb.com"]
      filters:
      - name: envoy.filters.network.tcp_proxy
        config:
          stat_prefix: ingress_tcp
          cluster: subspace-https
    - filter_chain_match:
        server_names: ["*.p.digaweb.com"]
      filters:
      - name: envoy.filters.network.tcp_proxy
        config:
          stat_prefix: ingress_tcp
          cluster: production-https
    - filter_chain_match:
        server_names: ["*.infra.digaweb.com"]
      filters:
      - name: envoy.filters.network.tcp_proxy
        config:
          stat_prefix: ingress_tcp
          cluster: sandbox-https
    - filters:
      - name: envoy.filters.network.tcp_proxy
        config:
          stat_prefix: ingress_tcp
          cluster: default
  - address:
      socket_address:
        address: 0.0.0.0
        port_value: 80
    filter_chains:
    - filters:
      - name: envoy.http_connection_manager
        config:
          server_name: bastion
          codec_type: auto
          stat_prefix: ingress_http
          route_config:
            validate_clusters: false
            virtual_hosts:
            - name: production
              domains: ["*.p.digaweb.com"]
              routes:
              - match: { prefix: "/.well-known/acme-challenge/" }
                route: { cluster: production-http }
              - match: { prefix: "/" }
                redirect:
                  https_redirect: true
            - name: sandbox
              domains: ["*.infra.digaweb.com"]
              routes:
              - match: { prefix: "/.well-known/acme-challenge/" }
                route: { cluster: sandbox-http }
              - match: { prefix: "/" }
                redirect:
                  https_redirect: true
            - name: backend
              domains: ["p.digaweb.com"]
              routes:
              - match: { prefix: "/.well-known/acme-challenge/" }
                route: { cluster: subspace-http }
              - match: { prefix: "/" }
                redirect:
                  https_redirect: true
            - name: backend2
              domains: ["b.digaweb.com"]
              routes:
              - match: { prefix: "/.well-known/acme-challenge/" }
                route: { cluster: subspace-http }
              - match: { prefix: "/" }
                redirect:
                  https_redirect: true
          http_filters:
          - name: envoy.router
            config: {}
  clusters:
  - name: xds_cluster
    connect_timeout: 0.5s
    http2_protocol_options: {}
    type: strict_dns
    load_assignment:
      cluster_name: xds_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: control-plane
                port_value: 1234
  - name: default
    connect_timeout: 0.5s
    type: strict_dns
    lb_policy: round_robin
    hosts:
    - socket_address:
        address: 8.8.8.8
        port_value: 443
  - name: subspace-http
    connect_timeout: 0.5s
    type: strict_dns
    lb_policy: round_robin
    hosts:
    - socket_address:
        address: subspace
        port_value: 80
  - name: subspace-https
    connect_timeout: 0.5s
    type: strict_dns
    lb_policy: round_robin
    hosts:
    - socket_address:
        address: subspace
        port_value: 443
admin:
  access_log_path: "/dev/stdout"
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8001
dynamic_resources:
  cds_config:
    resource_api_version: V3
    api_config_source:
      api_type: GRPC
      transport_api_version: V3
      grpc_services:
      - envoy_grpc:
          cluster_name: xds_cluster
  lds_config:
    resource_api_version: V3
    api_config_source:
      api_type: GRPC
      transport_api_version: V3
      grpc_services:
      - envoy_grpc:
          cluster_name: xds_cluster
node:
  cluster: test-cluster
  id: test-id
