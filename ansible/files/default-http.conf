server {
        listen 80;
        listen [::]:80;

        root /var/www/certbot;
        index index.html index.htm index.nginx-debian.html;

        #server_name example.com www.example.com;

        location / {
                return 301 https://$http_host$request_uri;
        }

        location ~ /.well-known/acme-challenge {
                allow all;
                root /var/www/certbot/ ;
        }
}
