
#load_module modules/ngx_http_modsecurity_module.so;
#load_module modules/ngx_http_cookie_flag_filter_module.so;

user nginx;

#https://www.nginx.com/blog/performance-tuning-tips-tricks/ http://nginx.org/en/docs/ngx_core_module.html#worker_rlimit_nofile
worker_processes  auto;
worker_rlimit_nofile 2048;
worker_priority -10;
timer_resolution 100ms;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
}


http {

    include       mime.types;
    default_type  application/octet-stream;

    log_format custom
  '{'
    '"time":"$time_local",'
    '"remote_addr":"$remote_addr:$remote_port",'
    '"backend":"$proxy_host",'
    '"sslv":"$ssl_protocol",'
    '"ssl_cipher":"$ssl_cipher",'
    '"http_request":"$request",'
    '"http_status":"$status",'
    '"http_host":"$http_host",'
    '"method":"$request_method",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"request":"$uri",'
    '"request_time":"$request_time",'
    '"request_length":"$request_length",'
    '"pipe":"$pipe",'
    '"bytes_sent":"$bytes_sent",'
    '"http_referrer":"$http_referer",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_addr":"$upstream_addr",'
    '"http_user_agent":"$http_user_agent",'
    '"ssl_client_verify":"$ssl_client_verify",'
    '"ssl_client_s_dn":"$ssl_client_s_dn",'
    '"ssl_client_i_dn":"$ssl_client_i_dn",'
    '"http_x_auth_name":"$http_x_auth_name",'
    '"cookie_Balancer":"$cookie_Balancer",'
    '"gzip_ratio":"$gzip_ratio"'
  '}';
    access_log  /var/log/nginx/access.log  custom;

    sendfile        on;
    #tcp_nopush     on;
    client_max_body_size 100M;
    proxy_read_timeout 15m;
    proxy_max_temp_file_size 0;
    client_body_buffer_size 10M;
    proxy_http_version 1.1;

    keepalive_timeout  65;
    gzip  on;
    server_tokens off;

    include /etc/nginx/conf.d/*-http.conf;
}
stream {
    log_format custom
  '{'
    '"time":"$time_local",'
    '"remote_addr":"$remote_addr:$remote_port",'
    '"protocol":"$protocol",'
    '"bytes_received":"$bytes_received",'
    '"status":"$status",'
    '"bytes_sent":"$bytes_sent",'
    '"server_addr":"$server_addr",'
    '"server_port":"$server_port",'
    '"session_duration":"$session_time",'
    '"feconn":"0",'
    '"beconn":"0",'
    '"upstream_addr":"$upstream_addr"'
  '}';
    access_log  /var/log/nginx/access.log custom;
    error_log  /var/log/nginx/error.log warn;
    proxy_connect_timeout 30s;
    proxy_timeout 180s;
    ssl_preread on;

    include /etc/nginx/conf.d/*-stream.conf;
}
