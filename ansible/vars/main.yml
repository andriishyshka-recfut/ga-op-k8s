sa_key_json: "{{ lookup('env','GOOGLE_CREDENTIALS') }}"
kube_config: "{{ lookup('env','KUBECONFIG') }}"
project: "{{ lookup('env','GOOGLE_PROJECT') }}"
region: "{{ lookup('env','GOOGLE_REGION') }}"
cluster_name: "{{ lookup('env','CLUSTER') }}"
cluster_color: "{{ lookup('env','COLOR') }}"
cluster_settings: "{{ lookup('env','CLUSTER_SETTINGS') | from_json }}"
domain: "{{ cluster_settings.clusters[cluster_name].domain }}"
subdomain: "{{ cluster_settings.clusters[cluster_name].subdomain }}"
compose_dest: "/etc/bastion-compose"
bastion_dns: "{{ cluster_settings.bastion_dns }}"
istio_version: "{{ cluster_settings.clusters[cluster_name][cluster_color].istio.version }}"
test_workload_name: "{{ cluster_settings.clusters[cluster_name].test_workload_name }}"
k8s_host_url: "{{ lookup('env','HOST') }}"
k8s_api_key: "{{ lookup('env','API_KEY') }}"
k8s_cluster_ca_certificate: "{{ lookup('env','CLUSTER_CA_CERTIFICATE') }}"
k8s_red_host_url: "{{ lookup('env','RED_HOST') }}"
k8s_red_api_key: "{{ lookup('env','RED_API_KEY') }}"
k8s_red_cluster_ca_certificate: "{{ lookup('env','RED_CLUSTER_CA_CERTIFICATE') }}"
temp_dir: "{{ lookup('env','HOME') }}/tmp-{{ cluster_name }}"
vault_addr: "{{ lookup('env','vault_addr') }}"
letsencrypt_email: "dmitry.chorine@recordedfuture.com"
letsencrypt_staging: ""
