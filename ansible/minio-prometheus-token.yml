- name: Generate MinIO Prometheus token
  hosts: localhost
  gather_facts: false
  vars:
    minio_url: "https://minio-api-red.regemini.io"
    vault_token_path: "secret/misc/minio/prometheus/token"

  tasks:
    - name: Generate MinIO Prometheus token
      shell: |
        set -euo pipefail

        export MC_CONFIG_DIR="/tmp/mc-prometheus-token"
        rm -rf "$MC_CONFIG_DIR"
        mkdir -p "$MC_CONFIG_DIR"
        trap 'rm -rf "$MC_CONFIG_DIR"' EXIT

        mc alias set red-minio "{{ minio_url }}" "{{ minio_access_key }}" "{{ minio_secret_key }}" >/dev/null
        mc admin prometheus generate red-minio --api-version v3 | awk '/bearer_token:/ {print $2}'
      args:
        executable: /bin/bash
      register: minio_token
      changed_when: true

    - name: Fail if token is empty
      fail:
        msg: "Failed to generate MinIO Prometheus token"
      when: minio_token.stdout | trim == ""

    - name: Store token in Vault
      shell: |
        vault kv put {{ vault_token_path }} token="{{ minio_token.stdout | trim }}"
      args:
        executable: /bin/bash