---
- hosts: localhost
  connection: local
  become: False
  vars_files:
    - vars/main.yml
  tasks:
  - name: Create temp_dir
    file:
        path: "{{ temp_dir }}"
        state: directory
        mode: '0755'

  - name: Put cluster_ca_certificate
    copy:
      dest: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"
      content: "{{ k8s_cluster_ca_certificate }}"

  - name:  Apply
    k8s:
      state: present
      definition: "{{ lookup ('env','k8s_apply_value') }}"
      api_key: "{{ k8s_api_key }}"
      host: "{{ k8s_host_url }}"
      ca_cert: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"
