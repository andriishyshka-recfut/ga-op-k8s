    #
    # - name: Start {{ subdomain }} control plane
    #   docker_compose:
    #     project_src: "{{ subdomain }}"
    #     files: "{{ compose_files }}"
    #     build: yes
    #     recreate: always
    #     remove_orphans: yes
    #   register: output

    - name: Start all
      docker_compose:
        project_src: "{{ compose_dest }}"
        files: "{{ compose_files }}"
        build: yes
        recreate: smart
        remove_orphans: yes
        debug: yes
        timeout: 60
      register: output

    - pause:
        seconds: 5

    - name: Recreate envoy
      docker_compose:
        project_src: "{{ compose_dest }}"
        files: "{{ compose_files }}"
        recreate: always
        remove_orphans: yes
        debug: yes
        timeout: 60
        services:
          - envoy
      register: output
