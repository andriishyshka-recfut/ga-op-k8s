- hosts: all
  connection: ssh
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  vars_files:
    - vars/main.yml
  tasks:
    - debug: msg="{{ ansible_hostname }}"

    - name: Create temp_dir
      file:
        path: "{{ temp_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: False

    - name: Put cluster_ca_certificate
      copy:
        dest: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"
        content: "{{ k8s_cluster_ca_certificate }}"
      delegate_to: localhost
      become: False

    - name: Put red cluster_ca_certificate
      copy:
        dest: "{{ temp_dir }}/production-red_clstr_ca.crt"
        content: "{{ k8s_red_cluster_ca_certificate }}"
      delegate_to: localhost
      become: False
      when: cluster_name == "production"

    - name: Get mapping of istio gw NodePort
      shell: |
        kubectl --server {{ k8s_host_url }} \
          --token {{ k8s_api_key }} --certificate-authority {{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt \
          get svc istio-ingressgateway -o json -n istio-ingress
      register: nodeport_mapping
      delegate_to: localhost
      become: False
      changed_when: False

    - name: Get mapping of red istio gw NodePort
      shell: |
        kubectl --server {{ k8s_red_host_url }} \
          --token {{ k8s_red_api_key }} --certificate-authority {{ temp_dir }}/production-red_clstr_ca.crt \
          get svc istio-ingressgateway -o json -n istio-ingress
      register: nodeport_red_mapping
      delegate_to: localhost
      become: False
      changed_when: False
      when: cluster_name == "production"

    - debug: msg="nodePort is {{ item.nodePort }}"
      with_items: "{{ (nodeport_mapping.stdout | from_json).spec.ports }}"
      when: item.name == 'https'

    # - name: Copy control plane files
    #   copy:
    #     src: "bastion-compose/go-control-plane"
    #     dest: "/etc/bastion-compose"
    #     mode: "preserve"

    - name: Copy envoy.yaml
      copy:
        src: "bastion-compose/envoy-{{ cluster_name }}.yaml"
        dest: "/etc/bastion-compose/envoy.yaml"

    - name: set nodePort
      set_fact:
        nodePort: "{{ item.nodePort }}"
      with_items: "{{ (nodeport_mapping.stdout | from_json).spec.ports }}"
      when: item.name == 'https'

    - name: set nodePort HTTP
      set_fact:
        nodePortHttp: "{{ item.nodePort }}"
      with_items: "{{ (nodeport_mapping.stdout | from_json).spec.ports }}"
      when: item.name == 'http2'

    - when: cluster_name == "production"
      block:
        - name: set nodePortRed
          set_fact:
            nodePortRed: "{{ item.nodePort }}"
          with_items: "{{ (nodeport_red_mapping.stdout | from_json).spec.ports }}"
          when: item.name == 'https'

        - name: set nodePortRed HTTP
          set_fact:
            nodePortHttpRed: "{{ item.nodePort }}"
          with_items: "{{ (nodeport_red_mapping.stdout | from_json).spec.ports }}"
          when: item.name == 'http2'

    - name: Get bastion token from k8s secret
      shell: |
        kubectl --server {{ k8s_host_url }} \
          --token {{ k8s_api_key }} --certificate-authority {{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt \
          get secret bastion-token -n kube-system -o json
      register: bastion_secret
      delegate_to: localhost
      become: False
      changed_when: False

    - name: Set token and ca_cert
      set_fact:
        token: "{{ (bastion_secret.stdout | from_json).data.token | b64decode }}"
        ca_cert: "{{ (bastion_secret.stdout | from_json).data['ca.crt'] | b64decode }}"

    - name: Get bastion red token from k8s secret
      shell: |
        kubectl --server {{ k8s_red_host_url }} \
          --token {{ k8s_red_api_key }} --certificate-authority {{ temp_dir }}/production-red_clstr_ca.crt \
          get secret bastion-token -n kube-system -o json
      register: bastion_red_secret
      delegate_to: localhost
      become: False
      changed_when: False
      when: cluster_name == "production"

    - name: Set red token and ca_cert from bastion secret
      set_fact:
        token_red: "{{ (bastion_red_secret.stdout | from_json).data.token | b64decode }}"
        ca_cert_red: "{{ (bastion_red_secret.stdout | from_json).data['ca.crt'] | b64decode }}"
      when: cluster_name == "production"

    - name: update xds config
      template:
        src: xds-config-{{ cluster_name }}.yaml.j2
        dest: "{{ compose_dest }}/config.yaml"

    - name: find all *-compose.yaml file
      find:
        path: "{{ compose_dest }}"
        patterns:
          - "*-compose.yaml"
          - "*-compose.yml"
      register: registered_files

    - name: Create array from found files in format required for COMPOSE_FILE
      set_fact:
        compose_files: "{% set output = [] %}\
          {% for element in registered_files.files %}\
          {{ output.append( element.path ) }}\
          {% endfor %}\
          {{ output }}"

    - name: Start all
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dest }}"
        files: "{{ compose_files }}"
        build: always
        recreate: always
        remove_orphans: yes
        timeout: 60
        services:
          - envoy
      register: output

    - pause:
        seconds: 5

    - name: Recreate discovery
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dest }}"
        files: "{{ compose_files }}"
        recreate: always
        remove_orphans: yes
        timeout: 60
        services:
          - control-plane
      register: output

    - name: Validate that control-plane container running
      shell: |
        sleep 10
        docker inspect --format="{{ '{{' }}.State.Status{{ '}}' }}" control-plane
      changed_when: False
      retries: 5
      delay: 5
      register: inspect_status
      until: inspect_status.stdout.find("running") != -1
