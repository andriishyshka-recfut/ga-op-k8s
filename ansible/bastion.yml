- hosts: gcp_name_bastion
  connection: ssh
  become: true
  vars_files:
    - vars/main.yml
  tasks:
    - debug: msg="{{ ansible_hostname }}"

    - name: Create temp_dir
      file:
          path: "{{ temp_dir }}"
          state: directory
          mode: '0755'
      delegate_to: localhost
      become: False

    - name: Put cluster_ca_certificate
      copy:
        dest: "{{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt"
        content: "{{ k8s_cluster_ca_certificate }}"
      delegate_to: localhost
      become: False

    - name: Get mapping of istio gw NodePort
      shell: |
        kubectl --server {{ k8s_host_url }} \
          --token {{ k8s_api_key }} --certificate-authority {{ temp_dir }}/{{ cluster_name }}_clstr_ca.crt \
          get svc istio-ingressgateway -o json -n istio-system
      register: nodeport_mapping
      delegate_to: localhost
      become: False
      changed_when: False

    - debug: msg="nodePort is {{ item.nodePort }}"
      with_items: '{{ (nodeport_mapping.stdout | from_json).spec.ports }}'
      when: item.name == 'https'

    - name: Copy control plane files
      copy:
        src: "bastion-compose/go-control-plane"
        dest: "/etc/bastion-compose"
        mode: "preserve"

    - name: Copy envoy.yaml
      copy:
        src: "bastion-compose/envoy.yaml"
        dest: "/etc/bastion-compose"


    - name: set nodePort
      set_fact:
        nodePort:  "{{ item.nodePort }}"
      with_items: '{{ (nodeport_mapping.stdout | from_json).spec.ports }}'
      when: item.name == 'https'

    - name: set nodePort HTTP
      set_fact:
        nodePortHttp:  "{{ item.nodePort }}"
      with_items: '{{ (nodeport_mapping.stdout | from_json).spec.ports }}'
      when: item.name == 'http2'

    - name: add {{ subdomain }}-compose.yaml
      template:
        src: upstream-compose.yaml.j2
        dest: "{{ compose_dest }}/{{ subdomain }}-compose.yaml"

    - name: find all *-compose.yaml file
      find:
        path: "{{ compose_dest }}"
        patterns: "*-compose.yaml"
      register: registered_files

    - name: Create array from found files in format required for COMPOSE_FILE
      set_fact:
        compose_files: "{% set output = [] %}\
              {% for element in registered_files.files %}\
                {{ output.append( element.path ) }}\
             {% endfor %}\
             {{ output }}"

    - name: Create .env file with multiple compose configs
      template:
        src: env.j2
        dest: "{{ compose_dest }}/.env"

    # - name: Copy dockerfiles and other files
