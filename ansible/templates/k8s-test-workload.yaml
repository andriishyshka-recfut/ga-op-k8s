---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ test_workload_name }}
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Service
metadata:
  name: {{ test_workload_name }}
  namespace: {{ test_workload_name }}
  labels:
    app: {{ test_workload_name }}
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app: {{ test_workload_name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ test_workload_name }}
  namespace: {{ test_workload_name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ test_workload_name }}
      version: v1
  template:
    metadata:
      labels:
        app: {{ test_workload_name }}
        version: v1
    spec:
      containers:
      - image: drmurx/docker-d-note
        imagePullPolicy: IfNotPresent
        name: {{ test_workload_name }}
        ports:
        - containerPort: 8080
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: {{ test_workload_name }}-gateway
  namespace: {{ test_workload_name }}
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ test_workload_name }}-cert
      hosts:
        - {{ test_workload_name }}.{{ cluster_name }}.{{ domain }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ test_workload_name }}
  namespace: {{ test_workload_name }}
spec:
  hosts:
  - "{{ test_workload_name }}.{{ cluster_name }}.{{ domain }}"
  gateways:
  - {{ test_workload_name }}-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 80
        host: {{ test_workload_name }}.{{ test_workload_name }}.svc.cluster.local
