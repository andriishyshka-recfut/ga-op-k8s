map $ssl_preread_server_name $name {
    {{ bastion_dns }}   default_backend;
    {% for cluster in cluster_settings.keys() | list %}
    ~.{{ cluster }}.{{ cluster_settings[cluster].domain }} {{ cluster }}_backend ;
    {% endfor %}

    default                  default_backend;
}



upstream default_backend {
    server 127.0.0.1:8443 ;
}

server {
    listen      443;
    proxy_pass  $name;
    ssl_preread on;
}
