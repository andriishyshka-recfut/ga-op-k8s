map $ssl_preread_server_name $name {
    {{ bastion_dns }}   subspace_backend;
    {% for cluster in cluster_settings.keys() | list %}
    {% if cluster_settings[cluster] is mapping  and 'active' in cluster_settings[cluster] %}
    ~.{{ cluster_settings[cluster].subdomain }}.{{ cluster_settings[cluster].domain }} {{ cluster_settings[cluster].subdomain }}_backend ;
    {% endif %}
    {% endfor %}

    ~.regemini.com infra_backend ;
    default                  default_backend;
}



upstream subspace_backend {
    server 127.0.0.1:8443 ;
}
upstream default_backend {
    server 8.8.8.8:443 ;
}

server {
    listen      443;
    proxy_pass  $name;
    ssl_preread on;
}
