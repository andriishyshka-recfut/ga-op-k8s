
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: {{ test_workload_name }}-cert
  namespace: istio-system
spec:
  secretName: {{ test_workload_name }}-cert
  commonName: {{ test_workload_name }}.{{ subdomain }}.{{ domain }}
  dnsNames:
  - {{ test_workload_name }}.{{ subdomain }}.{{ domain }}
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
