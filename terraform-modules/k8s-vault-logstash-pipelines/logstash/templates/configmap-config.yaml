---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "logstash-{{ template "logstash.fullname" . }}-config"
  labels:
    app: "{{ template "logstash.fullname" . }}"
    chart: "{{ .Chart.Name }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
data:
  logstash.yml: |
    http.host: 0.0.0.0
    xpack.management.enabled: true
    xpack.management.logstash.poll_interval: {{ .Values.elastic.pollInterval }}
    xpack.management.elasticsearch.username: ${ELASTICSEARCH_USER}
    xpack.management.elasticsearch.password: ${ELASTICSEARCH_PASSWORD}
    xpack.management.elasticsearch.hosts: [{{ .Values.elastic.host }}]
    xpack.management.elasticsearch.ssl.certificate_authority: {{ .Values.mountCaCert.mountPath}}/ca.crt
    xpack.management.pipeline.id: [{{ .Values.elastic.pipelineID | replace " " ","}}]
    xpack.monitoring.enabled: false
    pipeline.ecs_compatibility: disabled
    monitoring.cluster_uuid: {{ .Values.elastic.cluster_uuid }}
    api.auth.type: {{ .Values.logstash.auth }}
    api.auth.basic.username: {{ .Values.logstash.user }}
    api.auth.basic.password: ${LOGSTASH_PASSWORD}
    log.level: {{ .Values.log_level| default "info" }}
    #path.logs: /var/log/logstash
