---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "logstash.fullname" . }}-config
  labels:
    app: "{{ template "logstash.fullname" . }}"
    chart: "{{ .Chart.Name }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
data:
  logstash.yml: |
    http.host: 0.0.0.0
    xpack.management.enabled: true
    xpack.management.logstash.poll_interval: {{ .Values.elastic.pollInterval }}
    xpack.management.elasticsearch.username: ${ES_USER}
    xpack.management.elasticsearch.password: ${ES_PASSWORD}
    xpack.management.elasticsearch.hosts: [{{ .Values.elastic.host }}]
    xpack.management.pipeline.id: [{{ .Values.elastic.pipelineID | replace " " ","}}]
