---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-{{ template "logstash.fullname" . }}
  labels:
    app: "{{ template "logstash.fullname" . }}"
    chart: "{{ .Chart.Name }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
    {{- range $key, $value := .Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  serviceName: {{ template "logstash.fullname" . }}-headless
  selector:
    matchLabels:
      app: "{{ template "logstash.fullname" . }}"
      release: {{ .Release.Name | quote }}
  replicas: {{ .Values.replicas }}
  #podManagementPolicy: {{ .Values.podManagementPolicy }}
  updateStrategy:
    type: {{ .Values.updateStrategy }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: {{ template "logstash.fullname" . }}
    {{- with .Values.persistence.annotations  }}
      annotations:
{{ toYaml . | indent 8 }}
    {{- end }}
    spec:
{{ toYaml .Values.volumeClaimTemplate | indent 6 }}
  {{- end }}
  template:
    metadata:
      name: "{{ template "logstash.fullname" . }}"
      labels:
        app: "{{ template "logstash.fullname" . }}"
        chart: "{{ .Chart.Name }}"
        heritage: {{ .Release.Service | quote }}
        release: {{ .Release.Name | quote }}
        {{- range $key, $value := .Values.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      annotations:
        {{- range $key, $value := .Values.podAnnotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- if .Values.logstashConfig }}
        configchecksum: {{ include (print .Template.BasePath "/configmap-config.yaml") . | sha256sum | trunc 63 }}
        {{- end }}
    spec:
      {{- if .Values.schedulerName }}
      schedulerName: "{{ .Values.schedulerName }}"
      {{- end }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriod }}
      volumes:
        {{- if .Values.mountCaCert.enabled }}
        - name: {{ .Values.mountCaCert.volumeName }}
          secret:
            defaultMode: 420
            items:
              - key: ca.crt
                path: ca.crt
            secretName: {{ template "logstash.fullname" . }}-logstash-https-certs
        {{- end }}
        {{- range .Values.secretMounts }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
        - name: logstashconfig
          configMap:
            defaultMode: 420
            name: "logstash-{{ template "logstash.fullname" . }}-config"
      {{- if .Values.extraVolumes }}
      {{- if eq "string" (printf "%T" .Values.extraVolumes) }}
{{ tpl .Values.extraVolumes . | indent 8 }}
      {{- else }}
{{ toYaml .Values.extraVolumes | indent 8 }}
      {{- end }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      {{- end }}
      {{- if .Values.hostAliases }}
      hostAliases: {{ toYaml .Values.hostAliases | nindent 6 }}
      {{- end }}
      {{- if .Values.extraInitContainers }}
      initContainers:
      {{- if eq "string" (printf "%T" .Values.extraInitContainers) }}
{{ tpl .Values.extraInitContainers . | indent 6 }}
      {{- else }}
{{ toYaml .Values.extraInitContainers | indent 6 }}      
      {{- end }}
      {{- end }}
      containers:
      - name: "{{ template "logstash.name" . }}"
        securityContext:
{{ toYaml .Values.securityContext | indent 10 }}
        image: "{{ .Values.image }}:{{ .Values.imageTag }}"
        command: ['/bin/sh','-c', {{ .Values.command | quote }} ]
        imagePullPolicy: "{{ .Values.imagePullPolicy }}"
        resources:
{{ toYaml .Values.resources | indent 10 }}
        env:
          - name: LS_JAVA_OPTS
            value: "{{ .Values.logstashJavaOpts }}"
          - name: 'ELASTICSEARCH_HOSTS'
            value: {{ .Values.elastic.host }}
          - name: 'ELASTICSEARCH_USER'
            valueFrom:
              secretKeyRef:
                name: {{ template "logstash.fullname" . }}-logstash-es-creds
                key: username
          - name: 'ELASTICSEARCH_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ template "logstash.fullname" . }}-logstash-es-creds
                key: password
          - name: 'LOGSTASH_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ template "logstash.fullname" . }}-logstash-es-creds
                key: logstash_password
          - name: 'MINIO_ENDPOINT'
            value: {{ .Values.minio.endpoint }}
          - name: 'MINIO_BUCKET'
            value: {{ .Values.minio.bucket }}
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ template "logstash.fullname" . }}-logstash-minio-creds
                key: access_key
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ template "logstash.fullname" . }}-logstash-minio-creds
                key: secret_key
{{- if .Values.extraEnvs }}
{{ toYaml .Values.extraEnvs | indent 10 }}
{{- end }}
{{- if .Values.envFrom }}
        envFrom:
{{ toYaml .Values.envFrom | indent 10 }}
{{- end }}
        volumeMounts:
          {{- if .Values.mountCaCert.enabled }}
          - name: {{ .Values.mountCaCert.volumeName }}
            mountPath: {{ .Values.mountCaCert.mountPath}}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          - name: "{{ template "logstash.fullname" . }}"
            mountPath: /usr/share/logstash/data
          {{- end }}
          {{- range .Values.secretMounts }}
          - name: {{ .name }}
            mountPath: {{ .path }}
            {{- if .subPath }}
            subPath: {{ .subPath }}
            {{- end }}
          {{- end }}
          - name: logstashconfig
            mountPath: /usr/share/logstash/config/logstash.yml
            subPath: logstash.yml
        {{- if .Values.extraVolumeMounts }}
        {{- if eq "string" (printf "%T" .Values.extraVolumeMounts) }}
{{ tpl .Values.extraVolumeMounts . | indent 10 }}
        {{- else }}
{{ toYaml .Values.extraVolumeMounts | indent 10 }}
        {{- end }}
        {{- end }}
{{- if .Values.lifecycle }}
        lifecycle:
{{ toYaml .Values.lifecycle | indent 10 }}
{{- end }}
      {{- if .Values.extraContainers }}
      {{- if eq "string" (printf "%T" .Values.extraContainers) }}
{{ tpl .Values.extraContainers . | indent 6 }}
      {{- else }}
{{ toYaml .Values.extraContainers | indent 6 }}
      {{- end }}      
      {{- end }}
