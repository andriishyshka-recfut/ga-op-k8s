name: ansible
namespace: sftp-jobs
command:
  #- /bin/sh
  #- -c
  #- sleep 3600
  - ansible-playbook
  - -v
  - playbook.yml

jobConfigMapName: sftp-job-config #ConfigMap name, specified in chart set in tf module

config:
  sftp: false
  s3: false
  email: false
  batchFile: ~/batchfile
  bucketUrl: https://minio.p.regemini.io
  bucketName: minio-logstash-pipelines-orbital-wording-233917
  minioUser: rf-dome-something
  pipelineName: rf-dome-something
  backupFolder: sent
  pipelineFileExt: csv
  localDestination: /home/ansible/data
  remoteDestination: share/received-data
  useGssApiAuthOption: false
  makeArchive: # zip gz
  createChecksum: false
  rescueNotify: false
  gpgEncrypt: false
  GPGKeyPath: /home/ansible/.gpg #Path to mount gpg key
  GPGKeyName: gpg.key #() Default key name in container
  includeHeaders: false #Include headers to csv file
  opNotify: false #turn on/off rescue slack notify

awsS3:
  bucket: # Required if s3 == true

emailConfig:
  host: smtp.gmail.com #(Hardcoded here) Gmail smtp server host
  port: 587 #(Hardcoded here) Gmail smtp server port
  username: support@geminiadvisory.io #(Hardcoded here) Gmail smtp server username
  # Password for Gmail smtp server is taken from global-creds secret in VAULT
  addresses: user@mail-service.com #(If email == true) Destination addresses to send files to
  cc: threat@geminiadvisory.io #(If email == true)
  bcc: threat@geminiadvisory.io #(If email == true)
  subject: default-subject #(If email == true)

# It's Used when rescueNotify == true
# rescue_email_dest_addresses and rescue_email_cc_addresses must be specified in respective secret in VAULT
rescueNotify:
  emailSubject: "Files sending was failed"


jobCredsSecretName: sftp-job-creds #Secret name, specified in chart set in tf module

sshConfig:
  host: sftp-server # Hostname in ssh config 'alias'
  hostName: sftp-server-main # Hostname of sftp server
  user: user #(REQUIRED) Sftp user will be taken from tfvars as pipeline name
  port: 22 #(Optional if client uses own sftp-server ) Default port 22 specified in input.tf can be overridden in tfvars
  privateKeyPath: /home/ansible/.ssh #(Not) Default key path in container
  privateKeyName: key.pem #() Default key name in container
  strictHostKeyChecking: "no" # Check host keys: yes or no

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 512Mi

failedJobsHistoryLimit: 2
concurrencyPolicy: Forbid
successJobHistoryLimit: 3
startDeadlineSec: 180
backoffLimit: 1
completions: 1
parallelism: 1
istioInjection: false
automountSAT: false
serviceAccount:
  create: false

##################### VOLUMES ###################
