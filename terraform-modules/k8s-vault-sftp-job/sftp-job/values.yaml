    key: SFTP_PORT
    optional: false
  - varName: SSH_PASS
    envType: secret
    key: ssh_password
    optional: false
  - varName: SFTP_BATCH_FILE
    envType: configMap
    key: SFTP_BATCH_FILE
    optional: false
  - varName: SFTP_REMOTE_DEST
    envType: configMap
    key: SFTP_REMOTE_DEST
    optional: false
  - varName: USE_GSSAPIAUTH_OPTION
    envType: configMap
    key: USE_GSSAPIAUTH_OPTION
    optional: false
  - varName: MINIO_URL
    envType: configMap
    key: MINIO_URL
    optional: false
