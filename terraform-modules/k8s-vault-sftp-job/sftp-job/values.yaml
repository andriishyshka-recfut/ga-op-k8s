    envType: configMap
    key: MINIO_BUCKET_NAME
    optional: false
  - varName: PIPELINE_NAME
    envType: configMap
    key: PIPELINE_NAME
    optional: false
  - varName: LOCAL_DEST
    envType: configMap
    key: LOCAL_DEST
    optional: false
  - varName: MINIO_BACKUP_FOLDER
    envType: configMap
    key: MINIO_BACKUP_FOLDER
    optional: false
  - varName: MAKE_ARCHIVE
    envType: configMap
    key: MAKE_ARCHIVE
    optional: false
  - varName: PIPELINE_FILE_EXTENSION
    envType: configMap
    key: PIPELINE_FILE_EXTENSION
    optional: false
  - varName: EMAIL_HOST
    envType: configMap
    key: EMAIL_HOST
    optional: false
  - varName: EMAIL_PORT
    envType: configMap
    key: EMAIL_PORT
    optional: false
  - varName: EMAIL_SUBJECT
    envType: configMap
    key: EMAIL_SUBJECT
    optional: false
  - varName: RESCUE_EMAIL_SUBJECT
    envType: configMap
    key: RESCUE_EMAIL_SUBJECT
    optional: false
  - varName: AWS_S3_ACCESS_KEY
    envType: secret
    key: aws_s3_access_key
    optional: false
  - varName: AWS_S3_SECRET_KEY
    envType: secret
    key: aws_s3_secret_key
    optional: false
  - varName: AWS_S3_BUCKET
    envType: configMap
    key: AWS_S3_BUCKET
    optional: false
  - varName: RESCUE_NOTIFY
    envType: configMap
    key: RESCUE_NOTIFY
    optional: false
  - varName: CREATE_CHECKSUM
    envType: configMap
    key: CREATE_CHECKSUM
    optional: false
  - varName: GPG_ENCRYPT
    envType: configMap
    key: GPG_ENCRYPT
    optional: false
  - varName: INCLUDE_HEADERS
    envType: configMap
    key: INCLUDE_HEADERS
    optional: false
  - varName: OP_NOTIFY
    envType: configMap
    key: OP_NOTIFY
    optional: false
  - varName: EMAIL
    envType: configMap
    key: EMAIL
    optional: false
  - varName: RESCUE_EMAIL_DEST_ADDRESSES
    envType: secret
    key: rescue_email_dest_addresses
    optional: false
  - varName: RESCUE_EMAIL_CC_ADDRESSES
    envType: secret
    key: rescue_email_cc_addresses
    optional: false
  - varName: EMAIL_DEST_ADDRESSES
    envType: secret
    key: email_dest_addresses
    optional: false
  - varName: EMAIL_CC_ADDRESSES
    envType: secret
    key: email_cc_addresses
    optional: false
  - varName: EMAIL_BCC_ADDRESSES
    envType: secret
    key: email_bcc_addresses
    optional: false
  - varName: HEADERS
    envType: secret
    key: headers
    optional: false


volumeMounts:
  - name: job-config # Mount playbook
    mountPath: /home/ansible/playbook.yml
    subPath: playbook.yml
    readOnly: false
  - name: ssh-config # Mount ssh config
    mountPath: /home/ansible/.ssh/config
    subPath: config
    readOnly: false


volumes:
  - volumeName: job-config # Creates volume to mount playbook
    type: configMap
    items:
    - key: playbook.yml
      path: playbook.yml
    name: sftp-job-config # Default ConfigMap with configuration
    defaultMode: 384
  - volumeName: ssh-config # Create volume to mount ssh config in home dir
    type: configMap
    items:
    - key: config
      path: config
    defaultMode: 384
    name: sftp-job-config # Default ConfigMap with configuration

image: harbor.t.regemini.io/sandbox/ansible-job:2 # Custom image in our harbor

imagePullSecrets:
  - name: harbor

cronSchedule: "0 1 * * *"

securityContext:
  runAsGroup: 1005
  runAsUser: 1005
  fsGroup: 1005
  runAsNonRoot: true
  #capabilities:
  #  drop:
  #    - ALL

