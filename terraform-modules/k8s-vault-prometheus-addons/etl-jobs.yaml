apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: etl.jobs
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 30m
    name: Some of ETL jobs are failed
    rules:
    - alert: ETLJobsFailed
      annotations:
        description: |
          ETL job {{ $labels.job_name }} failed
        summary: ETL failed jobs is being piled up
      expr: |
        min_over_time(kube_job_failed{namespace="etl"}[30m]) > 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: ETLPodsPending
      annotations:
        description: |
          ETL pod {{ $labels.job_name }} is in Pending phase more than 15m
        summary: ETL pods is in Pending phase more than 15m
      expr: |
        sum(kube_pod_status_phase{namespace="etl",phase=~"Pending"}) > 3
      for: 30m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: ETLMaidRFAliasesWeekend
      annotations:
        description: |
          ETL job maid-rf-aliases-weekend was failed
        summary: ETL job maid-rf-aliases-weekend was failed
      expr: |
        kube_job_failed{namespace="etl",job_name=~"etl-maid-rf-aliases-weekend.+"} > 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: ETLTektonRerunTask
      annotations:
        description: |
          Tekton task {{ $labels.pod }}  was failed
        summary: Check tekton task failed-etl-jobs-rerun
      expr: |
        kube_pod_status_phase{phase="Failed",pod=~"failed-etl-jobs-rerun.+"} == 1
      for: 30m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical