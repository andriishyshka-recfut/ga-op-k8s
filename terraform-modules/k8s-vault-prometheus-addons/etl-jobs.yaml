apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: etl.jobs
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 30m
    name: ETL failed jobs more than 5
    rules:
    - alert: ETLJobsFailed
      annotations:
        description: |
          ETL failed jobs more than 5
        summary: ETL failed jobs is being piled up
      expr: |
        kube_job_failed{namespace="etl"} > 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: ETLPodsNotSucceeded
      annotations:
        description: |
          ETL pods is in Failed Pending or Unknown phase more than 5 pods
        summary: ETL pods is in Failed Pending or Unknown phase
      expr: |
        sum(kube_pod_status_phase{namespace="etl",phase=~"Failed|Pending|Unknown"}) > 3
      for: 30m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: ETLMaidRFAliasesWeekend
      annotations:
        description: |
          ETL job maid-rf-aliases-weekend was failed
        summary: ETL job maid-rf-aliases-weekend was failed
      expr: |
        kube_job_failed{namespace="etl",job_name=~"etl-maid-rf-aliases-weekend.+"} > 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical