apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: bots.dome.scraper-run-requests
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 10m
    name: Bots dome scraper_run_requests
    rules:
    - alert: BotsDomeHealthchekScraperRunRequests
      annotations:
        description: |
          Something wrong with dome bots scraper_run_requests
        summary: Something wrong with dome bot container {{ $labels.container }} with mode {{ $labels.mode }}
      expr: |
        scraper_run_request_errors{project="DOME"} / scraper_run_requests_total{project="DOME"} > .9
      for: 10m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: warning

---

