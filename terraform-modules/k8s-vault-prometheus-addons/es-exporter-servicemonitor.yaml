apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: prometheus
  name: es-exporter
  namespace: monitoring
spec:
  endpoints:
  - interval: 30s
    targetPort: 9206
    path: /
  namespaceSelector:
    matchNames:
    - monitoring
  selector:
    matchLabels:
      app: "prometheus-es-exporter"
