apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: pi-query-expensive
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 1m
    name: An expensive pi query in Elasticsearch
    rules:
    - alert: PiExpensiveESQuery
      annotations:
        description: |
          An expensive query that can be requested by any of our registered users in Elasticsearch
        summary: An expensive query requested by {{ $labels.username }} with query {{ $labels.query }}
      expr: |
        rate(pi_query_expensive[15m]) > 0
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
