apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: es-exporter.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: Elastic logs alert
    rules:
    - alert: UrlscanPublicNoPreps
      annotations:
        description: |
          No PREPs logged by urlscan-public for last 24h
        summary: No PREPs logged by urlscan-public for last 24h
      expr: |
        sum_over_time ( urlscan_public_hits[10m] ) == 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: UrlscanPrivateNoPreps
      annotations:
        description: |
          No PREPs logged by urlscan-private for last 48h
        summary: No PREPs logged by urlscan-private for last 48h
      expr: |
        sum_over_time ( urlscan_private_hits[10m] ) == 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: SyncMageAttackerUrl
      annotations:
        description: |
          The syncmage-attacker-url service has not analyzed any data in the last 12 hours.
        summary: syncmage-attacker-url has exceeded the threshold
      expr: |
        sum_over_time ( syncmage_attacker_url_hits[10m] ) == 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: SyncMageAttackerScript
      annotations:
        description: |
          The syncmage-attacker-script service has not analyzed any data in the last 12 hours.
        summary: syncmage-attacker-script has exceeded the threshold
      expr: |
        sum_over_time ( syncmage_attacker_script_hits[10m] ) == 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: SyncMageAttackerTest
      annotations:
        description: |
          The syncmage-attacker-script-test service has not analyzed any data in the last 12 hours.
        summary: syncmage-attacker-script-test has exceeded the threshold
      expr: |
        sum_over_time ( syncmage_attacker_test_hits[10m] ) == 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: SyncMageSkipRule
      annotations:
        description: |
          The syncmage-attacker-skip-rule service has not analyzed any data in the last 12 hours.
        summary: syncmage-attacker-skip-rule has exceeded the threshold
      expr: |
        sum_over_time ( syncmage_skip_rule_hits[10m] ) == 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: GeoNoAction
      annotations:
        description: |
          No action GO in geo logs for  1 hour.
        summary: No action GO in geo logs for  1 hour
      expr: |
        sum_over_time ( geo_hits[1h] ) == 0
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: ChallengerNoAction
      annotations:
        description: |
          No challenges failed or resolved  by challenger  for  30 mins.
        summary: No challenges failed or resolved  by challenger  for  30 mins
      expr: |
        sum_over_time ( challenger_hits[30m] ) == 0
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: ShoutNoTasks
      annotations:
        description: |
          No tasks completed by shout  within  24h.
        summary: No tasks completed by shout  within  24h.
      expr: |
        sum_over_time ( shout_hits[10m] ) == 0
      for: 1d
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: CaptchaNotReady
      annotations:
        description: |
          No sollution is ready logs by captcha  within  30m.
        summary: No sollution is ready logs by captcha  within  30m.
      expr: |
        sum_over_time ( captcha_hits[30m] ) == 0
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: UpsertdomeUnauthorized
      annotations:
        description: |
          action [indices:admin/create] is unauthorized for user [_upsertDome.ms] found.
        summary: action [indices:admin/create] is unauthorized for user [_upsertDome.ms] found.
      expr: |
        sum_over_time ( upsertdome_unauthorized_hits[5m] ) > 0
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: UpsertminionUnauthorized
      annotations:
        description: |
          action [indices:data/write/bulk[s]] is unauthorized for user [_upsertMinion.ms]
        summary: action [indices:data/write/bulk[s]] is unauthorized for user [_upsertMinion.ms] found.
      expr: |
        sum_over_time ( upsertminion_unauthorized_hits[5m] ) > 0
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
    - alert: DomeMappingChanged
      annotations:
        summary: "{{ $labels.hits_by_container_name_space }} - mapping was changed"
      expr: >
        group by (hits_by_container_name_space)
        (sum_over_time(dome_mapping_hits_by_container_name_doc_count[1d])) >
        0
      for: 8h
      labels:
      cluster: production
      component: stream-processor
      severity: warning