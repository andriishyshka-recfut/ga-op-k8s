apiVersion: v1
kind: Service
metadata:
  name: wordpress-node-exporter
  namespace: monitoring
  labels:
    app: wordpress-node-exporter
    release: prometheus
spec:
  type: ExternalName
  externalName: 35.236.199.248
  ports:
  - name: metrics
    port: 9100
    protocol: TCP
    targetPort: 9100

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wordpress-node-exporter
  namespace: monitoring
  labels:
    app: wordpress-node-exporter
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
    - monitoring
  selector:
    matchLabels:
      app: wordpress-node-exporter
      release: prometheus
  endpoints:
  - port: metrics
    interval: 15s
    honorLabels: true
