apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: wordpress-cpu
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 2m
    name: WordpressHighCpuUsage
    rules:
    - alert: WordpressHighCpuUsage
      annotations:
        description: |
          This means https://geminiadvisory.io/ server high cpu usage.
        summary: This means https://geminiadvisory.io/ server high cpu usage.
      expr: |
        100 * avg(1 - rate(node_cpu_seconds_total{mode="idle", service="wordpress-node-exporter"}[1m])) > 60
      for: 3m
      labels:
        component: stream-processor
        severity: critical

---

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: wordpress-memory
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: WordpressHighMemoryUsage
    rules:
    - alert: WordpressHighMemoryUsage
      annotations:
        description: |
          This means https://geminiadvisory.io/ server high memory usage.
        summary: This means https://geminiadvisory.io/ server high memory usage.
      expr: |
        100 * (1 - ((avg_over_time(node_memory_MemFree_bytes{service="wordpress-node-exporter"}[1m]) + 
        avg_over_time(node_memory_Cached_bytes{service="wordpress-node-exporter"}[1m]) + 
        avg_over_time(node_memory_Buffers_bytes{service="wordpress-node-exporter"}[1m])) / 
        avg_over_time(node_memory_MemTotal_bytes{service="wordpress-node-exporter"}[1m]))) > 80
      for: 6m
      labels:
        component: stream-processor
        severity: critical

---

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: wordpress-disk-space
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: WordpressHighFileSystemUsage
    rules:
    - alert: WordpressHighFileSystemUsage
      annotations:
        description: |
          This means https://geminiadvisory.io/ server high disk space usage.
        summary: This means https://geminiadvisory.io/ server high disk space usage.
      expr: |
        (100 - ((node_filesystem_avail_bytes{fstype!="rootfs",mountpoint="/mnt/stateful_partition",service="wordpress-node-exporter"} * 100) / 
        node_filesystem_size_bytes{fstype!="rootfs",mountpoint="/mnt/stateful_partition",service="wordpress-node-exporter"})) > 80 or 
        ((100 - ((node_filesystem_avail_bytes{fstype!="rootfs",mountpoint="/",service="wordpress-node-exporter"} * 100) / 
        node_filesystem_size_bytes{fstype!="rootfs",mountpoint="/",service="wordpress-node-exporter"}))) > 80
      labels:
        component: stream-processor
        severity: critical
