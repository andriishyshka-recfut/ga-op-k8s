apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: etl-minio-exporter.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: ETL leftover alerts
    rules:
    - alert: ETLLeftOvers
      annotations:
        description: |
          There are unsent files on logstash-pipelines bucket
        summary: ETL has leftovers on bucket
      expr: |
        sum_over_time ( unsent_etl_files[30m] ) > 0
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical