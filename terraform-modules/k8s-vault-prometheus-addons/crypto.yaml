apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: crypto.upsert
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 30m
    name: Crypto Posts Upsert Preps
    rules:
    - alert: CryptoPostsUpsert
      annotations:
        description: |
          Crypto preps not added last 24h according to topic crypto.posts.upsert
        summary: Crypto preps not added last 24h
      expr: |
        sum(rate(worker_upsert_preps_total{topic='crypto.posts.upsert'}[1d])) < sum(rate(worker_upsert_preps_total{topic='crypto.posts.upsert'}[1d] offset 7d))
      for: 24h
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
  - interval: 30m
    name: Crypto Paste Upsert Preps
    rules:
    - alert: CryptoPasteUpsert
      annotations:
        description: |
          Crypto preps not added last 24h according to topic crypto.paste.upsert
