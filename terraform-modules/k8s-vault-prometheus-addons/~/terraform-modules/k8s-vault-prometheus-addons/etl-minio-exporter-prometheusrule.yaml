apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: etl-minio-exporter.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: ETL-minio
    rules:
    - alert: MinioEtlBucketHasLeftovers
      annotations:
        description: |
          Minio ETL bucket has leftovers
        summary: There unsent ETL files
      expr: |
        sum_over_time ( unsent_etl_files[30m] ) == 1
      for: 30m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
