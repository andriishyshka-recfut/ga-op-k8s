apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: prometheus
  name: go
  namespace: monitoring
spec:
  podMetricsEndpoints:
  - interval: 30s
    port: metrics
    path: /metrics
  namespaceSelector:
    any: true
  #   matchNames:
  #   - magescanner
  #   - core
  #   - maid
  selector:
    matchLabels:
      podMonitor: "go"
