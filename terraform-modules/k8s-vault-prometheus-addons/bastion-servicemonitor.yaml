apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bastion-exporter
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
    - monitoring
  selector:
    matchLabels:
      k8s-app: bastion-exporter
  endpoints:
  - port: metrics
    interval: 30s

---

apiVersion: v1
kind: Service
metadata:
  name: bastion-exporter
  namespace: monitoring
  labels:
    k8s-app: bastion-exporter
spec:
 type: ClusterIP
 ports:
 - name: metrics
   port: 9100
   protocol: TCP
   targetPort: 9100

---

apiVersion: v1
kind: Endpoints
metadata:
  name: bastion-exporter
  namespace: monitoring
  labels:
    k8s-app: bastion-exporter
subsets:
  - addresses:
    - ip: 172.23.0.4
    ports:
      - name: metrics
        port: 9100
        protocol: TCP
