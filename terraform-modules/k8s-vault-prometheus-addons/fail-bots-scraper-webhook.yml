apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: fail-bots-webhook-alertmanager-listener
  namespace: tekton-tasks
spec:
  serviceAccountName: tekton-bots-webhook
  triggers:
  - name: failbotpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'FailBotsScraper'
    bindings:
      - ref: fail-bots-binding
        kind: TriggerBinding      
    template:
      ref: fail-bots-template

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: fail-bots-binding
  namespace: tekton-tasks
spec:
  params:
  - name: id
    value: $(body.alerts[0].labels.source_id)
  - name: mode
    value: $(body.alerts[0].labels.mode)
  - name: pod
    value: $(body.alerts[0].labels.pod)
  - name: namespace
    value: $(body.alerts[0].labels.namespace)    

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: fail-bots-mongo
  namespace: tekton-tasks
spec:
  params:
  - name: id
  - name: mode
  steps:
    - name: fail-bots-mongo
      image: mongo
      env:
      - name: mongo_uri
        valueFrom:
          secretKeyRef:
            name: mongo-auth
            key: URI
      - name: MONGODB_BACKUP_USER
        valueFrom:
          secretKeyRef:
            name: mongo-auth
            key: MONGODB_BACKUP_USER
      - name: MONGODB_BACKUP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mongo-auth
            key: MONGODB_BACKUP_PASSWORD                                                   
      script: |
        #! /bin/bash
        mongosh auth --authenticationDatabase="admin" --username $MONGODB_BACKUP_USER --password $MONGODB_BACKUP_PASSWORD --host mongo-auth-rs0.mongo-auth --quiet --eval 'db.run.find({source: /^$(tt.params.id)$/i, mode: /^$(tt.params.mode)$/i, "end": null}).readPref("primaryPreferred").toArray()'

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: fail-bots-restart
  namespace: tekton-tasks
spec:
  params:
  - name: pod
  - name: namespace
  steps:
    - name: fail-bots-restart
      image: harbor.regemini.io/op/tf:latest   
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        set +x
        set -e
        export VAULT_TOKEN=$(vault write -field=token auth/k8s-${CLUSTER}-${TF_VAR_Color}/login role=tekton jwt=`cat /var/run/secrets/kubernetes.io/serviceaccount/token`)
        export KUBE_TOKEN=$(vault kv get -field=k8s_sa_token secret/kubernetes-${CLUSTER}-${TF_VAR_Color} )
        export KUBE_HOST=$(vault kv get -field=HOST secret/kubernetes-${CLUSTER}-${TF_VAR_Color} )
        export KUBE_CLUSTER_CA_CERT_DATA=$(vault kv get -field=CLUSTER_CA_CERTIFICATE secret/kubernetes-${CLUSTER}-${TF_VAR_Color} )
        kubectl delete pod $(tt.params.pod) -n $(tt.params.namespace)

---

apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: fail-bots-pipeline
  namespace: tekton-tasks
spec:
  params:
  - name: id
  - name: mode
  - name: pod
  - name: namespace
  tasks:
  - name: fail-bots-mongo
    taskRef:
      name: fail-bots-mongo
    params:
    - name: id
      value: $(params.id)
    - name: mode
      value: $(params.mode)
  - name: fail-bots-restart
    taskRef:
      name: fail-bots-restart
    params:
    - name: pod
      value: $(params.pod)
    - name: namespace
      value: $(params.namespace)      
    runAfter:
      - fail-bots-mongo

---

apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: fail-bots-pipelinerun
  namespace: tekton-tasks
spec:
  params:
  - name: id
  - name: mode
  - name: pod
  - name: namespace
  serviceAccountName: tekton-bots-webhook
  pipelineRef:
    name: fail-bots-pipeline
  params:
  - name: id
    value: $(tt.params.id)
  - name: mode
    value: $(tt.params.mode)
  - name: pod
    value: $(tt.params.pod)
  - name: namespace
    value: $(tt.params.namespace)   

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fail-bots-template
  namespace: tekton-tasks
spec:
  params:
  - name: id
  - name: mode
  - name: pod
  - name: namespace
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: fail-bots-
      spec:
        serviceAccountName: tekton-bots-webhook
        pipelineRef:
          name: fail-bots-pipeline
        params:
        - name: id
          value: $(tt.params.id)
        - name: mode
          value: $(tt.params.mode)
        - name: pod
          value: $(tt.params.pod)
        - name: namespace
          value: $(tt.params.namespace)

---

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: fail-bots-trigger
  namespace: tekton-tasks
spec:
  bindings:
  - ref: fail-bots-binding
  template:
    ref: fail-bots-template

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-bots-webhook
  namespace: tekton-tasks
imagePullSecrets:
  - name: harbor

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-bots-triggers-controller-webhook
  namespace: tekton-tasks
subjects:
  - kind: ServiceAccount
    name: tekton-bots-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-bots-triggers-controller-cluster-webhook
  namespace: tekton-tasks
subjects:
  - kind: ServiceAccount
    name: tekton-bots-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-bots-triggers-controller-cluster-workloads
  namespace: tekton-tasks
subjects:
  - kind: ServiceAccount
    name: tekton-bots-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-bots-triggers-workloads-clusterroles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-bots-triggers-workloads-clusterroles
  namespace: tekton-tasks
rules:
- apiGroups: [""]
  resources: ["namespaces", "deployments", "pods"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]