apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: fail-bots-webhook-alertmanager-listener
  namespace: tekton-tasks
spec:
  serviceAccountName: tekton-webhook
  # serviceAccountName: fail-bots-tekton-webhook
  triggers:
  - name: failbotpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'FailBotsScraper2'
    bindings:
      - ref: fail-bots-binding
        kind: TriggerBinding      
    template:
      ref: fail-bots-template
      # ref: fail-bots-pipeline-template

---

