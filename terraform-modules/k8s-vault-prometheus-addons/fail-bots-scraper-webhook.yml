apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: fail-bots-webhook-alertmanager-listener
  namespace: tekton-tasks
spec:
  serviceAccountName: tekton-bots-webhook
  triggers:
  - name: failbotpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'FailBotsScraper'
      - name: "overlays"
        value:
        - key: extensions.podList
          value: body.alerts.marshalJSON()        
    bindings:
      - ref: fail-bots-binding
        kind: TriggerBinding      
    template:
      ref: fail-bots-template

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: fail-bots-binding
  namespace: tekton-tasks
spec:
  params:
  - name: id
    value: $(body.alerts[0].labels.source_id)
  - name: mode
    value: $(body.alerts[0].labels.mode)
  - name: pod
  - value: $(extensions.podList)
    # value: $(body.alerts[0].labels.pod)
  - name: container
    value: $(body.alerts[0].labels.container)
  - name: namespace
    value: $(body.alerts[0].labels.namespace)     

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: fail-bots-mongo
  namespace: tekton-tasks
spec:
  params:
  - name: id
  - name: mode
  steps:
    - name: fail-bots-mongo
      image: mongo
      env:
      - name: mongo_uri
        valueFrom:
          secretKeyRef:
            name: mongo-auth
            key: URI
      - name: MONGODB_BACKUP_USER
        valueFrom:
          secretKeyRef:
            name: mongo-auth
            key: MONGODB_BACKUP_USER
      - name: MONGODB_BACKUP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mongo-auth
            key: MONGODB_BACKUP_PASSWORD                                                   
      script: |
        #! /bin/bash
        echo $(params.id)
        echo $(params.mode)
        mongosh "mongodb://$MONGODB_BACKUP_USER:$MONGODB_BACKUP_PASSWORD@green-rs0.mongo-auth:27017/auth?ssl=false&authSource=admin&readPreference=primaryPreferred&replicaSet=rs0" --quiet --eval "db.run.deleteOne({source: /^$(params.id)$/i, mode: /^$(params.mode)$/i, "end": null})"

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: fail-bots-restart
  namespace: tekton-tasks
spec:
  params:
  - name: pod
  - name: namespace
  - name: container  
  steps:
    - name: fail-bots-restart
      image: harbor.regemini.io/op/tf:latest   
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #! /bin/bash
        set -x
        echo $(params.pod)
        echo $(params.namespace)
        echo $(params.pod)
        # for i in $(params.pod); do echo $1; done
        kubectl rollout restart deployment $(params.container) -n $(params.namespace)

---

apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: fail-bots-pipeline
  namespace: tekton-tasks
spec:
  params:
  - name: id
  - name: mode
  - name: pod
  - name: namespace
  - name: container   
  tasks:
  - name: fail-bots-mongo
    taskRef:
      name: fail-bots-mongo
    params:
    - name: id
      value: $(params.id)
    - name: mode
      value: $(params.mode)
    - name: pod
      value: $(params.pod)
    - name: container
      value: $(params.container)      
    - name: namespace
      value: $(params.namespace)
  - name: fail-bots-restart
    taskRef:
      name: fail-bots-restart
    params:
    - name: pod
      value: $(params.pod)
    - name: container
      value: $(params.container)      
    - name: namespace
      value: $(params.namespace)      
    runAfter:
      - fail-bots-mongo

---

apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: fail-bots-pipelinerun
  namespace: tekton-tasks
spec:
  serviceAccountName: tekton-bots-webhook
  pipelineRef:
    name: fail-bots-pipeline
  params:
  - name: id
    value: $(params.id)
  - name: mode
    value: $(params.mode)
  - name: pod
    value: $(params.pod)
  - name: container
    value: $(params.container)      
  - name: namespace
    value: $(params.namespace)   

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fail-bots-template
  namespace: tekton-tasks
spec:
  params:
  - name: id
  - name: mode
  - name: pod
  - name: container
  - name: namespace
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: fail-bots-
      spec:
        serviceAccountName: tekton-bots-webhook
        pipelineRef:
          name: fail-bots-pipeline
        params:
        - name: id
          value: $(tt.params.id)
        - name: mode
          value: $(tt.params.mode)
        - name: pod
          value: $(tt.params.pod)
        - name: container
          value: $(tt.params.container)          
        - name: namespace
          value: $(tt.params.namespace)

---

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: fail-bots-trigger
  namespace: tekton-tasks
spec:
  bindings:
  - ref: fail-bots-binding
  template:
    ref: fail-bots-template

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-bots-webhook
  namespace: tekton-tasks
imagePullSecrets:
  - name: harbor

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-bots-triggers-controller-webhook
  namespace: tekton-tasks
subjects:
  - kind: ServiceAccount
    name: tekton-bots-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-bots-triggers-controller-cluster-webhook
  namespace: tekton-tasks
subjects:
  - kind: ServiceAccount
    name: tekton-bots-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-bots-triggers-controller-cluster-workloads
  namespace: tekton-tasks
subjects:
  - kind: ServiceAccount
    name: tekton-bots-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-bots-triggers-workloads-clusterroles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-bots-triggers-workloads-clusterroles
  namespace: tekton-tasks
rules:
- apiGroups: ["apps"]
  resources: ["namespaces", "deployments", "pods"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
