apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: fail-bots-binding
  namespace: tekton-tasks
spec:
  params:
  - name: alertname
    value: $(body.commonLabels.container)
  # - name: severity
  #   value: $(body)
# template:
#   name: fail-bots-template

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fail-bots-template
  namespace: tekton-tasks
spec:
  params:
  - name: alertname
  # - name: severity
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: TaskRun
      metadata:
        generateName: fail-bots-
      spec:
        taskSpec:
          # params:
          #   - name: alertname
            # - name: severity
          steps:
          - name: "bots-test"
            image: ubuntu
            # command: ["sh"]
            # args: ["-c", "echo $(tt.params.alertname)"]            
            script: |
              #! /bin/bash
              echo $(tt.params.alertname) & sleep 3000
