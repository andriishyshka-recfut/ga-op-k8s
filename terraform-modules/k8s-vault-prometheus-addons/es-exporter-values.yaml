elasticsearch:
  cluster: https://mon-coor.monitoring.svc.cluster.local:9200
  queries: |-
    [DEFAULT]
    QueryIntervalSecs = 300
    QueryTimeoutSecs = 10
    QueryIndices = <filebeat-*>
    QueryOnError = drop
    QueryOnMissing = drop

    [query_logstash_exception]
    QueryJson = {"query":{"bool":{"filter":[{"multi_match":{"type":"best_fields","query":"exception","lenient":true}},{"range":{"@timestamp":{"gte":"now-5m"}}},{"match_phrase":{"kubernetes.namespace":"elastic"}},{"match_phrase":{"kubernetes.labels.chart":"logstash"}}]}}}
    [query_logstash_4xx_error]
    QueryJson = {"query":{"bool":{"filter":[{"term":{"kubernetes.container.name":"logstash"}},{"range":{"logstash.error.pipeline_status_code":{"gte":400,"lt":500}}},{"range":{"@timestamp":{"gte":"now-5m"}}}]}}}

container:
  extraEnv:
  - name: ES_EXPORTER_BASIC_PASSWORD
    valueFrom:
          secretKeyRef:
            name: grafana-elastic-creds
            key: password
  extraVolumeMounts:
    - name: foo
      mountPath: "/etc/ssl/certs/"
      readOnly: true
  extraArgs:
    - --basic-user
    - grafana_bg
    - --ca-certs
    - /etc/ssl/certs/ca-certificates.crt

image:
  tag: 0.14.0

pod:
  extraVolumes:
  - name: foo
    secret:
      secretName: grafana-elastic-ca
      items:
      - key: ca.crt
        path: ca-certificates.crt
