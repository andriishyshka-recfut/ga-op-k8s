apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kibanas
  labels:
    release: prometheus
spec:
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      labels:
        module: http_2xx
      static:
      - https://cluster-info.t.regemini.io/ping
      - https://epl.regemini.io
      - https://geminiadvisory.io/wp-content/themes/gemini/img/gear.svg
      - https://k.regemini.com/status
      - https://kiali.p.regemini.io/ping
      - https://kowl.p.regemini.io/ping
      # - https://starling.regemini.com/status
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: harbor
  labels:
    release: prometheus
spec:
  module: harbor
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      labels:
        module: harbor
      static:
      - https://harbor.regemini.io/api/v2.0/health
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ssh
  labels:
    release: prometheus
spec:
  module: ssh_banner
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      labels:
        module: ssh_banner
      static:
      - bka-sftp.regemini.com:2222
      - bmo-sftp.regemini.com:2222
      - chainalysis-sftp.regemini.com:2222
      - creditone-sftp.regemini.com:2222
      - dscvr-sftp.regemini.com:2222
      - fiserv-sftp.regemini.com:2222
      # - s3-sftp.regemini.com:2222
---
