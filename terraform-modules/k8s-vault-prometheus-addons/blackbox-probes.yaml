---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ssh
  labels:
    release: prometheus
spec:
  module: ssh_banner
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      labels:
        module: ssh_banner
      static:
      - bka-sftp.regemini.com:2222
      - bmo-sftp.regemini.com:2222
      - chainalysis-sftp.regemini.com:2222
      - creditone-sftp.regemini.com:2222
      - dscvr-sftp.regemini.com:2222
      - fiserv-sftp.regemini.com:2222
      - s3-sftp.regemini.com:2222
