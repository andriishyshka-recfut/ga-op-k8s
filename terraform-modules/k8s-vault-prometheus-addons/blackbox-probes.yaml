apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kibanas
  labels:
    release: prometheus
spec:
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      labels:
        module: http_2xx
      static:
      - https://bka.regemini.com/status
      - https://cluster-info.t.regemini.io/ping
      - https://epl.regemini.io/ping
      - https://geminiadvisory.io
      - https://k.regemini.com/status
      - https://kiali.p.regemini.io/ping
      - https://kowl.p.regemini.io/ping
      - https://starling.regemini.com/status
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: harbor
  labels:
    release: prometheus
spec:
  module: harbor
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      labels:
        module: harbor
      static:
      - https://harbor.t.regemini.io/chartrepo/op/index.yaml
---
apiVersion: monitoring.coreos.com/v1
