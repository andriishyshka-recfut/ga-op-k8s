apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: bastion-cpu
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 1m
    name: bastionHighCpuUsage
    rules:
    - alert: bastionHighCpuUsage
      annotations:
        description: |
          This means Prod bastion server high cpu usage.
        summary: This means Prod bastion server high cpu usage.
      expr: |
        100 * avg(1 - rate(node_cpu_seconds_total{mode="idle", service="bastion-exporter"}[1m])) > 70
      for: 30s
      labels:
        component: stream-processor
        severity: critical
        cluster: production

---

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: bastion-memory
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 1m
    name: bastionHighMemoryUsage
    rules:
    - alert: bastionHighMemoryUsage
      annotations:
        description: |
          This means Prod bastion server high memory usage.
        summary: This means Prod bastion server high memory usage.
      expr: |
        100 * (1 - ((avg_over_time(node_memory_MemFree_bytes{service="bastion-exporter"}[1m]) + 
        avg_over_time(node_memory_Cached_bytes{service="bastion-exporter"}[1m]) + 
        avg_over_time(node_memory_Buffers_bytes{service="bastion-exporter"}[1m])) / 
        avg_over_time(node_memory_MemTotal_bytes{service="bastion-exporter"}[1m]))) > 75
      for: 30s
      labels:
        component: stream-processor
        severity: critical
        cluster: production

---

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: bastion-disk-space
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: bastionHighFileSystemUsage
    rules:
    - alert: bastionHighFileSystemUsage
      annotations:
        description: |
          This means Prod bastion server high disk space usage.
        summary: This means Prod bastion server high disk space usage.
      expr: |
        (100 - ((node_filesystem_avail_bytes{fstype!="rootfs",mountpoint="/",service="bastion-exporter"} * 100) / 
        node_filesystem_size_bytes{fstype!="rootfs",mountpoint="/",service="bastion-exporter"})) > 80
      for: 10m
      labels:
        component: stream-processor
        severity: critical
        
