apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: generic.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 30m
    name: Cluster resources monitoring
    rules:
    - alert: PodCpuConsumption
      annotations:
        description: |
          Pod CPU consumption is close to its limits
        summary: Hight CPU consumption on {{ $labels.container }}
      expr: |
        (sum (rate (container_cpu_usage_seconds_total [5m])) by (namespace , pod, container )) / sum((kube_pod_container_resource_limits {resource="cpu"} >0)) by (namespace, pod , container ) > 0.9
      for: 10m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: PodMemConsumption
      annotations:
        description: |
          Pod Mem consumption is close to its limits
        summary: Hight Mem consumption on {{ $labels.container }}
      expr: |
        (sum (rate (container_memory_working_set_bytes [5m])) by (namespace , pod, container )) /  sum((kube_pod_container_resource_limits {resource="memory"} >0)) by (namespace, pod , container ) > 0.9
      for: 10m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: KubernetesJobFailed
      annotations:
        description: |
          Kubernetes job was failed {{ $labels.job_name }}
        summary: "{{ $labels.job_name }} job was failed in namespace {{ $labels.namespace }}"
      expr: |
        kube_job_status_failed{namespace !~ "etl"} > 0
      for: 1h
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: PodPhaseFailed
      annotations:
        description: |
          Pods in phase failed
        summary: Pods in phase failed {{ $labels.pod }}
      expr: |
        kube_pod_status_phase{phase="Failed"} == 1
      for: 15m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: warning