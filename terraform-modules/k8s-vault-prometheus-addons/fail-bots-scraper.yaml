apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: fail-bots-scraper
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: Fail bots scraper
    rules:
    - alert: FailBotsScraper
      annotations:
        description: |
          This fail bots collected and will automatically restarted by tekton.
        summary: This fail bots will automatically restarted by tekton. Project - {{ $labels.project }}. ID - {{ $labels.source_id }}. Namespace - {{ $labels.namespace }}.
      expr: |
        kube_pod_container_status_ready{container="whoer-vpn"} == 1
        # min_over_time(scraper_run_waiting_for_request{project='DOME', mode!='CHAT', mode!='PROFILE_FORWARD', mode!='ACTIVITY', mode!='POST_PRIME'}[12h]) == 1
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: warning
