image: quay.io/spotahome/redis-operator
tag: latest
pullPolicy: Always
redisCrd:
  enabled: true
  sentinel:
    replicas: 3
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 100Mi
  redis:
    replicas: 3
    podAnnotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        cpu: 400m
        memory: 500Mi
redisService:
  enabled: true
  clusterIP: None
  portNname: port1
  port: 6379
  targetPort: 6379
