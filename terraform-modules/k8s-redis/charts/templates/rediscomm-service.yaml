{{- if .Values.rediscommService.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: redis-commander-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: redis-commander
  ports:
    - name: {{ .Values.rediscommService.portName }}
      protocol: TCP
      port: {{ .Values.rediscommService.port }}
      targetPort: {{ .Values.rediscommService.targetPort }}
{{- end -}}
