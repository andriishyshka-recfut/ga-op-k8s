apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: {{ .Values.filebeat.name | default "filebeat" }}
  namespace: {{.Values.namespace | default "default" }}
spec:
  type: filebeat
  version: {{ .Values.beatsVersion | default "7.8.0" }}
  elasticsearchRef:
    name: {{ .Values.esName }}
{{- if eq .Values.dashboards.enabled "yes" }}
  kibanaRef:
    name: {{ .Values.dashboards.kibana }}
{{- end }}
  config:
{{ indent 4 .Values.filebeat.config }}
  daemonSet:
    podTemplate:
      spec:
        tolerations:
          - key: "workloadsType"
            operator: "Exists"
            effect: "NoSchedule"
        priorityClassName: {{ .Values.filebeat.priorityClassName }}
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true
        securityContext:
          runAsUser: 0
        containers:
        - name: filebeat
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              cpu: 100m
              memory: 200Mi
          volumeMounts:
          - name: varlogcontainers
            mountPath: /var/log/containers
          - name: varlogpods
            mountPath: /var/log/pods
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
        volumes:
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            