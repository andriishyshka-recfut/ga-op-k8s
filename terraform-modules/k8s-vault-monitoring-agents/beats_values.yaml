
beatsVersion: "7.13.4"
namespace: "monitoring"
esName: "monitoring"
metricbeat:
  name: "mon"
auditbeat:
  name: "audit"
dashboards:
  # Only "yes" take effect
  enabled: "yes"
  kibana: "kibana"
filebeat:
  name: "log"
  config: |
    logging.json: true
    # https://www.elastic.co/guide/en/beats/filebeat/current/configuration-autodiscover.html
    # https://www.elastic.co/guide/en/beats/filebeat/current/configuration-autodiscover-hints.html
    # https://logz.io/blog/what-is-autodiscover-filebeat/
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          host: ${HOSTNAME}
          # https://www.elastic.co/guide/en/beats/filebeat/current/configuration-autodiscover-hints.html
          # hints.enabled: true
          # hints.default_config:
          #   type: container
          #   paths:
          #     - /var/log/containers/*${data.kubernetes.container.id}.log
          templates:
            # https://www.elastic.co/guide/en/beats/filebeat/current/defining-processors.html#conditions
            - condition.contains:
                kubernetes.container.image: vault
              config:
              - type: container
                # https://www.elastic.co/guide/en/beats/filebeat/master/filebeat-input-log.html#filebeat-input-log-config-json
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            - condition.equals:
                kubernetes.namespace: vault
              config:
              - type: container
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
                # https://discuss.elastic.co/t/exclude-lines-regex-for-excluding-all-non-json-logs-is-not-working/167704/8
                exclude_lines: ['^{']  # drop json lines
            - condition.equals:
                kubernetes.namespace: kube-system
              config:
              - type: container
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
                # https://discuss.elastic.co/t/exclude-lines-regex-for-excluding-all-non-json-logs-is-not-working/167704/8
                exclude_lines: ['^{']  # drop json lines
            # Istio access logs
            - condition.contains:
                kubernetes.container.image: istio
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            - condition.contains:
                kubernetes.container.image: falco
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            - condition.contains:
                kubernetes.container.image: oauth2-proxy
              config:
              - type: container
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            - condition.equals:
                kubernetes.namespace: core
              config:
              - type: container
                json.add_error_key: true
                # include_lines: ['^{.*$']
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Maid section
            - condition.equals:
                kubernetes.namespace: maid
              config:
              - type: container
                json.add_error_key: true
                # include_lines: ['^{.*$']
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Crypto section
            - condition.equals:
                kubernetes.namespace: crypto
              config:
              - type: container
                json.add_error_key: true
                # include_lines: ['^{.*$']
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Magescanner section
            - condition.equals:
                kubernetes.namespace: magescanner
              config:
              - type: container
                json.add_error_key: true
                # include_lines: ['^{.*$']
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # camel-k section
            - condition.equals:
                kubernetes.namespace: camel-k
              config:
              - type: container
                json.add_error_key: true
                processors:
                  - rename:
                      fields:
                        - from: "json.level"
                          to: "json.logLevel"
                      ignore_missing: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Minio section
            - condition.equals:
                kubernetes.namespace: minio
              config:
              - type: container
                json.add_error_key: true
                processors:
                  - rename:
                      fields:
                        - from: "json.level"
                          to: "json.logLevel"
                      ignore_missing: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Dome
            - condition.contains:
                kubernetes.namespace: dome-
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Minion
            - condition.contains:
                kubernetes.namespace: minion-
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            #Telegram
            - condition.contains:
                kubernetes.namespace: telegram
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Paste
            - condition.contains:
                kubernetes.namespace: paste-
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Shout
            - condition.contains:
                kubernetes.namespace: shout
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Vortex
            - condition.contains:
                kubernetes.namespace: vortex
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Pi
            - condition.contains:
                kubernetes.namespace: pi
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Auth-ui
            - condition.contains:
                kubernetes.namespace: auth-ui
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Ka
            - condition.contains:
                kubernetes.namespace: ka
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
            # Whirl
            - condition.contains:
                kubernetes.namespace: whirl
              config:
              - type: container
                json.add_error_key: true
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log                           
            # SFTP
            - condition.contains:
                kubernetes.namespace: sftp-jobs
              config:
              - type: container
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log 
            # Twirl
            - condition.contains:
                kubernetes.namespace: twirl
              config:
              - type: container
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log 