apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tg-run
  namespace: tekton-tasks
spec:
  params:
    - name: branch
      type: string
      description: Git branch to use for deployment
      default: master
    - name: path
      type: string
      description: path in k8s repo where to run terragrunt
  workspaces:
  - name: ws
    mountPath: /workspace
  steps:
    - name: tg-apply
      image: harbor.regemini.io/op/opentofu
      env:
        - name: TF_VAR_Color
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: color
        - name: CLUSTER
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: cluster
        - name: CONF_PATH
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: configPath
        - name: VAULT_ADDR
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: vaultAddr
        - name: TF_VAR_RuntimeContext
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: runtimeContext
      script: |
       set +x
       set -e
       export VAULT_TOKEN=$(vault write -field=token auth/k8s-${CLUSTER}-${TF_VAR_Color}/login role=tekton jwt=`cat /var/run/secrets/kubernetes.io/serviceaccount/token`)
       export KUBE_TOKEN=$(vault kv get -field=k8s_sa_token secret/kubernetes-${CLUSTER}-${TF_VAR_Color} )
       export KUBE_HOST=$(vault kv get -field=HOST secret/kubernetes-${CLUSTER}-${TF_VAR_Color} )
       export KUBE_CLUSTER_CA_CERT_DATA=$(vault kv get -field=CLUSTER_CA_CERTIFICATE secret/kubernetes-${CLUSTER}-${TF_VAR_Color} )
       export GIT_USER=$(vault kv get -field=username secret/misc/gitlab/token/read_repo )
       export GIT_TOKEN=$(vault kv get -field=token secret/misc/gitlab/token/read_repo )

       cd $(workspaces.ws.path)
       git clone --single-branch --branch $(params.branch) https://${GIT_USER}:${GIT_TOKEN}@gitlab.regemini.com/op/k8s.git

       source /ansible/bin/activate
       export HOME=$(workspaces.ws.path)

       cd $(workspaces.ws.path)/$(params.path)
       git log -1
       terragrunt apply -auto-approve
---
