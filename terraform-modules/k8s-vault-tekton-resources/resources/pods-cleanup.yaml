---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-crashloopbackoffpod-webhook
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crashloopbackoffpod-crb
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-crashloopbackoffpod-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-crashloopbackoffpod-clusterroles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-crashloopbackoffpod-clusterroles
  namespace: tekton-pipelines
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-crashloopbackoffpod-triggers-controller-webhook
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-crashloopbackoffpod-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-crashloopbackoffpod-triggers-controller-cluster-webhook
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-crashloopbackoffpod-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: crashloopbackoffpod-webhook-alertmanager-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-crashloopbackoffpod-webhook
  triggers:
  - name: crashloopbackoffpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter0"
        value: body.groupLabels.alertname == 'PodPhaseFailed'
      - name: "filter1"
        value: body.groupLabels.alertname == 'KubePodNotReady'
      - name: "overlays"
        value:
        - key: name
          expression: "body.alerts.map(x, x.labels).map(y, y.pod).join(' ')"
        - key: namespace
          expression: "body.alerts.map(x, x.labels).map(y, y.namespace).join(' ')"
    bindings:
      - ref: crashloopbackoffpod-binding
        kind: TriggerBinding 
    template:
      ref: crashloopbackoffpod-template

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: crashloopbackoffpod-binding
  namespace: tekton-pipelines
spec:
  params:
  - name: name
    value: $(extensions.name)
  - name: namespace
    value: $(extensions.namespace)
---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: crashloopbackoffpod-template
  namespace: tekton-pipelines
spec:
  params:
  - name: name
  - name: namespace
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: crashloopbackoffpod-
      spec:
        serviceAccountName: tekton-crashloopbackoffpod-webhook
        pipelineRef:
          name: crashloopbackoffpod-pipeline
        params:
        - name: name
          value: $(tt.params.name)
        - name: namespace
          value: $(tt.params.namespace)

---

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: crashloopbackoffpod-trigger
  namespace: tekton-pipelines
spec:
  bindings:
  - ref: crashloopbackoffpod-binding
  template:
    ref: crashloopbackoffpod-template

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: crashloopbackoffpod-cleanup
  namespace: tekton-pipelines
spec:
  params:
  - name: name
  - name: namespace
  steps:
    - name: crashloopbackoffpod-cleanup
      image: harbor.regemini.io/op/prometheus-tekton:v1.2.0
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #! /bin/bash
        set -x
        [[ -z "$(params.name)" ]] && exit 0
        echo "$(params.name) $(params.namespace)"
        
        IFS=' '
        read -ra PODS <<< "$(params.name)"
        read -ra NAMESPACES <<< "$(params.namespace)"    
        for ((i=0; i<${#PODS[@]}; i++)); do kubectl delete pod ${PODS[i]} -n ${NAMESPACES[i]}; done

---

apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: crashloopbackoffpod-pipeline
  namespace: tekton-pipelines
spec:
  params:
    - name: name
    - name: namespace
  tasks:
    - name: crashloopbackoffpod-cleanup
      taskRef:
        name: crashloopbackoffpod-cleanup
      params:
        - name: name
          value: $(params.name)
        - name: namespace
          value: $(params.namespace)
---

apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: crashloopbackoffpod-pipelinerun
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-crashloopbackoffpod-webhook
  pipelineRef:
    name: crashloopbackoffpod-pipeline
  params:
    - name: name
      value: $(params.name)
    - name: namespace
      value: $(params.namespace)