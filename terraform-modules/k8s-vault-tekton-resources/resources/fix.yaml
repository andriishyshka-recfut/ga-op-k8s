apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tg-fix
  namespace: tekton-tasks
spec:
  params:
    - name: branch
      type: string
      description: Git branch to use for deployment
      default: master
    - name: path
      type: string
      description: path in k8s repo where to run terragrunt
  workspaces:
  - name: ws
    mountPath: /workspace
  steps:
    - name: tg-apply
      image: harbor.regemini.io/op/tf:latest
      env:
        - name: COLOR
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: color
        - name: CLUSTER
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: cluster
        - name: CONF_PATH
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: configPath
        - name: VAULT_ADDR
          valueFrom:
            configMapKeyRef:
              name: cluster-settings
              key: vaultAddr
      script: |
       set +x
       set -e
       export VAULT_TOKEN=$(vault write -field=token auth/k8s-${CLUSTER}-${COLOR}/login role=tekton jwt=`cat /var/run/secrets/kubernetes.io/serviceaccount/token`)
       export KUBE_TOKEN=$(vault kv get -field=k8s_sa_token secret/kubernetes-${CLUSTER}-${COLOR} )
       export KUBE_HOST=$(vault kv get -field=HOST secret/kubernetes-${CLUSTER}-${COLOR} )
       export KUBE_CLUSTER_CA_CERT_DATA=$(vault kv get -field=CLUSTER_CA_CERTIFICATE secret/kubernetes-${CLUSTER}-${COLOR} )
       export GIT_USER=$(vault kv get -field=username secret/gitlab )
       export GIT_TOKEN=$(vault kv get -field=token_read_repo secret/gitlab )

       cd $(workspaces.ws.path)
       git clone --single-branch --branch $(params.branch) https://${GIT_USER}:${GIT_TOKEN}@gitlab.regemini.com/op/k8s.git

       source /ansible/bin/activate
       export HOME=$(workspaces.ws.path)

       cd $(workspaces.ws.path)/$(params.path)
       git log -1
       terragrunt force-unlock -force  621c514d-dd68-cb21-4970-292d0a5afcce
