  namespace: tekton-pipelines
spec:
  bindings:
  - ref: failed-etl-jobs-binding
  template:
    ref: failed-etl-jobs-template

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: failed-etl-jobs-rerun
  namespace: tekton-tasks
spec:
  params:
  - name: job_name
  steps:
    - name: failed-etl-jobs-rerun
      image: harbor.regemini.io/op/prometheus-tekton:v1.2.0
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #! /bin/bash
        set +x
    
        IFS=' '
        for JOB_NAME in $(params.job_name); do
          export CRONJOB_NAME=${JOB_NAME%-*}
          if [[ $(kubectl get cronjobs $CRONJOB_NAME -n etl -o jsonpath='{.spec.suspend}') == "false" ]]; then
            echo "Creating job $CRONJOB_NAME ..."
            kubectl create job -n etl --from=cronjob/$CRONJOB_NAME $([[ $(echo ${CRONJOB_NAME} | wc -c | xargs ) > 52 ]] && echo ${CRONJOB_NAME::-11}-tekton$(date '+%S')-$((0 + RANDOM % 9)) || echo ${CRONJOB_NAME}-tekton$(date '+%S')-$((0 + RANDOM % 9)))
            kubectl delete job -n etl  $JOB_NAME
          else
            echo "Job $CRONJOB_NAME is suspended."
          fi
        done
