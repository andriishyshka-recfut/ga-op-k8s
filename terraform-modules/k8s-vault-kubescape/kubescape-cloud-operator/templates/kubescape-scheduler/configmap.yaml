{{- if and .Values.kubescapeScheduler.enabled .Values.kubescape.enabled  }}
kind: ConfigMap 
apiVersion: v1 
metadata:
  name: {{ .Values.kubescapeScheduler.name }}
  namespace: {{ .Values.ksNamespace }}
  labels:
    app: {{ .Values.kubescapeScheduler.name }}
    tier: {{ .Values.global.namespaceTier }}
data:
  request-body.json: |-
    { "excludedNamespaces": [ "kubescape", "kube-system" ], "format": "html", "keepLocal": true, "submit": false, "targetType": "control", "useCachedArtifacts": false }
{{- end }}
