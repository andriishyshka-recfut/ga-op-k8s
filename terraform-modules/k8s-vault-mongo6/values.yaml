# crVersion: 1.13.0
pause: false
unmanaged: false
allowUnsafeConfigurations: false
multiCluster:
  enabled: false
updateStrategy: RollingUpdate
upgradeOptions:
  versionServiceEndpoint: https://check.percona.com
  apply: disabled
  schedule: "0 2 * * *"
  setFCV: false

image:
  repository: percona/percona-server-mongodb

imagePullPolicy: Always

secrets:
  users: mongo

pmm:
  enabled: false
  image:
    repository: percona/pmm-client
    tag: 2.41.2
  serverHost: monitoring-service

#sharding:
#  enabled: false

#  configrs:
#    size: 3
#    antiAffinityTopologyKey: "kubernetes.io/hostname"

#    podDisruptionBudget:
#      maxUnavailable: 1

#    resources:
#      limits:
#        cpu: "300m"
#        memory: "0.5G"
#      requests:
#        cpu: "300m"
#        memory: "0.5G"
#    volumeSpec:
#      pvc:
#        resources:
#          requests:
#            storage: 3Gi

replsets:
  - name: rs0
    size: 3
    antiAffinityTopologyKey: "kubernetes.io/hostname"

    annotations:
      sidecar.istio.io/proxyCPU: 5m
      sidecar.istio.io/proxyMemory: 30M
      co.elastic.logs/exclude_lines: ^.*"s":"I".*
      

    sidecars:
    - name: mongodb-exporter
      image: percona/mongodb_exporter:latest
      args:
        - "--mongodb.uri=mongodb://$(MONGODB_USER):$(MONGODB_PASSWORD)@$(MONGODB_URI)"
        - "--collect-all"
        - "--compatible-mode"
        - "--mongodb.direct-connect=true"
      env:
        - name: MONGODB_URI
          value: "127.0.0.1:27017"
        - name: MONGODB_USER
          valueFrom:
            secretKeyRef:
              name: mongo
              key: MONGODB_DATABASE_ADMIN_USER
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo
              key: MONGODB_DATABASE_ADMIN_PASSWORD

    nodeSelector:
      workloadsType: data

    tolerations:
      - key: "workloadsType"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node.kubernetes.io/memory-pressure"
        operator: "Exists"
        effect: "NoSchedule"

    podDisruptionBudget:
      maxUnavailable: 1
    expose:
      enabled: false
      exposeType: LoadBalancer
    arbiter:
      enabled: false
      size: 1
      antiAffinityTopologyKey: "kubernetes.io/hostname"

    mongod:
      net:
        port: 27017
        hostPort: 0
      security:
        redactClientLogData: false
        enableEncryption: true
        encryptionKeySecret: my-cluster-name-mongodb-encryption-key
        encryptionCipherMode: AES256-CBC
      setParameter:
        ttlMonitorSleepSecs: 60
        wiredTigerConcurrentReadTransactions: 128
        wiredTigerConcurrentWriteTransactions: 128
      storage:
        engine: wiredTiger
        inMemory:
          engineConfig:
            inMemorySizeRatio: 0.9
        mmapv1:
          nsSize: 16
          smallfiles: false
        wiredTiger:
          engineConfig:
            cacheSizeRatio: 0.5
            directoryForIndexes: false
            journalCompressor: snappy
          collectionConfig:
            blockCompressor: snappy
          indexConfig:
            prefixCompression: true
      operationProfiling:
        mode: slowOp
        slowOpThresholdMs: 100
        rateLimit: 100
sharding:
  configsvrReplSet:
    annotations:
      co.elastic.logs/exclude_lines: ^.*"s":"I".*
  mongos:
    annotations:
      co.elastic.logs/exclude_lines: ^.*"s":"I".*
backup:
  enabled: true
  restartOnFailure: true
  image:
    repository: percona/percona-backup-mongodb
    tag: 2.4.1
  serviceAccountName: psmdb-operator
  storages:
    minio:
      type: s3
      s3:
        region: us-east-4
        credentialsSecret: mongo-backup
        endpointUrl: http://minio.minio:9000/
        prefix: mongo_psmdb
  tasks:
    - name: daily
      enabled: true
      schedule: "15 1 * * *"
      type: logical
      storageName: minio
      keep: 14
    - name: monthly
      enabled: true
      schedule: "15 4 1 * *"
      type: logical
      storageName: minio
      keep: 3
