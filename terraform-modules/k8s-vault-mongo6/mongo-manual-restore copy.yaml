apiVersion: batch/v1
kind: Job
metadata:
  name: mongod6-manual-restore
  namespace: mongo
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: mongo6-manual-restore
        image: mongo
        command: ["bash",  "-c"]
        args:
         - set -e;
           apt-get update -q && apt-get install wget -yq ;
           wget --quiet https://dl.min.io/client/mc/release/linux-amd64/mc ;
           chmod +x mc ;
           for DB_NAME in $BACKUP_TARGETS; do 
           bcp_file=$(/mc find backup/${BACKUP_BUCKET}/mongo6-backup/mongo-main/${DB_NAME}/ --name "*${DATE}*.gz" | sort -n | tail -1);
           echo $bcp_file ;
           /mc cp $bcp_file ${DB_NAME}.gz;
           mongorestore --archive="${DB_NAME}.gz" --gzip --uri=$MONGODB_URL --db ${DB_NAME} ;
           done;
        env:
        - name: DATE
          value: "20240519"
        # Uncomment for Sandbox
        - name: BACKUP_BUCKET
          value: "minio-xbackup-ardent-rarity-239115"
        # # Uncomment for Prod
        # - name: BACKUP_BUCKET
        #   value: "minio-xbackup-orbital-wording"
        - name: BACKUP_TARGETS
          value: "artifact beat beep birl dome geo kaching maid minion os3 os3t review sanitizer telegram upsertMinion useragent vortex whirl"
        - name: MINIO_ACCESS_KEY
          valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key:  accesskey
        - name: MINIO_SECRET_KEY
          valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
        - name: MC_HOST_backup
          value: "http://$(MINIO_ACCESS_KEY):$(MINIO_SECRET_KEY)@minio.minio:9000"
        - name: MONGO_USER
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key: MONGODB_BACKUP_USER
        - name: MONGO_PASS
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key:  MONGODB_BACKUP_PASSWORD
        - name: MONGODB_URL
          value: 'mongodb://$(MONGO_USER):$(MONGO_PASS)@mongo-main-rs0.mongo:27017/?ssl=false&authSource=admin&readPreference=primaryPreferred&replicaSet=rs0'
      restartPolicy: Never
  backoffLimit: 0
