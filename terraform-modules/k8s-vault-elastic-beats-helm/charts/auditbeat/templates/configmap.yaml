---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ template "auditbeat.fullname" . }}-config"
  labels:
    app: "{{ template "auditbeat.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
data:
{{- range $path, $config := .Values.auditbeatConfig }}
  {{ $path }}: |
{{ $config | indent 4 -}}
{{- end -}}