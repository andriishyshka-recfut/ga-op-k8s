---
apiVersion: notification.toolkit.fluxcd.io/v1beta2
kind: Alert
metadata:
  name: helm-alerts
  namespace: flux-system
spec:
  providerRef:
    name: slack
  eventSeverity: info
  eventSources:
    - kind: HelmRelease
      name: '*'
    - kind: HelmRepository
      name: '*'
  exclusionList:
    - "Fetched revision"
    - "failed to download repository index"
