---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoshake
  namespace: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongoshake
  template:
    metadata:
      labels:
        app: mongoshake
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      # hostAliases:
      # - ip: "10.101.23.206"
      #   hostnames:
      #   - "my-cluster-name-rs0-0.my-cluster-name-rs0.mongo.svc.cluster.local"
      # - ip: "10.101.24.6"
      #   hostnames:
      #   - "my-cluster-name-rs0-1.my-cluster-name-rs0.mongo.svc.cluster.local"
      # - ip: "10.101.20.94"
      #   hostnames:
      #   - "my-cluster-name-rs0-2.my-cluster-name-rs0.mongo.svc.cluster.local"
      # 10.101.0.85:32170
      volumes:
      - name: config
        secret:
          secretName: mongoshake-config
      containers:
      - name: mongoshake
        image: mongo
        command: ["bash",  "-c"]
        volumeMounts:
        - name: foo
          mountPath: "/etc/mongoshake"
          readOnly: true
        args:
         - set -e;
           apt-get update -q && apt-get install wget -yq ;
           wget https://github.com/alibaba/MongoShake/releases/download/release-v2.6.5-20210723-1/mongo-shake-v2.6.5.tar.gz -O mongoshake.tar.gz ;
           tar zxvf mongoshake.tar.gz ;
           cd mongo-shake-v2.6.5;
           ./collector.linux -conf=/etc/mongoshake/config -verbose 2
        env:
        - name: MONGO_USER
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key: MONGODB_BACKUP_USER
        - name: MONGO_PASS
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key:  MONGODB_BACKUP_PASSWORD
        - name: MONGODB_URL
          value: 'mongodb://$(MONGO_USER):$(MONGO_PASS)@my-cluster-name-rs0-0:27017,my-cluster-name-rs0-1:27017,my-cluster-name-rs0-2:27017/?ssl=false&authSource=admin&readPreference=primaryPreferred&replicaSet=rs0'
      restartPolicy: Never
  backoffLimit: 4
