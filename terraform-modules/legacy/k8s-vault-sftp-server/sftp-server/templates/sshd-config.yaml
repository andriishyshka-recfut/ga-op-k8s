---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sftp-server.fullname" . }}-sshd-config
data:
  startup_script: |
    for user in $(ls -1 /home); do chown -R $user:users /home/$user/ ; chown root:root /home/$user; done
  sshd_config: |
    Protocol 2
    #LogLevel DEBUG1
    HostKey /etc/ssh/ssh_host_ed25519_key
    HostKey /etc/ssh/ssh_host_rsa_key
    UseDNS no
    PermitRootLogin no
    X11Forwarding no
    AllowTcpForwarding no
    Subsystem sftp internal-sftp
    ForceCommand internal-sftp
    ChrootDirectory %h
    {{- $user_list := join "," .Values.users | replace "\"" "" }}
    {{- range $user, $pass := split "," $user_list }}
    {{- $auth_pass := split ":" $pass }}
    Match User {{ $auth_pass._0 }}
    {{- if $auth_pass._1 }}
      AuthenticationMethods publickey,password
    {{- else }}
      AuthenticationMethods publickey
      PasswordAuthentication no
    {{- end }} 
    {{- end }}