apiVersion: v1
kind: Service
metadata:
  name: {{ include "sftp-server.fullname" . }}
spec:
  ports:
    - port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ include "sftp-server.fullname" . }}
  type: {{ .Values.service.type }}