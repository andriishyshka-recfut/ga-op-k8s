apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      completions: {{ .Values.completions }}
      manualSelector: false
      parallelism: {{ .Values.parallelism }}
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: {{ .Values.istioInjection | quote }}
        spec:
          automountServiceAccountToken: {{ .Values.automountSAT }}
          containers:
            - command:
              {{- range $key := .Values.command }}
              - {{ $key }}
              {{- end }}
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      key: access_key
                      name: sftp-job-minio-user-{{ .Values.config.minioUser }}
                      optional: false
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      key: secret_key
                      name: sftp-job-minio-user-{{ .Values.config.minioUser }}
                      optional: false
                - name: PROMETHEUS_SLACK_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: prometheus_slack_token
                      name: sftp-job-global-creds
                      optional: false
                - name: SFTP_JOBS_SLACK_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: sftp_jobs_slack_token
                      name: sftp-job-global-creds
                      optional: false
                - name: EMAIL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: email_password
                      name: sftp-job-global-creds
                      optional: false
                - name: EMAIL_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: email_username
                      name: sftp-job-global-creds
                      optional: false
              {{- range .Values.envs }}
                - name: {{ .varName }}
                  valueFrom:
                    {{- if eq .envType "secret" }}
                      secretKeyRef:
                        key: {{ .key }}
                        name: {{ $.Values.jobCredsSecretName }}
                        optional: {{ .optional }}
                    {{- end }}
                    {{- if eq .envType "configMap" }}
                      configMapKeyRef:
                        key: {{ .key }}
                        name: {{ $.Values.jobConfigMapName }}
                        optional: {{ .optional }}
                    {{- end }}
              {{- end }}
              {{- range .Values.additionalEnvs }}
                - name: {{ .varName }}
                  valueFrom:
                    {{- if eq .envType "secret" }}
                      secretKeyRef:
                    {{- end }}
                    {{- if eq .envType "configMap" }}
                      configMapKeyRef:
                    {{- end }}
                        key: {{ .key }}
                        name: {{ .name }}
                        optional: {{ .optional }}
              {{- end }}
              image: {{ .Values.image }}
              imagePullPolicy: Always
              name: {{ .Values.name }}
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
              startupProbe:
                exec:
                  command:
                    - cat
                    - /home/ansible/playbook.yml
                initialDelaySeconds: 5
                periodSeconds: 5
              resources:
                limits:
                  cpu: {{ .Values.resources.limits.cpu }}
                  memory: {{ .Values.resources.limits.memory }}
                requests:
                  cpu: {{ .Values.resources.requests.cpu }}
                  memory: {{ .Values.resources.requests.memory }}
              volumeMounts:
                - mountPath: {{ .Values.sshConfig.privateKeyPath }}/{{ .Values.sshConfig.privateKeyName }}
                  name: creds
                  subPath: ssh_key #{{ .Values.sshConfig.privateKeyName }}
                - mountPath: {{ .Values.config.GPGKeyPath }}/{{ .Values.config.GPGKeyName }}
                  name: gpg-creds
                  subPath: gpg_key #{{ .Values.config.GPGKeyName }}
              {{- range .Values.volumeMounts }}
                - name: {{ .name }}
                  mountPath: {{ .mountPath }}
                  {{- if .subPath }}
                  subPath: {{ .subPath }}
                  {{- end}}
                  readOnly: {{ .readOnly }}
              {{- end }}
              {{- range .Values.additionalVolumeMounts }}
                - name: {{ .name }}
                  mountPath: {{ .mountPath }}
                  {{- if .subPath }}
                  subPath: {{ .subPath }}
                  {{- end }}
                  readOnly: {{ .readOnly }}
              {{- end }}
          dnsPolicy: ClusterFirst
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          enableServiceLinks: true
          restartPolicy: Never
          schedulerName: default-scheduler
          shareProcessNamespace: false
          imagePullSecrets:
          {{- range .Values.imagePullSecrets }}
          - name: {{ .name }}
          {{- end }}
          terminationGracePeriodSeconds: 30
          volumes:
          - name: creds
            secret:
              items:
                - key: ssh_key #{{ .Values.sshConfig.privateKeyName }}
                  path: ssh_key #{{ .Values.sshConfig.privateKeyName }}
              defaultMode: 384
              secretName: {{ .Values.jobCredsSecretName }}
          - name: gpg-creds
            secret:
              items:
                - key: gpg_key #{{ .Values.config.GPGKeyName }}
                  path: gpg_key #{{ .Values.config.GPGKeyName }}
              defaultMode: 384
              secretName: {{ .Values.jobCredsSecretName }}
          {{- range .Values.volumes }}
          - name: {{ .volumeName }}
          {{- if eq .type "configMap" }}
            configMap:
          {{- end }}
          {{- if eq .type "secret" }}
            secret:
          {{- end }}
              items:
              {{- range .items }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
              {{- if eq .type "configMap" }}
              name: {{ $.Values.jobConfigMapName }}
              {{- end }}
              {{- if eq .type "secret" }}
              secretName: {{ $.Values.jobConfigMapName }}
              {{- end }}
              defaultMode: {{ .defaultMode }}
          {{- end }}
          {{- range .Values.additionalVolumes }}
          - name: {{ .volumeName }}
          {{- if eq .type "configMap" }}
            configMap:
          {{- end }}
          {{- if eq .type "secret" }}
            secret:
          {{- end }}
              items:
              {{- range .items }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
              {{- if eq .type "configMap" }}
              name: {{ .name }}
              {{- end }}
              {{- if eq .type "secret" }}
              secretName: {{ .name }}
              {{- end }}
              defaultMode: {{ .defaultMode }}
          {{- end }}
  schedule: {{ .Values.cronSchedule | quote }}
  startingDeadlineSeconds: {{ .Values.startDeadlineSec }}
  successfulJobsHistoryLimit: {{ .Values.successJobHistoryLimit }}
  suspend: false
