  appNamespacesTarget: ".*"

  labels: {}

  annotations: {}

  additionalRuleLabels: {}

additionalPrometheusRulesMap: {}

global:
  rbac:
    create: true
    pspEnabled: true
    pspAnnotations: {}

  imagePullSecrets: []

alertmanager:

  enabled: true

  apiVersion: v2

  serviceAccount:
    create: true
    name: ""
    annotations: {}

  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: ""

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
      - match:
          alertname: Watchdog
        receiver: 'null'
    receivers:
    - name: 'null'
    templates:
    - '/etc/alertmanager/config/*.tmpl'

  tplConfig: false

  templateFiles: {}

  ingress:
    enabled: false

    annotations: {}

    labels: {}

    hosts: []

    paths: []

    tls: []

  secret:
    annotations: {}

  ingressPerReplica:
    enabled: false

    annotations: {}
    labels: {}

    hostPrefix: ""

    hostDomain: ""

    paths: []

    tlsSecretName: ""

    tlsSecretPerReplica:
      enabled: false

      prefix: "alertmanager"

  service:
    annotations: {}
    labels: {}
    clusterIP: ""

    port: 9093

    targetPort: 9093

    nodePort: 30903

    additionalPorts: []

    externalIPs: []
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

    type: ClusterIP

  servicePerReplica:
    enabled: false
    annotations: {}

    port: 9093

    targetPort: 9093

    nodePort: 30904

    loadBalancerSourceRanges: []

    type: ClusterIP

  serviceMonitor:

    interval: ""
    selfMonitor: true

    scheme: ""

    tlsConfig: {}

    bearerTokenFile:

    metricRelabelings: []

    relabelings: []

  alertmanagerSpec:

    podMetadata: {}

    image:
      repository: quay.io/prometheus/alertmanager
      tag: v0.21.0
      sha: ""

    useExistingSecret: false

    secrets: []

    configMaps: []

    alertmanagerConfigSelector: {}

    alertmanagerConfigNamespaceSelector: {}

    logFormat: logfmt

    logLevel: info

    replicas: 1

    retention: 120h

    storage: {}

    externalUrl:

    routePrefix: /

    paused: false

    nodeSelector: {}

    resources: {}

    podAntiAffinity: ""

    podAntiAffinityTopologyKey: kubernetes.io/hostname

    affinity: {}

    tolerations: []

    securityContext:
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

    listenLocal: false

    containers: []

    volumes: []

    volumeMounts: []

    initContainers: []

    priorityClassName: ""

    additionalPeers: []

    portName: "web"

    clusterAdvertiseAddress: false

    forceEnableClusterMode: false

grafana:
  enabled: true
  namespaceOverride: "monitoring"

  defaultDashboardsEnabled: true

  adminPassword: prom-operator

  ingress:

    enabled: false

    annotations: {}

    labels: {}

    hosts: []

    path: /

    tls: []

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

      annotations: {}
      multicluster: false
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

      annotations: {}

      createPrometheusReplicasDatasources: false
      label: grafana_datasource

  extraConfigmapMounts: []

  additionalDataSources: []

  service:
    portName: service

  serviceMonitor:

    interval: ""
    selfMonitor: true

    path: "/metrics"

    metricRelabelings: []

    relabelings: []

kubeApiServer:
  enabled: true
  tlsConfig:
    serverName: kubernetes
    insecureSkipVerify: false

  relabelings: []

  serviceMonitor:


    interval: ""
    jobLabel: component
    selector:
      matchLabels:
        component: apiserver
        provider: kubernetes

    metricRelabelings: []

kubelet:
  enabled: true
  namespace: kube-system

  serviceMonitor:

    interval: ""

    https: true

    cAdvisor: true

    probes: true

    resource: false

    resourcePath: "/metrics/resource/v1alpha1"

    cAdvisorMetricRelabelings: []

    probesMetricRelabelings: []

    cAdvisorRelabelings:
      - sourceLabels: [__metrics_path__]
        targetLabel: metrics_path

    probesRelabelings:
      - sourceLabels: [__metrics_path__]
        targetLabel: metrics_path

    resourceRelabelings:
      - sourceLabels: [__metrics_path__]
        targetLabel: metrics_path

    metricRelabelings: []


    relabelings:
      - sourceLabels: [__metrics_path__]
        targetLabel: metrics_path

