replicaCount: 1
dataReplicaCount: 1
esName: "es"
namespace: "monitoring"
appVersion: "7.8.0"
gcs_enable: "no"
labels:
  testlabel: testvalue

elasticNodeSets:
  - name: master
    config: |
      node.roles: 
        - data
      node.store.allow_mmap: false
      index.store.type: niofs
      network.bind_host: 127.0.0.1
      xpack.monitoring.collection.enabled: true
      xpack.security.authc.realms:
        native:
          native1:
            order: 1
    storageSize: 5Gi
    ES_JAVA_OPTS: -Xms4g -Xmx4g
    nodesCount: 1
  - name: data-node
    config: |
      node.roles: 
        - data
      node.store.allow_mmap: false
      index.store.type: niofs
      network.bind_host: 127.0.0.1
      xpack.monitoring.collection.enabled: true
      xpack.security.authc.realms:
        native:
          native1:
            order: 1
    nodesCount: 1
    storageSize: 25Gi
    ES_JAVA_OPTS: -Xms4g -Xmx4g

istio:
  enabled: "no"
  mTLS_enabled: true
  cert_ttl: "144h"

nativeTLS:
  enabled: "no"
oidc_gcloud:
  enabled: "no"
