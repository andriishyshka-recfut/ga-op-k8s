{{- if eq .Values.nativeTLS.enabled "yes" -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.esName }}-es-cert
  namespace: {{ .Values.namespace  }}
spec:
  secretName: {{ .Values.esName }}-es-cert
  commonName: {{ .Values.esName }}-es-http
  dnsNames:
  - {{ .Values.esName }}-es-http
  - {{ .Values.esName }}-es-http.{{ .Values.namespace  }}.svc
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  duration: 600h
{{- end}}
