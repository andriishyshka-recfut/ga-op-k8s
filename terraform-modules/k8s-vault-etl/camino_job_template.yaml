apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: camino-scheduler
  name: camino-scheduler
  namespace: etl
spec:
  concurrencyPolicy: Allow
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: camino
            use-elastic: "true"
            use-kafka: "true"
            zero: "true"
            podMonitor: go
          annotations:
            sidecar.istio.io/inject: "false"
            co.elastic.logs/enabled: 'true'
            co.elastic.logs/json.add_error_key: 'true'
            elasticsearchSecretPath: "/secret/data/elasticsearch-admin/elastic7-v2"
            minioSecretPath: "/secret/data/etl/minio"
            vault.hashicorp.com/auth-path: auth/k8s-sandbox-blue
            vault.hashicorp.com/role: "etl"
            vault.hashicorp.com/agent-requests-cpu: 10m
            vaultAddr: "http://vault-active.vault:8200"
        spec:
          restartPolicy: Never
          containers:
            - name: camino
              image: harbor.regemini.io/dev/camino:{TAG}
              command: [ "sh" ]
              args: [ "-c", "/opt/app/camino" ]
              env:
                - name: VAULT_ADDR
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['vaultAddr']
                - name: VAULT_ROLE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['vault.hashicorp.com/role']
                - name: VAULT_AUTH_PATH
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['vault.hashicorp.com/auth-path']
                - name: ELASTICSEARCH_SECRET_PATH
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['elasticsearchSecretPath']
                - name: MINIO_SECRET_PATH
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['minioSecretPath']
                - name: CONFIG_SECRET_PATH
                  value: /secret/data/camino/jsonTest
                - name: KAFKA_BROKERS
                  value: kafka-cluster-kafka-brokers.kafka:9092
                - name: LOG_LEVEL
                  value: "INFO"
                - name: MINIO_BUCKET
                  value: "minio-logstash-pipelines-xxxxxxx"
                - name: ELASTIC_APM_SERVER_URL
                  value: http://apm-monitoring-apm-http.monitoring:8200
                - name: ELASTIC_APM_SECRET_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: apm-token
                      key: secret-token
                - name: KAFKA_WAIT
                  value: "30s"
          imagePullSecrets:
            - name: harbor
