apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "etl-operator.fullname" . }}
  labels:
    {{- include "etl-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "etl-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "etl-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "etl-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - kopf
            - run
            - -n 
            - {{ .Values.monitoredNamespace }}
            - etl-operator.py
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          - name: NAMESPACE
            value: {{ .Values.monitoredNamespace }}
          - name: MINIO_BUCKET
            value: {{ .Values.minioBucket }}
          - name: VAULT_PATH
            value: {{ .Values.vaultPath }}
          - name: ANSIBLE_GIT_TAG
            valueFrom:
              configMapKeyRef:
                name: etl-tags
                key: ansible-git-tag
          - name: CAMINO_TAG
            valueFrom:
              configMapKeyRef:
                name: etl-tags
                key: camino-tag
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
