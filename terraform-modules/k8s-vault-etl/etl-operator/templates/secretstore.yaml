{{- $secretstore := lookup "v1" "SecretStore" .Release.Namespace "vault-backend" -}}
{{- if not $secretstore -}}

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  annotations:
    vault.hashicorp.com/auth-path: auth/{{ .Values.vaultPath }}
    vault.hashicorp.com/role: {{ .Values.vaultRole }}
    vaultAddr: http://vault-active.vault:8200
  name: vault-backend
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: {{ .Values.vaultPath }}
          role: external-secrets
      server: http://vault-active.vault:8200
      version: v2
{{- end -}}