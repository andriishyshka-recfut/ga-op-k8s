# Default values for etl-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: Always
  repository: harbor.regemini.io/op/etl-operator


imagePullSecrets: 
- name: harbor

nameOverride: ""
fullnameOverride: ""

vaultPath: ""
vaultRole: ""

monitoredNamespace: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

serviceAccount:
  create: false

resources: 
  limits:
    cpu: 100m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 512Mi


nodeSelector: {}

tolerations: []

affinity: {}
