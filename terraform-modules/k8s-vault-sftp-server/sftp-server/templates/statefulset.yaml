{{- $fullName := include "sftp-server.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullName | quote }}
  labels:
    app: {{ $fullName | quote }}
    release: {{ $fullName | quote }}
    {{- include "sftp-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  serviceName: {{ $fullName | quote }}
  selector:
    matchLabels:
      app: {{ $fullName | quote }}
      release: {{ $fullName | quote }}
      {{- include "sftp-server.selectorLabels" . | nindent 6 }}
  updateStrategy:
    rollingUpdate:
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
    type: RollingUpdate
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: "{{ $fullName }}-pvc"
      {{- with .Values.persistence.annotations  }}
      annotations:
{{ toYaml . | indent 8 }}
  {{- end }}
    spec:
{{ toYaml .Values.volumeClaimTemplate | indent 6 }}
  {{- end }}
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: {{ .Values.istioInjection | quote }}
      labels:
        app: {{ $fullName | quote }}
        release: {{ $fullName | quote }}
        {{- include "sftp-server.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: {{ $fullName | quote }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
          volumeMounts:
            - mountPath: /home/
              name: "{{ $fullName }}-pvc"
              readOnly: false
            - mountPath: /etc/ssh/ssh_host_ed25519_key
              name: ssh-host-keys
              readOnly: true
              subPath: ssh_host_ed25519_key
            - mountPath: /etc/ssh/ssh_host_rsa_key
              name: ssh-host-keys
              readOnly: true
              subPath: ssh_host_rsa_key
            - mountPath: /etc/sftp/users.conf
              name: sftp-users
              readOnly: true
              subPath: users_conf
            - mountPath: /etc/ssh/sshd_config
              name: sftp-sshd
              readOnly: true
              subPath: sshd_config
          {{- range $key, $value := .Values.keys }}
          {{ $parts := split ":" ($value | replace "\"" "") }}
            - mountPath: /home/{{ $parts._0 }}/.ssh/keys/
              name: sftp-{{ $parts._0 }}-key
              readOnly: true
          {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 420
            name: {{ $fullName }}-sshd-config
          name: sftp-sshd
        - name: ssh-host-keys
          secret:
            defaultMode: 384
            items:
              - key: ssh_host_rsa_key
                path: ssh_host_rsa_key
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
            secretName: {{ $fullName }}-ssh-host-keys
          name: ssh-host-keys
        - name: sftp-users
          secret:
            defaultMode: 420
            items:
              - key: users_conf
                path: users_conf
            secretName: {{ $fullName }}-users-secret
      {{- range $key, $value := .Values.keys }}
      {{ $parts := split ":" ($value | replace "\"" "") }}
        - name: sftp-{{ $parts._0 }}-key
          secret:
            defaultMode: 420
            items:
              - key: {{ $parts._0 }}
                path: {{ $parts._0 }}
            secretName: {{ $fullName }}-keys-secret
      {{- end }}
