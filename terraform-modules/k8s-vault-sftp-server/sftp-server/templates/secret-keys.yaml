{{- $fullName := include "sftp-server.fullname" . -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $fullName }}-keys-secret"
  labels:
    app: {{ $fullName | quote }}
    chart: {{ $.Chart.Name | quote }}
    heritage: {{ $.Release.Service | quote }}
    release: {{ $.Release.Name | quote }}
    {{- range $key, $value := $.Values.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
data:
  {{- range $key, $value := .Values.keys }}
    {{ $parts := split ":" ($value | replace "\"" "") }}
    {{ $parts._0 }}: {{ print $parts._1 "\n" print $parts._2 "\n" print $parts._3 "\n" print $parts._4 "\n" print $parts._5 "\n" print $parts._6 "\n"| b64enc }}
    {{- end }}
type: Opaque