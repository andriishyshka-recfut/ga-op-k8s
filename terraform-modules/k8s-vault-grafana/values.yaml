datasources:
 datasources.yaml:
   apiVersion: 1
   datasources:
   - name: artifact-ideone.com
     type: elasticsearch
     access: proxy
     url: http://elastic-es-http.elastic:9200
     database: paste-ideone.com-*
     basicAuth: enable
     basicAuthUser: elastic
     secureJsonData:
       # tlsCACert: '...'
       # tlsClientCert: '...'
       # tlsClientKey: '...'
       basicAuthPassword: 5Uk9UL4f5dOu1D2Yd71Ga88R
     jsonData:
       interval: 10s
       timeField: "@timestamp"
       esVersion: 70
       logMessageField: _source
       # logLevelField: fields.level

persistence:
  type: pvc
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi


