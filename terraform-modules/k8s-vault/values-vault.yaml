
global:
      enabled: true

injector:
  enabled: false

server:
      image:
        repository: 'hashicorp/vault'
      annotations:
        co.elastic.logs/enabled: "false"
      tolerations:
      - key: "workloadsType"
        operator: "Exists"
        effect: "NoSchedule"
      nodeSelector:
        workloadsType: data

      extraEnvironmentVars:
        GOOGLE_REGION: global
        GOOGLE_APPLICATION_CREDENTIALS: /vault/userconfig/kms-creds/credentials.json

      livenessProbe:
        enabled: true

      extraVolumes:
        - type: 'secret'
          name: 'kms-creds'

      ha:
        enabled: true
        # disruptionBudget:
        #   maxUnavailable: 0
