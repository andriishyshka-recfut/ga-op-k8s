apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: 01-workloads
  namespace: tekton-tasks
spec:
  workspaces:
  - name: ws
  tasks:
    - name: namespaces
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-namespaces"
        - name: branch
          value: "master"