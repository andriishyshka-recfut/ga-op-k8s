apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "umbrella-vault.fullname" . }}-test-connection"
  labels:
    {{- include "umbrella-vault.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['--no-check-certificate','https://{{ include "umbrella-vault.fqdn" . }}']
  restartPolicy: Never
