apiVersion: cert-manager.io/v1alpha2
kind: Issuer
metadata:
  name: ca-issuer2
  namespace: istio-system
spec:
  ca:
    secretName: basic-ca
---
apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: vault-cert
  namespace: istio-system
  labels:
    {{- include "umbrella-vault.labels" . | nindent 4 }}
spec:
  secretName: vault-cert
  commonName: {{ include "umbrella-vault.fqdn" . }}
  issuerRef:
    name: ca-issuer2
    kind: Issuer
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: vault-gateway
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: vault-cert
      hosts:
        - {{ include "umbrella-vault.fqdn" . }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: vault
spec:
  hosts:
  - "{{ include "umbrella-vault.fqdn" . }}"
  gateways:
  - vault-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 8200
        host: vault.vault.svc.cluster.local
