apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
spec:
  rules:
  {{- range .Values.buckets }}
  - host: "{{ . }}.{{ $.Values.domain }}"
    http:
      paths:
      - backend:
          service:
            name: {{ $.Values.service }}
            port:
              number: {{ $.Values.port }}
        path: /*
        pathType: ImplementationSpecific
    {{- end }}
  tls:
  - hosts:
    {{- range .Values.buckets }}
    - "{{ . }}.{{ .$Values.domain }}"
    {{- end }}
    secretName: {{ .Release.Name }}-cert
