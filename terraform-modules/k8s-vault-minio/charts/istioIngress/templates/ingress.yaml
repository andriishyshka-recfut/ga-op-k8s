apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: istio
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace }}
spec:
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - backend:
          service:
            name: {{ .Values.service }}
            port:
              number: {{ .Values.port }}
        path: /*
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Release.Name }}-cert
