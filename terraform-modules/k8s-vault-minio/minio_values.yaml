existingSecret: "minio-credentials"

replicas: 1

persistence:
  enabled: false
  size: 5Gi

resources:
  requests:
    memory: 0.5Gi
    cpu: 10m
  limits:
   memory: 1G
   cpu: 500m


environment:
  MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email"
  MINIO_IDENTITY_OPENID_CLAIM_NAME: "email"
  GOOGLE_APPLICATION_CREDENTIALS: "/etc/credentials/gcs_key.json"
  MINIO_ETCD_ENDPOINTS: "http://etcd:2379"

etcd:
  endpoints: ["http://etcd:2379"]
  pathPrefix: "/"

image:
  repository: minio/minio
  tag: RELEASE.2020-10-28T08-16-50Z-20-g38f12c984
  pullPolicy: IfNotPresent

gcsgateway:
        enabled: true
        replicas: 3

serviceAccount:
  create: false
