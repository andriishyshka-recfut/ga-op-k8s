existingSecret: "minio-credentials"

replicas: 4

extraArgs: ["--json "]
# extraArgs: ["--json --console-address :9001"]

persistence:
  enabled: false
  size: 5Gi

resources:
  requests:
    memory: 0.5Gi
    cpu: 10m
  limits:
   memory: 1G
   cpu: 500m


environment:
  MINIO_PROMETHEUS_AUTH_TYPE: "public"
  MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email"
  MINIO_IDENTITY_OPENID_CLAIM_NAME: "email"
  GOOGLE_APPLICATION_CREDENTIALS: "/etc/credentials/gcs_key.json"
  MINIO_ETCD_ENDPOINTS: "http://etcd:2379"

etcd:
  endpoints: ["http://etcd:2379"]
  pathPrefix: "/"


image:
  repository: harbor.regemini.io/mirror/minio
  tag: RELEASE.2020-10-28T08-16-50Z
  pullPolicy: IfNotPresent

gcsgateway:
        enabled: true
        replicas: 3

serviceAccount:
  create: false

nodeSelector:
  workloadsType: data
tolerations:
- key: "workloadsType"
  operator: "Exists"
  effect: "NoSchedule"
