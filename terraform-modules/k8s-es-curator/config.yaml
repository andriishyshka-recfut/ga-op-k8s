---
# Remember, leave a key empty if there is no value.  None will be a string,
# not a Python "NoneType"
# client:
#   hosts:
#     - ${ES_HOST}
#   port: 9200
#   url_prefix:
#   use_ssl: True
#   certificate:
#   client_cert:
#   client_key:
#   ssl_no_validate: True
#   username: elastic
#   password: ${ES_PASSWORD}
#   timeout: 30
#   master_only: False
# logging:
#   loglevel: DEBUG
#   logfile:
#   logformat: json
#   blacklist: ['elasticsearch', 'urllib3']
elasticsearch:
  client:
    hosts: https://${ES_HOST}:9200
    verify_certs: false
    ca_certs:
    client_cert:
    client_key:
    request_timeout: 30
  other_settings:
    username: elastic
    password: ${ES_PASSWORD}
    master_only: false
logging:
  loglevel: DEBUG
  logfile:
  logformat: json
  blacklist: []