{{- $dot := . -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-cert
  namespace: istio-ingress
spec:
  dnsNames:
    - {{ $.Values.domain }}
    {{- range .Values.buckets }}
    - "{{ . }}.{{ $.Values.domain }}"
    {{- end }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.issuer }}
  secretName: {{ .Release.Name }}-cert
