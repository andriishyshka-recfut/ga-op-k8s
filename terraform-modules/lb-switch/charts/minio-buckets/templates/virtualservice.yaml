apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
  name: {{ .Release.Name }}-virtualservice
  namespace: minio
spec:
  gateways:
    - istio-ingress/minio-wg-gateway
  hosts:
    - {{ $.Values.domain }}
  {{- range .Values.buckets }}
    - {{ . }}.{{ $.Values.domain }}
  {{- end }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ $.Values.service }}
            port:
              number: {{ $.Values.port }}
