apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: {{ .Values.filebeat.name | default "filebeat" }}
  namespace: {{.Values.namespace | default "default" }}
spec:
  type: filebeat
  version: {{ .Values.beatsVersion | default "7.8.0" }}
  elasticsearchRef:
    name: {{ .Values.esName }}
{{- if eq .Values.dashboards.enabled "yes" }}
  kibanaRef:
    name: {{ .Values.dashboards.kibana }}
{{- end }}
  config:
    filebeat.inputs:
    - type: container
      paths:
      - /var/log/containers/*.log  
    # filebeat:
    #   autodiscover:
    #     providers:
    #     - type: kubernetes
    #       node: ${NODE_NAME}
    #       hints:
    #         enabled: true
    #         default_config:
    #           type: container
    #           paths:
    #           - /var/log/containers/*${data.kubernetes.container.id}.log
    processors:
    - add_cloud_metadata: {}
    - add_host_metadata: {}
  daemonSet:
    podTemplate:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: workloadsType
                  operator: NotIn
                  values:
                  - delete
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true # Allows to provide richer host metadata
        tolerations:
          - key: "workloadsType"  
            operator: "Exists"
            effect: "NoSchedule"                  
        containers:
        - name: filebeat
          securityContext:
            runAsUser: 0
            # If using Red Hat OpenShift uncomment this:
            #privileged: true
          volumeMounts:
          - name: varlogcontainers
            mountPath: /var/log/containers
          - name: varlogpods
            mountPath: /var/log/pods
          - name: varlibdockercontainers
            mountPath: /var/lib/docker/containers
          # env:
          #   - name: NODE_NAME
          #     valueFrom:
          #       fieldRef:
          #         fieldPath: spec.nodeName
          resources:
            limits:
              cpu: 1000m
              memory: 4000Mi
            requests:
              cpu: 100m   
              memory: 300Mi                             
        volumes:
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            
