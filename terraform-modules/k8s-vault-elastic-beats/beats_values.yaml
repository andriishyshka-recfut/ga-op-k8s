
beatsVersion: "7.17.5"
namespace: "elastic"
esName: "elastic"
metricbeat:
  name: "metricbeat"
# auditbeat:
#   name: "auditbeat"
dashboards:
  # Only "yes" take effect
  enabled: "yes"
  kibana: "kibana-lb-1"
filebeat:
  name: "filebeat"
  config: |
    logging.json: true
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          host: ${HOSTNAME}
          templates:
            - condition.equals:
                kubernetes.namespace: kube-system
              config:
              - type: container
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
                exclude_lines: ['^{']  # drop json lines
            - condition.contains:
                kubernetes.container.image: elasticsearch
              config:
              - type: container
                json.add_error_key: true              
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log