
beatsVersion: "7.17.4"
namespace: "elastic"
esName: "elastic"
metricbeat:
  name: "elastic"
# auditbeat:
#   name: "audit"
dashboards:
  # Only "yes" take effect
  enabled: "yes"
  kibana: "kibana"
filebeat:
  name: "log"
  config: |
    logging.json: true
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          host: ${HOSTNAME}
          # https://www.elastic.co/guide/en/beats/filebeat/current/configuration-autodiscover-hints.html
          # hints.enabled: true
          # hints.default_config:
          #   type: container
          #   paths:
          #     - /var/log/containers/*${data.kubernetes.container.id}.log
          templates:
            # https://www.elastic.co/guide/en/beats/filebeat/current/defining-processors.html#conditions
            - condition.equals:
                kubernetes.namespace: kube-system
              config:
              - type: container
                paths:
                  - /var/log/containers/*${data.kubernetes.container.id}.log
                # https://discuss.elastic.co/t/exclude-lines-regex-for-excluding-all-non-json-logs-is-not-working/167704/8
                exclude_lines: ['^{']  # drop json lines
            - condition.equals:
                  kubernetes.namespace: elastic
              config:
              - type: docker
                containers.ids:
                  - "${data.kubernetes.container.id}"
                # multiline:
                #   pattern: '^\[[0-9]{4}-[0-9]{2}-[0-9]{2}|^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
                #   negate: true
                #   match: after
