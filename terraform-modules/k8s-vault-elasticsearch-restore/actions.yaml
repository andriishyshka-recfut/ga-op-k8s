---
actions:
  1:
    action: delete_indices
    description: >-
      delete .kibana_7 indices
    options:
      ignore_empty_list: True
      disable_action: False
    filters:
    - filtertype: pattern
      kind: prefix
      value: .kiabana
  2:
    action: restore
    description: "Restore all indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "minio"
      name:
      indices:
      - .kibana_7.*
      wait_for_completion: False
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
  3:
    action: restore
    description: "Restore filebeat-7 indices in the most recent snapshot with state SUCCESS"
    options:
      repository: "minio"
      # name: 11-12-2021
      indices:
      - filebeat-7*
      rename_pattern: 'filebeat(.+)'
      rename_replacement: 'filebeat-previous$1'
      wait_for_completion: False
      include_global_state: True
      # wait_interval: 20
    filters:
      - filtertype: state
        state: SUCCESS
