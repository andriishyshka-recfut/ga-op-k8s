runners:
  config: |
    concurrent = 12
    check_interval = 0
    [session_server]
      session_timeout = 1800
    [[runners]]
      [runners.kubernetes]
        image = "alpine:3.16.1"
        image_pull_secrets = ["harbor"]
      [runners.cache]
        Type = "s3"
        Path = "/cache/"
        Shared = true
        [runners.cache.s3]
          ServerAddress = "minio.t.regemini.io:443"
          AuthenticationType = "access-key"
          BucketName = "ardent-rarity-239115-gitlab-tmp"
  cache:
    secretName: minio
