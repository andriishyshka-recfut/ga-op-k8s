apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fluxcd-source-controller
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      app: source-controller
  podMetricsEndpoints:
  - port: http-prom
