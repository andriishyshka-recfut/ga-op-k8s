apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: upsert.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 1m
    name: Upsert Alerts
    rules:
    - alert: upsertTreshold
      annotations:
        description: |
          no crypto wallet added in the last 6 hours.
        summary: no crypto wallet added in the last 6 hours.
      expr: |
        increase(worker_upsert_preps_total{record_type="POST"}[6h]) == 0
      for: 5m
      labels:
        cluster: ${cluster_label}
        component: stream-processor
        severity: critical
