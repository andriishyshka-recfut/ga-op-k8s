nameOverride: "prometheus"

namespaceOverride: "monitoring"

fullnameOverride: "prometheus"

grafana:
  envValueFrom:
    ELASTIC_PASSWORD:
      secretKeyRef:
        name: "monitoring-es-elastic-user"
        key: elastic
  additionalDataSources:
    - name: "elastic"
      type:  "elasticsearch"
      url: "https://monitoring-es-http:9200"
      database: "filebeat-*"
      uid: elastic_uid
      basicAuth: true
      isDefault: false
      access: proxy
      basicAuthUser: elastic
      jsonData:
        esVersion: 70
        timeField: "@timestamp"
        tlsSkipVerify: true
      secureJsonData:
        basicAuthPassword: "$ELASTIC_PASSWORD"
  enabled: true
  namespaceOverride: "monitoring"
  podAnnotations:
    sidecar.istio.io/inject: "false"
  grafana.ini:
    auth.google:
      enabled: true
      scopes: https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
      auth_url: https://accounts.google.com/o/oauth2/auth
      token_url: https://accounts.google.com/o/oauth2/token
      allowed_domains: geminiadvisory.io
      allow_sign_up: true
    users:
      auto_assign_org_role: Viewer
  nodeSelector:
    workloadsType: data
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"


kube-state-metrics:
  namespaceOverride: "monitoring"
  customLabels:
    release: prometheus

prometheus-node-exporter:
  namespaceOverride: "monitoring"

prometheusOperator:
  nodeSelector:
    workloadsType: data
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  podAnnotations:
    sidecar.istio.io/inject: "false"
  admissionWebhooks:
    patch:
      podAnnotations:
        sidecar.istio.io/inject: "false"

prometheus:
  nodeSelector:
    workloadsType: data
  tolerations:
    - key: "workloadsType"
      operator: "Exists"
      effect: "NoSchedule"
  prometheusSpec:
    prometheusRulesExcludedFromEnforce: false
    ###  Url for replace internal cluster domain name for generated url in slack messages
    # externalUrl: "https://prometheus.t.regemini.io"
    # externalUrl: "http://localhost:9090"
    # listenLocal: true
    podMetadata:
      annotations:
        sidecar.istio.io/inject: "false"
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi

# Fix for used with istio
alertmanager:
  alertmanagerSpec:
    podMetadata:
      annotations:
        sidecar.istio.io/inject: "false"
    # listenLocal: true
  config:
    global:
      resolve_timeout: 5m
    receivers:
    - name: "null"
    - name: "slack-notifications"
      # slack_configs:
      # - channel: '#prometheus'
      #   send_resolved: true
      #   text: '{{ template "slack.custom.text" . }}'
    - name: "tekton-webhook-notifications-and-slack"
      webhook_configs:
        - send_resolved: false
          url: "http://el-webhook-alertmanager-listener.tekton-pipelines:8080"
      slack_configs:
        - channel: '#prometheus'
          send_resolved: true
          text: '{{ template "slack.custom.text" . }}'
    - name: "tekton-and-slack-woresolve"
      webhook_configs:
        - send_resolved: false
          url: "http://el-webhook-alertmanager-listener.tekton-pipelines:8080"
      slack_configs:
        - channel: '#prometheus'
          send_resolved: false
          text: '{{ template "slack.custom.text" . }}'
    - name: "slack-critical"
      slack_configs:
        - channel: '#prometheus-critical'
          text: '{{ template "slack.custom.text" . }}'
          send_resolved: true
    route:
      group_by:
        - alertname
        - job
      group_interval: 5m
      group_wait: 30s
      receiver: "slack-notifications"
      repeat_interval: 24h
      routes:
        - match:
            alertname: Watchdog
          receiver: "null"
        #Activate this after update prometheus version more than 0.22.2, and disable match_re
        # - matchers: [ "alertname =~ .*" ]
        #   receiver: "tekton-webhook-notifications"
        - match_re:
            alertname: ".*"
          receiver: "tekton-webhook-notifications-and-slack"
          routes:
            - match:
                not_resolve: "yes"
              receiver: "tekton-and-slack-woresolve"
          routes:
            - match:
                severity: critical
                cluster: production
              receiver: slack-critical
    templates:
      - /etc/alertmanager/config/*.tmpl
  templateFiles:
    slack-my.tmpl: |-
      {{ define "slack.custom.text"}}
      {{ with index .Alerts 0 -}}
          :chart_with_upwards_trend: *<{{ .GeneratorURL }}|Graph>*
          {{- if .Annotations.runbook }}   :notebook: *<{{ .Annotations.runbook }}|Runbook>*{{ end }}
      {{ end }}
      *Alert details*:
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Details:*
        {{ range .Labels.SortedPairs -}} • *{{ .Name }}:* `{{ .Value }}`
        {{ end }}
      {{ end }}
      {{ end }}

kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: true

defaultRules:
  rules:
    kubeScheduler: false
    kubernetesResources: false
    kubeApiserver: false

kubeScheduler:
  enabled: false
