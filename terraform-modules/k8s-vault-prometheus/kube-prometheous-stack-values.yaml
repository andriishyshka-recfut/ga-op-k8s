nameOverride: "prometheus"

namespaceOverride: "monitoring"

fullnameOverride: "prometheus"

grafana:
  enabled: true
  namespaceOverride: "monitoring"
  podAnnotations:
    sidecar.istio.io/inject: "false"
  adminPassword: prom-operator
  grafana.ini:
    server:
      root_url: https://grafana.p.regemini.io
    auth.google:
      enabled: true
      scopes: https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
      auth_url: https://accounts.google.com/o/oauth2/auth
      token_url: https://accounts.google.com/o/oauth2/token
      allowed_domains: geminiadvisory.io
      allow_sign_up: true
  nodeSelector:
    workloadsType: data
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"

kube-state-metrics:
  namespaceOverride: "monitoring"

prometheus-node-exporter:
  namespaceOverride: "monitoring"

prometheusOperator:
  nodeSelector:
    workloadsType: data
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  podAnnotations:
    sidecar.istio.io/inject: "false"
  admissionWebhooks:
    patch:
      podAnnotations:
        sidecar.istio.io/inject: "false"

prometheus:
  prometheusSpec:
    prometheusRulesExcludedFromEnforce: false
    ###  Url for replace internal cluster domain name for generated url in slack messages
    # externalUrl: "https://prometheus.t.regemini.io"
    # externalUrl: "http://localhost:9090"
    # listenLocal: true
    podMetadata:
      annotations:
        sidecar.istio.io/inject: "false"

# Fix for used with istio
alertmanager:
  alertmanagerSpec:
    podMetadata:
      annotations:
        sidecar.istio.io/inject: "false"
    # listenLocal: true
  config:
    global:
      resolve_timeout: 5m
    receivers:
    - name: "null"
    - name: "slack-notifications"
      slack_configs:
      - channel: '#prometheus'
        send_resolved: true
        text: '{{ template "slack.custom.text" . }}'
    route:
      group_by:
      - alertname
      - job
      group_interval: 5m
      group_wait: 30s
      receiver: "slack-notifications"
      repeat_interval: 12h
      routes:
      - match:
          alertname: Watchdog
        receiver: "null"
      - match:
          alertname: "KubeSchedulerDown"
        receiver: "slack-notifications"
    templates:
    - /etc/alertmanager/config/*.tmpl
  templateFiles:
    slack-my.tmpl: |-
      {{ define "slack.custom.text"}}
      {{ with index .Alerts 0 -}}
          :chart_with_upwards_trend: *<{{ .GeneratorURL }}|Graph>*
          {{- if .Annotations.runbook }}   :notebook: *<{{ .Annotations.runbook }}|Runbook>*{{ end }}
      {{ end }}
      *Alert details*:
      {{ range .Alerts }}
      *Alert:* {{ .Annotations.summary }}
      *Description:* {{ .Annotations.description }}
      *Details:*
        {{ range .Labels.SortedPairs -}} • *{{ .Name }}:* `{{ .Value }}`
        {{ end }}
      {{ end }}
      {{ end }}

kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: true

defaultRules:
  rules:
    kubeScheduler: false
    kubernetesResources: false
