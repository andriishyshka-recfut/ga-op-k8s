
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: minio
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - minio
  selector:
    matchLabels:
      app: "minio"
  podMetricsEndpoints:
  - interval: 30s
    path: /minio/v2/metrics/node
    targetPort: 9000
