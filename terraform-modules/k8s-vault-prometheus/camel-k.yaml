apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: camel.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
    - interval: 1m
      name: Camel-K Alerts
      rules:
        - alert: CamelTaskRunFailed
          annotations:
            description: |
              Tekton Taskrun was failed
            summary: Tekton Taskrun was failed
          expr: |
            sum(increase(application_camel_route_exchanges_failed_total}[1m])) > 0
          labels:
            severity: warning
            not_resolve: "yes"
