
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: prometheus
  name: harbor
  namespace: monitoring
spec:
  endpoints:
  - honorLabels: true
    port: http-metrics
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app: harbor
      release: harbor
  namespaceSelector:
    matchNames:
    - harbor
