apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: prometheus
  name: go
  namespace: monitoring
spec:
  podMetricsEndpoints:
  - interval: 30s
    port: metrics
    path: /metrics
  namespaceSelector:
    matchNames:
    - magescanner
  selector:
    matchLabels:
      podMonitor: "go"
