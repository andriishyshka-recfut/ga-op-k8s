---

apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: telegram-session-change-proxy-webhook-alertmanager-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-webhook
  triggers:
  - name: telegram-session-change-proxy-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'TelegramRunPrepsServerTotal'
      - name: "overlays"
        value:
        - key: server
          expression: "body.alerts.map(x, x.labels).map(y, y.server).join(' ')"                  
    bindings:
      - ref: telegram-session-change-proxy-binding
        kind: TriggerBinding 
    template:
      ref: telegram-session-change-proxy-template

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: telegram-session-change-proxy-binding
  namespace: tekton-pipelines
spec:
  params:
  - name: server
    value: $(extensions.server)
---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: telegram-session-change-proxy-template
  namespace: tekton-pipelines
spec:
  params:
  - name: server
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: telegram-session-change-proxy-
      spec:
        serviceAccountName: tekton-webhook
        pipelineRef:
          name: telegram-session-change-proxy-pipeline
        params:
        - name: server
          value: $(tt.params.server)

---

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: telegram-session-change-proxy-trigger
  namespace: tekton-pipelines
spec:
  bindings:
  - ref: telegram-session-change-proxy-binding
  template:
    ref: telegram-session-change-proxy-template

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-webhook
  namespace: tekton-pipelines
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-controller-webhook
subjects:
  - kind: ServiceAccount
    name: tekton-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-controller-cluster-webhook
subjects:
  - kind: ServiceAccount
    name: tekton-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: telegram-session-change-proxy-task
  namespace: tekton-pipelines
spec:
  params:
  - name: server
  steps:
    - name: telegram-session-change-proxy
      image: harbor.regemini.io/op/prometheus-tekton:test 
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #! /bin/bash
        set -ex
    
        IFS=' '

        #Prepare config vars and func
        export TELEGRAM_HOST="http://telegram-ui.telegram.svc"
        [[ ${CLUSTER} == "production" ]] && export AUTH_HOST="http://auth-ui.core.svc" || export AUTH_HOST="http://auth-ui.auth-ui.svc"
        export CURL_OPTS="--fail --connect-timeout 10 --max-time 15 --retry 10 --retry-delay 15 --retry-max-time 20 --silent"
        export SWITCH_PAYLOAD='{"session": "SESSION_NAME", "state": true, "switch": "disabled"}'

        for SESSION_NAME in $(params.server); do
          export SWITCH_PAYLOAD_DISABLE=$(jq ".session = \"${SESSION_NAME}\" | .state = true" <(echo $SWITCH_PAYLOAD))

          #Disable respective session
          curl -XPUT $(echo ${CURL_OPTS}) ${TELEGRAM_HOST}:3000/api/v1/sessions/switch -H "Content-Type: application/json"  -d "${SWITCH_PAYLOAD_DISABLE}"
          
          #Working with session config
          export SESSION_CONFIG=$(curl -XPOST $(echo ${CURL_OPTS}) ${TELEGRAM_HOST}:3000/api/v1/sessions/search -H "Content-Type: application/json"  -d '{"pageIndex": 0, "pageSize": 50, "sortDirection": "asc", "sortField": "server", "filter": {}}' | jq ".sessions.[] | select(.server==\"${SESSION_NAME}\")")
          [[ ! -z ${SESSION_CONFIG} ]] || break
          export SESSION_ID=$(jq ."_id" <(echo ${SESSION_CONFIG}) | tr -d '"')
          export CURRENT_PROXY_NAME=$(jq ."proxy" <(echo ${SESSION_CONFIG}) | tr -d '"')

          #Get auth creds from vault
          export VAULT_ADDR="https://vault.p.regemini.io"
          export VAULT_TOKEN=$(vault write -field=token auth/k8s-production-${TF_VAR_Color}/login role=tekton jwt=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token))
          export AUTH_USER="$(vault kv get -field=user  secret/mw/monitoring/prometheus/auth-proxy-credentials)"
          export AUTH_PASSWORD="$(vault kv get -field=password  secret/mw/monitoring/prometheus/auth-proxy-credentials)"
          
          #Set proxy range
          export PROXY_RANGE1=({201..210})
          export PROXY_RANGE2=({323..365})
          export PROXY_RANGE3=({501..510})
          export COMBINED_PROXY_RANGE=("${PROXY_RANGE1[@]}" "${PROXY_RANGE2[@]}" "${PROXY_RANGE3[@]}")
          
          #Choose random proxy from list until working with telegram
          for i in $(echo ${COMBINED_PROXY_RANGE[@]});do

            RANDOM_PROXY=$(printf '%s\n' "${COMBINED_PROXY_RANGE[@]}" | shuf | head -1)
            export RANDOM_PROXY_NAME="PROXY${RANDOM_PROXY}"
            [[ "${CURRENT_PROXY_NAME}" == "${RANDOM_PROXY_NAME}" ]] && continue

            export RANDOM_PROXY=$(curl -XPOST $(echo ${CURL_OPTS}) ${AUTH_HOST}:3000/api/v1/proxies/search -H "Content-Type: application/json" -d '{"filter":{"alive":true,"key":"","provider":null},"sortField":"key","sortDirection":"asc","pageIndex":0,"pageSize":250}' | jq -r ".proxies" | jq -c ".[] | select(.key==\"${RANDOM_PROXY_NAME}\")")
            [[ ! -z ${RANDOM_PROXY} ]] || continue
            export RANDOM_PROXY_ADDRESS=$(echo $RANDOM_PROXY | jq -r .address | cut -d '@' -f2)
            curl $(echo ${CURL_OPTS}) --proxy http://${RANDOM_PROXY_ADDRESS} --proxy-user ${AUTH_USER}:${AUTH_PASSWORD} https://web.telegram.org/ && break
          done
          
          [[ ! -z ${RANDOM_PROXY} ]] || break
          #Apply config with new proxy to respective session
          export SESSION_CONFIG_UPD=$(jq ".proxy = \"${RANDOM_PROXY_NAME}\"" <(echo $SESSION_CONFIG))
          curl -XPUT $(echo ${CURL_OPTS}) "${TELEGRAM_HOST}:3000/api/v1/sessions/${SESSION_ID}" -H "Content-Type: application/json" -d "${SESSION_CONFIG_UPD}" || break
        done
        
        #Wait 10m and enable all affected sessions
        sleep 600

        for SESSION_NAME in $(params.server); do
          export SWITCH_PAYLOAD_ENABLE=$(jq ".session = \"${SESSION_NAME}\" | .state = false" <(echo $SWITCH_PAYLOAD))
          curl -XPUT $(echo ${CURL_OPTS}) ${TELEGRAM_HOST}:3000/api/v1/sessions/switch -H "Content-Type: application/json"  -d "${SWITCH_PAYLOAD_ENABLE}"
        done

---

apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: telegram-session-change-proxy-pipeline
  namespace: tekton-pipelines
spec:
  params:
    - name: server
  tasks:
    - name: telegram-session-change-proxy-task
      taskRef:
        name: telegram-session-change-proxy-task
      params:
        - name: server
          value: $(params.server)
---

apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: telegram-session-change-proxy-pipelinerun
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-webhook
  pipelineRef:
    name: telegram-session-change-proxy-pipeline
  params:
    - name: server
      value: $(params.server)