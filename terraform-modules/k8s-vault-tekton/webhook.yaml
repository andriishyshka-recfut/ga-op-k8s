apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: failed-etl-jobs-rerun
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
  steps:
    - name: failed-etl-jobs-rerun
      image: harbor.regemini.io/op/tf:latest
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #! /bin/bash
        set -x
    
        IFS=' '
        for JOB_NAME in $(params.job_name); do
          export CRONJOB_NAME=${JOB_NAME%-*}
          echo "Creating job $CRONJOB_NAME..."
          kubectl create job -n etl --from=cronjob/$CRONJOB_NAME $CRONJOB_NAME-tekton$(date '+%S')
          kubectl delete job -n etl  $JOB_NAME
        done
