apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: etl-leftovers-rerun
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
  steps:
    - name: etl-leftovers-rerun
      image: harbor.regemini.io/op/tf:latest
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #! /bin/bash
        set -x
        echo $(params.job_name)
    
        IFS=' '
        for CRONJOB_NAME in $(params.job_name); do
          echo "Creating job $CRONJOB_NAME..."
          kubectl create job -n etl --from=cronjob/etl-$CRONJOB_NAME etl-$CRONJOB_NAME-tekton$(date "+%S") || kubectl create job -n etl --from=cronjob/$(kubectl get cronjob -n etl | grep ${CRONJOB_NAME} | awk '{print $1}') $(kubectl get cronjob -n etl | grep ${CRONJOB_NAME} | awk '{print $1}')-tekton$(date "+%S")
        done

