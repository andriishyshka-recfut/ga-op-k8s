apiVersion: triggers.tekton.dev/v1alpha1
kind: EventListener
metadata:
  name: webhook-alertmanager-listener
  namespace: tekton-tasks
spec:
  serviceAccountName: tekton-webhook
  triggers:
  - name: crashloopbackoffpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'KubePodCrashLooping'
    template:
      ref: crashloopbackoffpod-template
---
apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerTemplate
metadata:
  name: crashloopbackoffpod-template
  namespace: tekton-tasks
spec:
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: PipelineRun
    metadata:
      generateName: op-pipeline-run-
    spec:
      workspaces:
      - name: ws
        emptyDir: {}
      pipelineRef:
        name: 05-op
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-webhook
  namespace: tekton-tasks
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-controller-webhook
subjects:
  - kind: ServiceAccount
    name: tekton-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-controller-cluster-webhook
subjects:
  - kind: ServiceAccount
    name: tekton-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io
