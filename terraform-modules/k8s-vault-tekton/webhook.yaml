apiVersion: triggers.tekton.dev/v1alpha1
kind: EventListener
metadata:
  name: webhook-alertmanager-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-webhook
  triggers:
  - name: crashloopbackoffpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'KubePodCrashLooping'
      - name: "filter"
        value: body.groupLabels.alertname == 'PodPhaseFailed'
    template:
      ref: crashloopbackoffpod-template
---
apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerTemplate
metadata:
  name: crashloopbackoffpod-template
  namespace: tekton-pipelines
spec:
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: PipelineRun
    metadata:
      generateName: 07-op-restart-crashloops
    spec:
      workspaces:
      - name: ws
        emptyDir: {}
      pipelineRef:
        name: 07-cleanup
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-webhook
  namespace: tekton-pipelines
---

apiVersion: rbac.authorization.k8s.io/v1
