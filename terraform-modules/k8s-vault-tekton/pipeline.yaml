metadata:
  name: 03-fluxcd
  namespace: tekton-pipelines
spec:
  workspaces:
  - name: ws
  tasks:
    - name: stop-mirrorings
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/03-stop-mirrorings"
        - name: branch
          value: "\\#150_dr"
    - name: fluxcd
      taskRef:
        name: tg-run
      runAfter:
      - stop-mirrorings
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/03-fluxcd"
        - name: branch
          value: "\\#150_dr"
---
