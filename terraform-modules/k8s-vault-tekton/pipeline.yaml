apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: 01-workloads
  namespace: tekton-pipelines
spec:
  workspaces:
  - name: ws
  tasks:
    - name: namespaces
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-namespaces"
        - name: branch
          value: "\\#194-DR-22-07-22"

    - name: minio
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-minio"
        - name: branch
          value: "\\#194-DR-22-07-22"

    - name: mongo
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      - minio
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-mongo"
        - name: branch
          value: "\\#194-DR-22-07-22"

    - name: kafka
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-kafka"
        - name: branch
          value: "\\#194-DR-22-07-22"

    - name: redis
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-redis"
        - name: branch
          value: "\\#194-DR-22-07-22"

    - name: camel-k
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-camel-k"
        - name: branch
          value: "\\#194-DR-22-07-22"

    - name: monitoring-elastic
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      - minio
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-monitoring-elastic"
        - name: branch
          value: "\\#194-DR-22-07-22"
    - name: monitoring-elastic-backup-restore
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      - minio
      - monitoring-elastic
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-monitoring-backup-restore"
        - name: branch
          value: "\\#194-DR-22-07-22"
    - name: monitoring
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      - minio
      - monitoring-elastic-backup-restore
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-monitoring"
        - name: branch
          value: "\\#194-DR-22-07-22"
    - name: external-secrets
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      - monitoring
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-external-secrets"
        - name: branch
          value: "\\#194-DR-22-07-22"

    - name: mirroring
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      - mongo
      - kafka
      - monitoring
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/01-mirroring"
        - name: branch
          value: "\\#194-DR-22-07-22"
---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: 02-data-migration
  namespace: tekton-pipelines
spec:
  workspaces:
  - name: ws
  tasks:
    - name: stop-apps
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/02-stop-apps"
        - name: branch
          value: "\\#194-DR-22-07-22"
    - name: data-migration
      taskRef:
        name: tg-run
      runAfter:
      - stop-apps
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/02-data-migration"
        - name: branch
          value: "\\#194-DR-22-07-22"
---
