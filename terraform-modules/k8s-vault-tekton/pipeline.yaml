apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: workloads
  namespace: tekton-pipelines
spec:
  workspaces:
  - name: ws
  tasks:
    - name: namespaces
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/namespaces"
        - name: branch
          value: "\\#47_minio_caching"

