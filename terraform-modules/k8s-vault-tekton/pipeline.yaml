apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: workloads
  namespace: tekton-pipelines
spec:
  workspaces:
  - name: ws
  tasks:
    - name: namespaces
      taskRef:
        name: tg-run
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/namespaces"
        - name: branch
          value: "\\#47_minio_caching"

    - name: minio
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/minio"
        - name: branch
          value: "\\#47_minio_caching"

    - name: mongo
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      - minio
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/mongo"
        - name: branch
          value: "\\#47_minio_caching"

    - name: kafka
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/kafka"
        - name: branch
          value: "\\#47_minio_caching"
