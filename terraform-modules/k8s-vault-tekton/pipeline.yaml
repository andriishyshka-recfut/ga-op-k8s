apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: workloads
  namespace: tekton-pipelines
spec:
  tasks:
    - name: namespaces
      taskRef:
        name: tg-run
      params:
        - name: path
          value: "k8s/tekton/namespaces"
        - name: branch
          value: "\\#47_minio_caching"
    - name: minio
      taskRef:
        name: tg-run
      runAfter:
      - namespaces
      params:
        - name: path
          value: "k8s/tekton/minio"
        - name: branch
          value: "\\#47_minio_caching"
