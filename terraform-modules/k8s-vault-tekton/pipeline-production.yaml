        - name: branch
          value: "\\#390-DR-15092023"

    - name: tls-proxy
      taskRef:
        name: tg-run
      # runAfter:
      #   - fluxcd       
      workspaces:
        - name: ws
          workspace: ws
      params:
        - name: path
          value: "k8s/tekton/03-tls-proxy"
