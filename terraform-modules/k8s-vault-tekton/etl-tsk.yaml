---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-etl-leftovers-webhook
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-etl-leftovers-triggers-controller-cluster-workloads
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-etl-leftovers-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-etl-leftovers-clusterroles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-etl-leftovers-clusterroles
  namespace: tekton-pipelines
rules:
- apiGroups: ["apps"]
  resources: ["namespaces", "deployments", "pods"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "delete", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-etl-leftovers-triggers-controller-webhook
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-etl-leftovers-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-etl-leftovers-triggers-controller-cluster-webhook
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-etl-leftovers-webhook
    namespace: tekton-pipelines
roleRef:
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io
---

apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: etl-leftovers-webhook-alertmanager-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-etl-leftovers-webhook
  triggers:
  - name: etl-leftovers-filter
    interceptors:
    - ref:
        name: cel
      params:
      - name: filter
        value: body.groupLabels.alertname == 'ETLLeftOvers'
      - name: overlays
        value:
        - key: job_name
          expression: "body.alerts.map(x, x.labels).map(y, y.etl_job_name).join(' ')"                  
    bindings:
      - ref: etl-leftovers-binding
    template:
      ref: etl-leftovers-template

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: etl-leftovers-binding
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
    value: $(extensions.job_name)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: etl-leftovers-template
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: TaskRun
      metadata:
        generateName: etl-leftovers-
      spec:
        serviceAccountName: tekton-etl-leftovers-webhook
        taskRef:
          name: etl-leftovers-rerun
        params:
        - name: job_name
          value: $(tt.params.job_name)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: etl-leftovers-rerun
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
  steps:
    - name: etl-leftovers-rerun
      image: harbor.regemini.io/op/prometheus-tekton:v1.2.0
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #!/bin/bash
        set -x
        for MINIO_PATH in $(params.job_name); do
          echo "Creating job $MINIO_PATH..."
          CRONJOB_NAME=$(kubectl get cronjob -n etl | grep ${MINIO_PATH} | grep etl | awk '{print $1}')
          kubectl create job -n etl --from=cronjob/$CRONJOB_NAME \
            $([[ $(echo ${CRONJOB_NAME} | wc -c | xargs ) > 52 ]] && \
            echo ${CRONJOB_NAME::-11}-tekton$(date '+%S')-$((0 + RANDOM % 9)) || \
            echo ${CRONJOB_NAME}--tekton$(date '+%S')-$((0 + RANDOM % 9)))
        done
---
apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  name: etl-leftovers-taskrun
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-etl-leftovers-webhook
  taskRef:
    name: etl-leftovers-rerun
  params:
    - name: job_name
      value: $(params.job_name)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: failed-etl-jobs-webhook-alertmanager-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-etl-leftovers-webhook
  triggers:
  - name: failed-etl-jobs-filter
    interceptors:
    - ref:
        name: cel
      params:
      - name: filter
        value: body.groupLabels.alertname == 'ETLJobsFailed'
      - name: overlays
        value:
        - key: job_name
          expression: "body.alerts.map(x, x.labels).map(y, y.job_name).join(' ')"                  
    bindings:
      - ref: failed-etl-jobs-binding
    template:
      ref: failed-etl-jobs-template
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: failed-etl-jobs-binding
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
    value: $(extensions.job_name)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: failed-etl-jobs-template
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: TaskRun
      metadata:
        generateName: failed-etl-jobs-
      spec:
        serviceAccountName: tekton-etl-leftovers-webhook
        taskRef:
          name: failed-etl-jobs-rerun
        params:
        - name: job_name
          value: $(tt.params.job_name)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: failed-etl-jobs-rerun
  namespace: tekton-pipelines
spec:
  params:
  - name: job_name
  steps:
    - name: failed-etl-jobs-rerun
      image: harbor.regemini.io/op/prometheus-tekton:v1.2.0
      env:
      - name: TF_VAR_Color
        valueFrom:
          configMapKeyRef:
            key: color
            name: cluster-settings
      - name: CLUSTER
        valueFrom:
          configMapKeyRef:
            key: cluster
            name: cluster-settings
      - name: CONF_PATH
        valueFrom:
          configMapKeyRef:
            key: configPath
            name: cluster-settings
      - name: VAULT_ADDR
        valueFrom:
          configMapKeyRef:
            key: vaultAddr
            name: cluster-settings      
      script: |
        #!/bin/bash
        set -x
        for JOB_NAME in $(params.job_name); do
          CRONJOB_NAME=${JOB_NAME%-*}
          echo "Recreating job $CRONJOB_NAME..."
          kubectl create job -n etl --from=cronjob/$CRONJOB_NAME \
            $([[ $(echo ${CRONJOB_NAME} | wc -c | xargs ) > 52 ]] && \
            echo ${CRONJOB_NAME::-11}-tekton$(date '+%S')-$((0 + RANDOM % 9)) || \
            echo ${CRONJOB_NAME}--tekton$(date '+%S')-$((0 + RANDOM % 9)))
          kubectl delete job -n etl $JOB_NAME
        done
---
apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  name: failed-etl-jobs-taskrun
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-etl-leftovers-webhook
  taskRef:
    name: failed-etl-jobs-rerun
  params:
    - name: job_name
      value: $(params.job_name)

