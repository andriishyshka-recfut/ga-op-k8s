---
apiVersion: kibana.k8s.elastic.co/v1beta1
kind: Kibana
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  version: {{ .Values.kibanaVersion }}
  count: 1
  # secureSettings:
  # - secretName: xpack-security
  # {{- if eq .Values.xpack_security.enabled "yes" }}
  # - secretName: {{ .Values.xpack_security.secret_name }}
  # {{- end }}
  elasticsearchRef:
    name: "{{ .Values.esName }}"
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  podTemplate:
    metadata:
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      containers:
      - name: kibana
        resources:
          requests:
            memory: 0.5Gi
            cpu: 0.5
          limits:
            memory: 1Gi
            cpu: 1
  config:
    server.ssl.supportedProtocols: ["TLSv1.2","TLSv1.3"]
    # server.publicBaseUrl: https://{{ .Values.saml_provider.istio_gateway_fqdn }}
    server.publicBaseUrl: "https://k.regemini.com"
    
{{- if eq .Values.xpack_security.enabled "yes" | default "no" }}  
{{ indent 6 $.Values.xpack_config }}    
{{- end }}

{{- if eq .Values.oidc_provider.enabled "yes" }}
    xpack.security.authc.providers:
      oidc.Google:
        order: 1
        realm: {{ .Values.oidc_provider.realm }}
      basic.basic1:
        order: 2
{{- end }}

{{- if eq .Values.saml_provider.enabled "yes" | default "no" }}
      saml.gsuite:
        order: 0
        realm: {{ .Values.saml_provider.realm }}
    server.xsrf.allowlist: [/api/security/saml/callback]
{{- end }}

{{- if eq .Values.xpack_reporting_index_re.enabled "yes" | default "no" }}
    xpack.reporting.roles.enabled: false
    xpack.reporting.index: ".reporting-re"
    xpack.task_manager.index: ".kibana_task_manager-re"
{{- end }}
