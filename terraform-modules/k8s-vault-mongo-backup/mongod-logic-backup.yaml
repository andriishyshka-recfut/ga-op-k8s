
apiVersion: batch/v1
kind: Job
metadata:
  name: mongod-backup
  namespace: mongo
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-config: "secret/backup/gpg"
        vault.hashicorp.com/role: "mongo"
        vault.hashicorp.com/auth-path: auth/k8s-sandbox-green
        vault.hashicorp.com/agent-inject-template-config: |
          {{ with secret "secret/backup/gpg" -}}
          echo "{{.Data.key}}" | base64 -d | gpg --import
          echo "{{.Data.ownertrust}}" | gpg --import-ownertrust
          {{- end }}
    spec:
      shareProcessNamespace: true
      containers:
      - name: mongod-backup
        image: mongo
        command: ["bash",  "-c"]
        args:
         - set -e;
           apt-get update -q && apt-get install wget -yq ;
           wget --quiet https://dl.min.io/client/mc/release/linux-amd64/mc ;
           chmod +x mc ;
           source /vault/secrets/config ;
           mongodump --archive="auth.tar" --gzip --uri=$MONGODB_URL --db auth ;
           gpg -r Backup  --armor -o - --encrypt auth.tar |  ./mc pipe backup/minio-xbackup-ardent-rarity-239115/mongo/auth ;
           pkill -SIGINT vault;
           # base64 -d /vault/secrets/config | gpg --import
           # echo "CD5EB7C6E709481C38C8125E066861EE58D05091:6:" | gpg --import-ownertrust
           # /mc cp artifact.tar backup/minio-xbackup-ardent-rarity-239115/mongod-backup/artifact.tar;
           # sleep 3d;
        env:
        - name: MINIO_ACCESS_KEY
          valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key:  accesskey
        - name: MINIO_SECRET_KEY
          valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
        - name: MC_HOST_backup
          value: "http://$(MINIO_ACCESS_KEY):$(MINIO_SECRET_KEY)@minio.minio:9000"
        - name: MONGO_USER
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key: MONGODB_BACKUP_USER
        - name: MONGO_PASS
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key:  MONGODB_BACKUP_PASSWORD
        - name: MONGODB_URL
          value: 'mongodb://$(MONGO_USER):$(MONGO_PASS)@my-cluster-name-rs0-0:27017,my-cluster-name-rs0-1:27017,my-cluster-name-rs0-2:27017/?ssl=false&authSource=admin&readPreference=primaryPreferred&replicaSet=rs0'
      restartPolicy: Never
  backoffLimit: 4
