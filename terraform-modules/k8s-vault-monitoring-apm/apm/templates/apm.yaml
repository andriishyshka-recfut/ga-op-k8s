{{- if eq .Values.apm.enabled "yes" -}}
---
apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: apm-{{ .Values.esName }}
  namespace: {{ .Values.namespace  }}
  annotations:
    "helm.sh/hook": post-install
spec:
  version: {{ .Values.appVersion }}
  count: {{ .Values.count }}
  config:
    apm-server:
      ilm:
        enabled: true
        setup:
          enabled: true
          overwrite: true
          # mapping:
          #   - event_type: "error"
          #     policy_name: "apm-ilm"
          #     index_suffix: "%{+yyyy.MM.dd}"
          #   - event_type: "span"
          #     policy_name: "apm-ilm"
          #     index_suffix: "%{+yyyy.MM.dd}"
          #   - event_type: "transaction"
          #     policy_name: "apm-ilm"
          #     index_suffix: "%{+yyyy.MM.dd}"
          #   - event_type: "metric"
          #     policy_name: "apm-ilm"
          #     index_suffix: "%{+yyyy.MM.dd}"
          policies:
            - name: "apm-ilm"
              policy:
                phases:
                  hot:
                    actions:
                      rollover:
                        max_size: "50gb"
                        max_age: "1d"
                      set_priority:
                        priority: 100
                  delete:
                    min_age: "90d"
                    actions:
                      delete: {}
    logging:
      to_stderr: true
      level: info
  elasticsearchRef:
    name: {{ .Values.esName }}
  podTemplate:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        traffic.sidecar.istio.io/excludeInboundPorts: "9300"
        traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
      creationTimestamp: null
    spec: 
      containers:
      - name: apm-server
        resources:
          limits:
            cpu: 700m
            memory: 1Gi
          requests:
            cpu: 350m
            memory: 512Mi
  http:
    service:
      metadata:
        creationTimestamp: null
      spec: {}
    tls:
      certificate: {}
      selfSignedCertificate:
        disabled: true
{{- end}}
