{{- if eq .Values.apm.enabled "yes" -}}
---
apiVersion: apm.k8s.elastic.co/v1
kind: ApmServer
metadata:
  name: apm-{{ .Values.esName }}
  namespace: {{ .Values.namespace  }}
  annotations:
    "helm.sh/hook": post-install
spec:
  version: {{ .Values.appVersion }}
  count: 1
  config:
    apm-server:
      ilm:
        enabled: true
  elasticsearchRef:
    name: {{ .Values.esName }}
  podTemplate:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        traffic.sidecar.istio.io/excludeInboundPorts: "9300"
        traffic.sidecar.istio.io/excludeOutboundPorts: "9300"
      creationTimestamp: null
    spec: 
      containers:
      - name: apm-server
        resources:
          limits:
            cpu: 700m
            memory: 1Gi
          requests:
            cpu: 350m
            memory: 512Mi
  http:
    service:
      metadata:
        creationTimestamp: null
      spec: {}
    tls:
      certificate: {}
      selfSignedCertificate:
        disabled: true
{{- end}}
