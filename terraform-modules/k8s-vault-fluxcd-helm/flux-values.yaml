helmController:
  resources:
    limits:
     cpu: 400m
     memory: 500Mi
    requests:
      cpu: 50m
      memory: 128Mi
  nodeSelector:
    workloadsType: fluxcd
  tolerations:
    - key: workloadsType
      operator: Equal
      value: fluxcd
      effect: NoSchedule
