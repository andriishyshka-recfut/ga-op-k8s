
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
spec:
  kafka:
    template:
      pod:
        tolerations:
          - key: "workloadsType"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                  - key: workloadsType
                    operator: In
                    values:
                      - data

    version: 2.7.0
    replicas: 3
    resources:
      limits:
        cpu: 1
        memory: 2G
      requests:
        cpu: 0.1
        memory: 300M
    listeners:
    - name: external
      port: 9094
      tls: false
      type: nodeport
      configuration:
        bootstrap:
          nodePort: 32100
        brokers:
        - broker: 0
          advertisedHost: broker-0.t.regemini.io
          nodePort: 32200
        - broker: 1
          advertisedHost: broker-1.t.regemini.io
          nodePort: 32201
        - broker: 2
          advertisedHost: broker-2.t.regemini.io
          nodePort: 32202
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      log.message.format.version: "2.5"
      message.max.bytes: 5000000
      retention.ms: 2592000000
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: 500Gi
        deleteClaim: false

  zookeeper:
    replicas: 3
    template:
      pod:
        metadata:
          annotations:
            sidecar.istio.io/inject: False

        tolerations:
          - key: "workloadsType"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: workloadsType
                  operator: In
                  values:
                  - data
    resources:
      limits:
        cpu: 1
        memory: 2G
      requests:
        cpu: 0.1
        memory: 100M
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
