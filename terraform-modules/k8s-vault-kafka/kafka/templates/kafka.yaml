
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
annotations:
  strimzi.io/node-pools: enabled
  strimzi.io/kraft: enabled

spec:
  kafka:
    template:
      pod:
        securityContext:
          runAsUser: 0
        tolerations:
          - key: "workloadsType"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                  - key: workloadsType
                    operator: In
                    values:
                      - data

    version: {{ .Values.kafkaVersion }}
    replicas: {{ .Values.replicas }}
    resources:
      limits:
        cpu: {{ .Values.cpuLimit }}
        memory: {{ .Values.memLimit }}
      requests:
        cpu: {{ .Values.cpuReuest }}
        memory: {{ .Values.memReuest }}
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    - name: external
      port: 9094
      tls: false
      type: nodeport
      configuration:
        bootstrap:
          nodePort: 32100
        brokers:
{{- range untilStep 0 (int .Values.replicas ) 1 }}
        - broker: {{ . }}
          advertisedHost: broker-{{ .}}.{{ $.Values.subdomain }}
          nodePort: 322{{ printf "%02d" . }}
{{- end }}
    config:
      default.replication.factor: 2
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      min.insync.replicas: 1
      message.max.bytes: 5000000
      replica.fetch.max.bytes: 5500000
      retention.ms: 2592000000
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.diskSize }}
        selector:
          target: kafka-data
        deleteClaim: true
        class: ""

  entityOperator:
    topicOperator: {}
    userOperator: {}

