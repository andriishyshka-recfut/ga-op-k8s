
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
spec:
  kafka:
    template:
      pod:
        tolerations:
          - key: "workloadsType"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                  - key: workloadsType
                    operator: In
                    values:
                      - data

    version: 2.7.0
    replicas: 3
    resources:
      limits:
        cpu: 1
        memory: 2G
      requests:
        cpu: 0.1
        memory: 300M
    listeners:
      - name: external
        type: nodeport
        port: 9094
        tls: false
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      log.message.format.version: "2.5"
      message.max.bytes: 5000000
      retention.ms: 2592000000
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: 150Gi
        deleteClaim: false

  zookeeper:
    replicas: 3
    template:
      pod:
        metadata:
          annotations:
            sidecar.istio.io/inject: False

        tolerations:
          - key: "workloadsType"
            operator: "Exists"
            effect: "NoSchedule"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: workloadsType
                  operator: In
                  values:
                  - data
    resources:
      limits:
        cpu: 1
        memory: 2G
      requests:
        cpu: 0.1
        memory: 100M
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
