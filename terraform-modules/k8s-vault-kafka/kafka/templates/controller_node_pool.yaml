apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: {{ .Values.replicas }}
  resources:
    limits:
      cpu: 500
      memory: 1G
    requests:
      cpu: 100m
      memory: 100M
  roles:
  - controller
  storage:
    type: jbod
    volumes:
    - class: ""
      deleteClaim: true
      id: 0
      selector:
        target: kafka-controller
      size: 10Gi
      type: persistent-claim