apiVersion: triggers.tekton.dev/v1alpha1
kind: EventListener
metadata:
  name: bots-webhook-alertmanager-listener
  namespace: tekton-tasks
spec:
  serviceAccountName: bots-tekton-webhook
  triggers:
  - name: crashbotpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'KubeBodCrashBod'
    template:
      ref: bots-crashloopbackoffpod-template

---

apiVersion: triggers.tekton.dev/v1alpha1
kind: TriggerTemplate
metadata:
  name: bots-crashloopbackoffpod-template
  namespace: tekton-tasks
spec:
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: PipelineRun
    metadata:
      generateName: op-pipeline-run-
    spec:
      workspaces:
      - name: ws
        emptyDir: {}
      pipelineRef:
        name: 05-op

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: bots-tekton-webhook
  namespace: tekton-tasks

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bots-tekton-triggers-controller-webhook
subjects:
  - kind: ServiceAccount
    name: bots-tekton-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: bots-tekton-triggers-eventlistener-roles
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bots-tekton-triggers-controller-cluster-webhook
subjects:
  - kind: ServiceAccount
    name: bots-tekton-webhook
    namespace: tekton-tasks
roleRef:
  kind: ClusterRole
  name: bots-tekton-triggers-eventlistener-clusterroles
  apiGroup: rbac.authorization.k8s.io
