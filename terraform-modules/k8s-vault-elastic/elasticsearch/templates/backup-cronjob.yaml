apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: backup-{{ .Values.esName }}
  namespace: {{ .Values.namespace  }}
spec:
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          volumes:
          - name: config-volume
            configMap:
              name: curator-config-{{ .Values.esName }}
          containers:
          - name: curator
            image: bitnami/elasticsearch-curator
            imagePullPolicy: IfNotPresent
            env:
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.esName }}-es-elastic-user
                  key: elastic
            volumeMounts:
              - name: config-volume
                mountPath: /curator
            command:
            - /bin/bash
            - -ec
            - curator --config /curator/config.yml /curator/action_file.yml
          restartPolicy: OnFailure
