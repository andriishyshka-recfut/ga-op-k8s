---
apiVersion: v1
kind: Service
metadata:
  name: mongo-{{ .Values.Color }}-rs0-0
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    statefulset.kubernetes.io/pod-name: my-cluster-name-rs0-0
  ports:
    - name: port1
      protocol: TCP
      port: 27017
      targetPort: 27017
