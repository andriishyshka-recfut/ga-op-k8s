---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
      annotations:
        sidecar.istio.io/proxyCPU: 5m
        sidecar.istio.io/proxyMemory: 30M
    spec:
      containers:
      - name: mongo-express
        image: mongo-express:latest
        ports:
        - containerPort: 8081
        command: ["node"]
        args: ["app"]
        env:
        # - name: PORT
        #   value: "8081"
        # - name: CONN_NAME
        #   value: "cluster"
        # - name: DB_HOST
        #   value: my-cluster-name-rs0
        - name: ME_CONFIG_MONGODB_SERVER
          value: ''
        - name: MONGO_USER
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key: MONGODB_BACKUP_USER
        - name: MONGO_PASS
          valueFrom:
                secretKeyRef:
                  name: mongo
                  key:  MONGODB_BACKUP_PASSWORD
        - name: ME_CONFIG_MONGODB_URL
          value: 'mongodb://$(MONGO_USER):$(MONGO_PASS)@mongo-{{ .Values.Color }}-0:27017,mongo-{{ .Values.Color }}-1:27017,mongo-{{ .Values.Color }}-2:27017/?ssl=false&authSource=admin&readPreference=primaryPreferred&replicaSet=rs0'
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongo-express
spec:
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: mongo-express
