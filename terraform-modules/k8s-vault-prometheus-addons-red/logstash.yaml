apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: logstash.pvc
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 30m
    name: Logstash Pipelines
    rules:
    - alert: LogstashPipeleines
      annotations:
        description: |
          Logstash pipelines volume size
        summary: Logstash pipelines has unsended task 
      expr: |
       kubelet_volume_stats_inodes_used{persistentvolumeclaim="tmp-logstash-red"} > 15
      for: 85m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
    - alert: LogstashPipelinesRestart
      annotations:
        description: |
          Logstash pipelines inodes more than 300
        summary: Logstash pipelines inodes more than 300
      expr: |
       group(kubelet_volume_stats_inodes_used{persistentvolumeclaim="tmp-logstash-red"} > 300) and group(minute() > 35) and group(minute() < 57)
      for: 5m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
   