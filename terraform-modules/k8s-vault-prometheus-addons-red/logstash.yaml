apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: logstash.pvc
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - interval: 5m
    name: Logstash Pipelines
    rules:
    - alert: LogstashPipelinesRestart
      annotations:
        description: |
          Tekton task logstash-inodes-restart had to be triggered automatically (Could check tekton red) 
        summary: Logstash pipelines inodes more than 300
      expr: |
       group(kubelet_volume_stats_inodes_used{persistentvolumeclaim="tmp-logstash-red"} > 300) and group(minute() > 35) and group(minute() < 55)
      for: 5m
      labels:
        cluster: ${cluster_label}
        color: ${cluster_color}
        component: stream-processor
        severity: critical
   