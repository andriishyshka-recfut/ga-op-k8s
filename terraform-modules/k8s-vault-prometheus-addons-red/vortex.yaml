apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: prometheus
  name: vortex
  namespace: monitoring
spec:
  endpoints:
    - port: metrics
      path: /metrics
  selector:
    matchLabels:
      component: vortex
  namespaceSelector:
    matchNames:
      - vortex
