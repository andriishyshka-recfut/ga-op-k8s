apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: cert-manager
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: "controller"
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: tcp-prometheus-servicemonitor
      path: "/metrics"

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: cert.manager.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - name: custom_certmanager_monitoring
    rules:
      - alert: CertManagerACMEProxyReachability
        expr: |
          sum by (host, status, method) (
            rate(certmanager_http_acme_client_request_count{status!~"2.."}[1h])
          ) > 0
        for: 4h
        annotations:
          message: "Cert manager did not receive a successful response from the ACME proxy."
        labels:
          cluster: ${cluster_label}
          color: ${cluster_color}
          component: stream-processor
          severity: critical
      - alert: CertManagerCertExpireSoon
        expr: |
          sum without (exported_namespace)(
            label_replace (
              avg by (exported_namespace, name) (
                certmanager_certificate_expiration_timestamp_seconds - time() < (14 * 24 * 3600) unless ON(name, namespace) 
                  certmanager_certificate_ready_status{condition!="True"} == 1),
                "namespace", "$1", "exported_namespace", "(.+)"
            )
          )
        for: 24h
        annotations:
          message: "The cert {{ $labels.name }} is {{ $value | humanizeDuration }} from expiry."
        labels:
          cluster: ${cluster_label}
          color: ${cluster_color}
          component: stream-processor
          severity: critical
      - alert: CertManagerCertNotReady
        expr: |
          sum without (exported_namespace)(
            label_replace(
              max by (name, exported_namespace, condition, namespace) (
                certmanager_certificate_ready_status{condition!="True"} == 1
              ), "namespace", "$1", "exported_namespace", "(.+)"
            )
          )
        for: 24h
        annotations:
          message: "The cert {{ $labels.name }} is not ready to serve traffic."
        labels:
          cluster: ${cluster_label}
          color: ${cluster_color}
          component: stream-processor
          severity: critical
