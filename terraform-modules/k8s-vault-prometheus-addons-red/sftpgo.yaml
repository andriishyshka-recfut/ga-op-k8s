apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sftpgo
  namespace: monitoring
  labels:
    release: prometheus
spec:
  endpoints:
    - path: /metrics
      port: telemetry
  namespaceSelector:
    matchNames:
      - sftpgo
  selector:
    matchLabels:
      app.kubernetes.io/instance: sftpgo-server-main
      app.kubernetes.io/name: sftpgo
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  namespace: monitoring
  name: sftpgo.rules
  labels:
    app: prometheus
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/part-of: prometheus
    prometheus: k8s
    release: prometheus
    role: alert-rules
spec:
  groups:
  - name: sftpgo_critical
    rules:
      - alert: 
        expr: |
          # Postgresql database availability
          sftpgo_dataprovider_availability != 1
          # Too many connection requests to sftp
          sum(floor(increase(sftpgo_login_attempts_total[3m]))) > 50
          # Errors of all login attempts
          (sum(floor(increase(sftpgo_login_ko_total[30m])))) / (sum(floor(increase(sftpgo_login_attempts_total[30m])))) > 0.3
          # Errors of specific login attempts
          (sum(floor(increase(sftpgo_keyboard_interactive_login_ko_total[30m])))) / (sum(floor(increase(sftpgo_keyboard_interactive_login_attempts_total[30m])))) > 0.3
          (sum(floor(increase(sftpgo_key_and_keyboard_int_login_ko_total[30m])))) / (sum(floor(increase(sftpgo_key_and_keyboard_int_login_attempts_total[30m])))) > 0.3
          (sum(floor(increase(sftpgo_keyboard_interactive_login_ko_total[30m])))) / (sum(floor(increase(sftpgo_keyboard_interactive_login_attempts_total[30m])))) > 0.3
          (sum(floor(increase(sftpgo_password_login_ko_total[30m])))) / (sum(floor(increase(sftpgo_password_login_attempts_total[30m])))) > 0.3
          (sum(floor(increase(sftpgo_public_key_login_ko_total[30m])))) / (sum(floor(increase(sftpgo_public_key_login_attempts_total[30m])))) > 0.3
          # S3 other operations errors
          (sum(floor(increase(sftpgo_s3_copy_object_errors[30m])))) / (sum(floor(increase(sftpgo_s3_copy_object[30m])))) > 0.3
          (sum(floor(increase(sftpgo_s3_delete_object_errors[30m])))) / (sum(floor(increase(sftpgo_s3_delete_object[30m])))) > 0.3
          (sum(floor(increase(sftpgo_s3_list_objects_errors[1h])))) / (sum(floor(increase(sftpgo_s3_list_objects[1h])))) > 0.3
          # S3 download/upload errors
          (sum(floor(increase(sftpgo_s3_download_errors_total[30m])))) / (sum(floor(increase(sftpgo_s3_downloads_total[30m])))) > 0.3
          (sum(floor(increase(sftpgo_s3_upload_errors_total[30m])))) / (sum(floor(increase(sftpgo_s3_uploads_total[30m])))) > 0.3
          # All download/upload errors
          (sum(floor(increase(sftpgo_upload_errors_total[30m])))) / (sum(floor(increase(sftpgo_uploads_total[30m])))) > 0.3
          (sum(floor(increase(sftpgo_download_errors_total[30m])))) / (sum(floor(increase(sftpgo_downloads_total[30m])))) > 0.3
          # SSH commands errors
          (sum(floor(increase(sftpgo_ssh_commands_total[30m])))) / (sum(floor(increase(sftpgo_ssh_command_errors_total[30m])))) > 0.3
        for: 5m
        annotations:
          message: "SFTPGO-critical"
        labels:
          cluster: ${cluster_label}
          color: ${cluster_color}
          severity: critical
  - name: sftpgo_warning
    rules:
      - alert: 
        expr: |
          # S3 download/upload size
          (sum(increase(sftpgo_s3_upload_size[1h])) / 1000000) > 100
          (sum(increase(sftpgo_s3_download_size[1h])) / 1000000) > 100
          # S3 other operations errors
          (sum(floor(increase(sftpgo_s3_head_object_errors[1h])))) / (sum(floor(increase(sftpgo_s3_head_object[1h])))) > 0.3
          # HTTP requests errors
          (sum(floor(increase(sftpgo_http_server_errors_total[1h]))) / (sum(floor(increase(sftpgo_http_req_total[1h])))) > 0.3
          (sum(floor(increase(sftpgo_http_client_errors_total[30m])))) / (sum(floor(increase(sftpgo_http_req_total[30m])))) > 0.3
          # HTTPFS download/upload errors
          (sum(floor(increase(sftpgo_httpfs_download_errors_total[30m])))) / (sum(floor(increase(sftpgo_httpfs_downloads_total[30m])))) > 0.3
          (sum(floor(increase(sftpgo_httpfs_upload_errors_total[30m])))) / (sum(floor(increase(sftpgo_httpfs_uploads_total[30m])))) > 0.3
        for: 5m
        annotations:
          message: "SFTPGO-warning"
        labels:
          cluster: ${cluster_label}
          color: ${cluster_color}
          severity: warning