apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sftpgo
  namespace: monitoring
  labels:
    release: prometheus
spec:
  endpoints:
    - path: /metrics
      port: telemetry
  namespaceSelector:
    matchNames:
      - sftpgo
  selector:
    matchLabels:
      app.kubernetes.io/instance: sftpgo-server-main
      app.kubernetes.io/name: sftpgo