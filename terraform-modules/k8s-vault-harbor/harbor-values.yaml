expose:
  type: ClusterIP
  clusterIP:
    name: harbor
  tls:
    enabled: false

externalURL: "https://harbor.infra.digaweb.com"
logLevel: debug

persistence:
  imageChartStorage:
    type: gcs

nginx:
  replicas: 0
  podAnnotations:
    sidecar.istio.io/inject: "false"

database:
  podAnnotations:
    sidecar.istio.io/inject: "false"
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
redis:
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data


core:
  replicas: 1
chartmuseum:
  replicas: 1
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
notary:
  server:
    replicas: 1
  signer:
    replicas: 1
portal:
  replicas: 1
jobservice:
  replicas: 1
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
registry:
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
trivy:
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
