expose:
  type: ClusterIP
  clusterIP:
    name: harbor
  tls:
    enabled: false

externalURL: "https://harbor.infra.digaweb.com"

persistence:
  imageChartStorage:
    type: gcs

nginx:
  replicas: 0
  podAnnotations:
    sidecar.istio.io/inject: "false"

database:
  podAnnotations:
    sidecar.istio.io/inject: "false"

core:
  replicas: 1
chartmuseum:
  replicas: 1
notary:
  server:
    replicas: 1
  signer:
    replicas: 1
portal:
  replicas: 1
jobservice:
  replicas: 1
