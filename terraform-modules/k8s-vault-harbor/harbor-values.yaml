expose:
  type: ClusterIP
  clusterIP:
    name: harbor
  tls:
    enabled: false

externalURL: "https://harbor.regemini.io"
logLevel: debug

persistence:
  imageChartStorage:
    type: s3
    disableredirect: true
    s3:
      region: minio
      bucket: harbor-orbital-wording-233917
      regionendpoint: https://minio.p.regemini.io
      encrypt: false
      secure: false
      v4auth: true
      rootdirectory: /
      multipartcopychunksize: "5242880"
      multipartcopymaxconcurrency: 5
      multipartcopythresholdsize: "10485760"

nginx:
  replicas: 0
  podAnnotations:
    sidecar.istio.io/inject: "false"

database:
  podAnnotations:
    sidecar.istio.io/inject: "false"
  internal:
     tolerations:
     - key: "workloadsType"
       operator: "Exists"
       effect: "NoSchedule"
     nodeSelector:
       workloadsType: data
redis:
  internal:
     tolerations:
     - key: "workloadsType"
       operator: "Exists"
       effect: "NoSchedule"
     nodeSelector:
       workloadsType: data


core:
  replicas: 2
  podAnnotations:
    sidecar.istio.io/inject: "false"
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
portal:
  replicas: 2
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
jobservice:
  replicas: 1
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
registry:
  podAnnotations:
    sidecar.istio.io/inject: "false"
  replicas: 3
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data
trivy:
  podAnnotations:
    sidecar.istio.io/inject: "false"
  tolerations:
  - key: "workloadsType"
    operator: "Exists"
    effect: "NoSchedule"
  nodeSelector:
    workloadsType: data

metrics:
  enabled: true
