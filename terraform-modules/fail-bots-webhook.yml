apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: fail-bots-webhook-alertmanager-listener
  namespace: tekton-tasks
spec:
  serviceAccountName: tekton-webhook
  # serviceAccountName: fail-bots-tekton-webhook
  triggers:
  - name: failbotpod-filter
    interceptors:
    - ref:
        name: "cel"
      params:
      - name: "filter"
        value: body.groupLabels.alertname == 'FailBotsScraper'
    bindings:
      - ref: fail-bots-binding
        kind: TriggerBinding      
    template:
      ref: fail-bots-template

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: fail-bots-binding
  namespace: tekton-tasks  
spec:
  params:
    - name: label
      value: $(header)
    - name: body
      value: $(body)

---

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fail-bots-template
  namespace: tekton-tasks
spec:
  params:
    - name: label
    - name: body
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: TaskRun
      metadata:
        generateName: fail-bots-
      spec:
        taskSpec:
          # resources:
          #   inputs:
          #     - name: source
          #       type: cel
          steps:
            - image: ubuntu
              env:
                - name: PARAMS
                  value: "$(params)"
                # - name: BODY
                #   value: $(params.body)                  
                # - name: LABELS
                #   value: $(params.label)            
              script: |
                #! /bin/bash
                echo test & sleep 300
        # resources:
        #   inputs:
        #     - name: source
        #       resourceSpec:
        #         type: cel
        #         params:
        #           - name: service
        #             value: $(tt.params.service)
        #           - name: label
        #             value: $(tt.params.label)

---

apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: fail-bots-trigger
spec:
  bindings:
    - ref: fail-bots-binding
  template:
    ref: fail-bots-template


