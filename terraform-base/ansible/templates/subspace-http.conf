server {
    listen 8443 ssl http2;
    server_name {{ bastion_dns }} ;

    ssl_certificate /etc/letsencrypt/live/{{ bastion_dns }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ bastion_dns }}/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets off;

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (ngx_http_headers_module is required) (63072000 seconds)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # verify chain of trust of OCSP response using Root CA and Intermediate certs
    ssl_trusted_certificate /etc/letsencrypt/live/{{ bastion_dns }}/chain.pem;

    # replace with the IP address of your resolver
    resolver 169.254.169.254;



    #Headers
        server_tokens off;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Cache-Control no-cache;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_hide_header X-Powered-By;
        #add_header Pragma no-cache ;
        add_header Expires 0 ;
        proxy_set_header        Host               $host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Host   $host:443;
        proxy_set_header        X-Forwarded-Server $host;
        proxy_set_header        X-Forwarded-Port   443;
        proxy_set_header        X-Forwarded-Proto  https;
    location / {
      proxy_pass http://{{ nginx_container_info.container.NetworkSettings.Networks['bastion-compose_default'].Gateway | regex_replace('"') }}:8080 ;
    }
}
